    if (!this.on || !this.ac) return;
    const t = this.ac.currentTime, s = this.ac.createBufferSource(); s.buffer = this.noise;
    const f = this.ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(2500, t + 0.6);
    f.frequency.exponentialRampToValueAtTime(400, t + CFG.flyTime);
    const g = this.ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.45, t + 0.15);
    g.gain.exponentialRampToValueAtTime(0.0001, t + CFG.flyTime);
    s.connect(f).connect(g).connect(this.ac.destination); s.start(t); s.stop(t + CFG.flyTime + 0.1);
    this.tone('sawtooth', 120, 600, 1.2, 0.08);
  },
  result() { [523, 659, 784, 1047].forEach((f, i) => this.tone('triangle', f, f, 0.3, 0.13, i * 0.12)); },
};

// ---------- 状態 ----------
// ready → count（3・2・1） → tap（れんだ） → fly → result
const G = { mode: 'ready', t: 0, modeT: 0, taps: 0, goal: 0, alt: 0, lastInput: 0, squash: 0, shake: 0, lastBeep: 0 };
const parts = [], pops = [];
let deco = [];      // とんでいくときに見えるもの（とり・くも・ひこうき など）

function setMode(m) { G.mode = m; G.modeT = 0; }
function reset() { G.taps = 0; G.alt = 0; G.goal = 0; parts.length = 0; pops.length = 0; setMode('ready'); }

function makeDeco(goal) {
  deco = [];
  const add = (from, to, n, kind) => {
    for (let i = 0; i < n; i++) {
      const m = rand(from, to);
      if (m < goal + 400) deco.push({ m, x: rand(0.05, 0.95), kind, s: rand(0.8, 1.3), dir: Math.random() < 0.5 ? -1 : 1 });
    }
  };
  add(550, 1350, 14, 'cloud');
  add(1600, 2100, 3, 'plane');
  add(2400, 3400, 4, 'sat');
}

// ---------- 入力 ----------
function input(x, y) {
  Snd.init();
  G.lastInput = G.t;
  if (G.mode === 'ready') { setMode('count'); G.lastBeep = -1; return; }
  if (G.mode === 'tap') {
    G.taps++; G.squash = 1;
    const p = clamp(G.taps / 80, 0, 1);
    Snd.tap(p);
    for (let i = 0; i < 4; i++) {
      const a = rand(0, 6.28), s = rand(15, 35) * U;
      parts.push({ x: W / 2, y: robotY(), vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.6), c: Math.random() < 0.5 ? '#ffe14d' : '#7fe3ff', r: rand(0.5, 1.1) * U });
    }
    return;
  }
  if (G.mode === 'result' && G.modeT > 1.5) reset();
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); input(e.clientX, e.clientY); });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') toggleFull();
  else if (e.key === 'm' || e.key === 'M') toggleSound();
  else if (e.key === 'Escape') goHome();
  else if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) { e.preventDefault(); input(W / 2 + rand(-10, 10) * U, H / 2); }
});
function goHome() {
  if (window.parent !== window) window.parent.postMessage({ type: 'minigame-exit', game: GAME_ID }, '*');
  else history.back();
}
function toggleFull() {
  const de = document.documentElement;
  if (!(document.fullscreenElement || document.webkitFullscreenElement)) {
    if (de.requestFullscreen) de.requestFullscreen().catch(() => {});
    else if (de.webkitRequestFullscreen) de.webkitRequestFullscreen();
  } else if (document.exitFullscreen) document.exitFullscreen();
  else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
}
function toggleSound() { Snd.on = !Snd.on; Snd.init(); $('bSound').textContent = Snd.on ? '🔊' : '🔇'; }
$('bHome').onclick = goHome; $('bFull').onclick = toggleFull; $('bSound').onclick = toggleSound;
$('ui').addEventListener('pointerdown', e => e.stopPropagation());

// ---------- かく ----------
const FONT = '"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","BIZ UDPGothic","Meiryo",system-ui,sans-serif';
const EMOJI = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
function outlined(text, x, y, size, fill, stroke = '#1d2b53', lw = 0.2) {
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * lw; ctx.strokeStyle = stroke;
  ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y);
}
const groundY = () => H * 0.82;        // 地面（高さ0m）の画面の位置
// ロボットの画面での高さ（とんでいるときは画面のまん中あたりにいる）
function robotY() {
  if (G.mode !== 'fly' && G.mode !== 'result') return groundY() - roboSize() * 0.42;
  const base = groundY() - roboSize() * 0.42;
  return lerp(base, H * 0.42, clamp(G.alt / 60, 0, 1));
}
const roboSize = () => Math.min(W * 0.45, H * 0.36);
// 高さ m のものが、いま画面のどこに見えるか
function screenY(m) {
  const k = H / 260;                  // 260m で画面ひとつぶん
  return robotY() - (m - G.alt) * k;
}

function skyColor(alt) {
  // 0m：青空 → SPACE：うちゅう
  const t = clamp(alt / SPACE, 0, 1);
  const top = [lerp(70, 8, t), lerp(160, 10, t), lerp(240, 40, t)];
  const bot = [lerp(170, 20, t), lerp(225, 25, t), lerp(255, 70, t)];
  return [top, bot, t];
}
function drawCloud(x, y, s, a) {
  ctx.globalAlpha = a; ctx.fillStyle = '#fff';
  const r = 5 * U * s;
  ctx.beginPath();
  ctx.arc(x - r * 1.3, y, r * 0.9, 0, 7); ctx.arc(x, y - r * 0.5, r * 1.2, 0, 7); ctx.arc(x + r * 1.3, y, r, 0, 7);
  ctx.rect(x - r * 1.8, y, r * 3.6, r * 0.7);
  ctx.fill(); ctx.globalAlpha = 1;
}

// ---------- メインループ ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  G.t += dt; G.modeT += dt;
  G.squash = Math.max(0, G.squash - dt * 8);
  G.shake = Math.max(0, G.shake - dt * 2);

  if (G.mode === 'count') {
    const n = 3 - Math.floor(G.modeT);
    if (n !== G.lastBeep && n >= 1) { G.lastBeep = n; Snd.beep(false); }
    if (G.modeT >= 3) { setMode('tap'); Snd.beep(true); }
  } else if (G.mode === 'tap') {
    if (G.modeT >= CFG.tapTime) {
      G.goal = Math.max(10, G.taps * CFG.meterPerTap);
      makeDeco(G.goal);
      setMode('fly'); Snd.launch(); G.shake = 1;
    }
  } else if (G.mode === 'fly') {
    // はじめは速く、さいごはゆっくり止まる
    const t = clamp(G.modeT / CFG.flyTime, 0, 1);
    G.alt = G.goal * (1 - Math.pow(1 - t, 3));
    // ふん射のけむり
    for (let i = 0; i < 3; i++) parts.push({ x: W / 2 + rand(-2, 2) * U, y: robotY() + roboSize() * 0.38, vx: rand(-8, 8) * U, vy: rand(20, 45) * U, life: rand(0.4, 0.8) * (1 - t * 0.7), c: Math.random() < 0.5 ? '#ffb23d' : '#fff3a8', r: rand(1.2, 2.4) * U * (1 - t * 0.5), smoke: true });
    if (t >= 1) { setMode('result'); G.lastInput = G.t; Snd.result(); }
  } else if (G.mode === 'result') {
    if (G.t - G.lastInput > CFG.resultIdle) reset();
  }

  // ---- 空 ----
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const [top, bot, st] = skyColor(G.alt);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, `rgb(${top.map(Math.round)})`); sky.addColorStop(1, `rgb(${bot.map(Math.round)})`);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  if (st > 0.3) {
    for (const s of stars) {
      ctx.globalAlpha = (st - 0.3) / 0.7 * (0.5 + 0.5 * Math.sin(G.t * 2 + s.ph));
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r * U, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  if (G.shake > 0) ctx.translate(rand(-1, 1) * G.shake * U, rand(-1, 1) * G.shake * U);

  // 地面の木
  const gy0 = screenY(0) + roboSize() * 0.42;
  if (gy0 < H + 20 * U) {
    ctx.font = `${12 * U}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    for (const fx of [0.08, 0.22, 0.78, 0.92]) ctx.fillText('🌳', fx * W, gy0 + 1 * U);
  }
  // とちゅうで見えるもの
  for (const d of deco) {
    const y = screenY(d.m);
    if (y < -20 * U || y > H + 20 * U) continue;
    const x = d.x * W + (d.kind === 'bird' || d.kind === 'plane' ? d.dir * G.t * 6 * U % W : 0);
    if (d.kind === 'cloud') drawCloud(d.x * W, y, d.s * 1.4, 0.9);
    else {
      const em = { bird: '🐦', plane: '✈️', sat: '🛰️' }[d.kind];
      ctx.font = `${6 * U * d.s}px ${EMOJI}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.save(); ctx.translate(((x % W) + W) % W, y); if (d.dir > 0) ctx.scale(-1, 1);
      ctx.fillText(em, 0, 0); ctx.restore();
    }
  }
  // 地面と はっしゃ台
  const gy = screenY(0) + roboSize() * 0.42;
  if (gy < H + 10) {
    ctx.fillStyle = '#6cc04a'; ctx.fillRect(0, gy, W, H - gy + 10);
    ctx.fillStyle = '#58a63a'; ctx.fillRect(0, gy, W, 1.5 * U);
    ctx.fillStyle = '#5a6788'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(W / 2 - roboSize() * 0.55, gy - 2 * U, roboSize() * 1.1, 4 * U, U) : ctx.rect(W / 2 - roboSize() * 0.55, gy - 2 * U, roboSize() * 1.1, 4 * U); ctx.fill();
    ctx.fillStyle = '#ffd23f';
    for (let i = -2; i <= 2; i++) ctx.fillRect(W / 2 + i * roboSize() * 0.2 - U, gy - 1 * U, 2 * U, 2 * U);
  }

  // けむり・つぶ
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.94; p.vy *= 0.94;
    if (p.smoke) p.r *= 1 + dt * 1.5;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, p.life * 2.5); ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (parts.length > 400) parts.splice(0, parts.length - 400);

  // ロボット
  const rs = roboSize(), s = rs / RW, ry = robotY();
  const power = G.mode === 'tap' ? clamp(G.taps / 80, 0, 1) : G.mode === 'fly' ? 1 : 0;
  // ためたエネルギーの光
  if (power > 0) {
    const gl = ctx.createRadialGradient(W / 2, ry, 0, W / 2, ry, rs * (0.7 + power * 0.6));
    gl.addColorStop(0, `rgba(120,220,255,${0.25 + power * 0.4})`); gl.addColorStop(1, 'rgba(120,220,255,0)');
    ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(W / 2, ry, rs * (0.7 + power * 0.6), 0, 7); ctx.fill();
  }
  ctx.save();
  const jit = G.mode === 'tap' ? power * U * 0.8 : 0;
  ctx.translate(W / 2 + rand(-jit, jit), ry + (G.mode === 'ready' ? Math.sin(G.t * 2) * U * 0.6 : 0) + rand(-jit, jit));
  if (G.mode === 'result') ctx.rotate(Math.sin(G.t * 2) * 0.06);
  ctx.scale(1 + G.squash * 0.07, 1 - G.squash * 0.09);
  if (robo.complete) ctx.drawImage(robo, -ASSETS.center[0] * s, -ASSETS.center[1] * s, RW * s, RH * s);
  ctx.restore();

  // タップの「+15」
  for (let i = pops.length - 1; i >= 0; i--) {
    const p = pops[i]; p.life -= dt; p.y -= dt * 10 * U;
    if (p.life <= 0) { pops.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, p.life * 3);
    outlined(p.text, p.x, p.y, 3.6 * U, '#ffe14d');
  }
  ctx.globalAlpha = 1;
  if (pops.length > 30) pops.splice(0, pops.length - 30);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // ---- 文字 ----
  if (G.mode === 'ready') {
    outlined('とべ、サリー!!', W / 2, H * 0.2, 11 * U, '#fff', '#1d4f91', 0.2);
    ctx.globalAlpha = 0.7 + 0.3 * Math.sin(G.t * 4);
    outlined('タップで スタート！', W / 2, H * 0.94, 5 * U, '#fff', '#1d4f91', 0.22);
    ctx.globalAlpha = 1;
  }
  if (G.mode === 'count') {
    const n = 3 - Math.floor(G.modeT), f = G.modeT % 1;
    outlined(String(n), W / 2, H * 0.3, (24 - f * 8) * U, '#fff', '#1d4f91', 0.15);
  }
  if (G.mode === 'tap') {
    const left = Math.max(0, CFG.tapTime - G.modeT);
    // のこり時間のバー
    const bw = Math.min(W * 0.7, 80 * U), bx = W / 2 - bw / 2, by = 5 * U, bh = 3 * U;
    ctx.fillStyle = 'rgba(20,40,90,0.45)'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx, by, bw, bh, bh / 2) : ctx.rect(bx, by, bw, bh); ctx.fill();
    ctx.fillStyle = left < 3 ? '#ff6b6b' : '#ffe14d';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx, by, bw * left / CFG.tapTime, bh, bh / 2) : ctx.rect(bx, by, bw * left / CFG.tapTime, bh); ctx.fill();
    outlined(`${G.taps}`, W / 2, H * 0.3, 16 * U * (1 + G.squash * 0.12), '#fff', '#1d4f91', 0.15);
  }
  if (G.mode === 'fly' || G.mode === 'result') {
    outlined(`${Math.floor(G.alt).toLocaleString('ja-JP')} m`, W / 2, H * 0.16, 11 * U, '#fff', '#1d2b53', 0.16);
  }
  if (G.mode === 'result') {
    const t = clamp(G.modeT / 0.35, 0, 1), sc = 0.6 + 0.4 * (1 - Math.pow(1 - t, 3));
    let say = LEVELS[0].say; for (const l of LEVELS) if (G.goal >= l.m) say = l.say;
    ctx.globalAlpha = t;
    outlined(say, W / 2, H * 0.68, 6.5 * U * sc, '#ffe14d', '#1d2b53', 0.2);
    if (G.modeT > 1.5) {
      ctx.globalAlpha = 0.7 + 0.3 * Math.sin(G.t * 4);
      outlined('タップで もういちど', W / 2, H * 0.92, 4.6 * U, '#fff', '#1d2b53', 0.22);
    }
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(frame);
}

resize();
reset();
requestAnimationFrame(frame);
</script>
<script>
/* ---- iPhone / iPad（Safari）むけの調整 ---- */
(function () {
  const d = document;
  const re = () => { try { resize(); } catch (e) {} };
  if (window.visualViewport) visualViewport.addEventListener('resize', re);
  addEventListener('orientationchange', () => { setTimeout(re, 250); setTimeout(re, 700); });
  addEventListener('pageshow', re);
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => d.addEventListener(t, e => e.preventDefault(), { passive: false }));
  d.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  let lastEnd = 0;
  d.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastEnd < 350 && !e.target.closest('button') && !e.target.closest('canvas')) e.preventDefault();
    lastEnd = now;
  }, { passive: false });
  const fsOK = d.fullscreenEnabled || d.webkitFullscreenEnabled;
  const fb = d.getElementById('bFull');
  if (fb && !fsOK) fb.style.display = 'none';
  const unlock = () => {
    try {
      Snd.init();
      const ac = Snd.ac;
      if (!ac) return;
      if (ac.state !== 'running') ac.resume();
      if (!Snd._unlocked) {
        const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource();
        s.buffer = b; s.connect(ac.destination); s.start(0);
        Snd._unlocked = true;
      }
    } catch (e) {}
  };
  ['touchstart', 'touchend', 'pointerdown', 'click', 'keydown'].forEach(t => d.addEventListener(t, unlock, { capture: true, passive: true }));
  d.addEventListener('visibilitychange', () => { if (!d.hidden) { Snd._unlocked = false; } });
})();
</script>
</body>
