<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="パズル">
<meta name="format-detection" content="telephone=no">
<title>パズル</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;position:fixed;inset:0;width:100%;height:100%;overflow:hidden;background:#eef6fb;
    overscroll-behavior:none;-webkit-text-size-adjust:100%;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","BIZ UDPGothic","Meiryo",system-ui,sans-serif;color:#17476b}
  button{font:inherit;touch-action:manipulation}
  canvas#c{display:block;width:100%;height:100%}
  /* レベルをえらぶ画面 */
  #title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vmin;
    background:rgba(238,246,251,.86)}
  #title.off{display:none}
  #levels{display:flex;gap:4vmin;flex-wrap:wrap;justify-content:center;padding:0 4vmin}
  .lv{border:0;cursor:pointer;background:#fff;border-radius:3vmin;padding:2.4vmin 2.4vmin 1.8vmin;
    box-shadow:0 1vmin 0 rgba(23,71,107,.18);display:flex;flex-direction:column;align-items:center;gap:1.4vmin;
    font-weight:900;font-size:4vmin;color:#17476b;transition:transform .08s}
  .lv:active{transform:translateY(.6vmin);box-shadow:0 .3vmin 0 rgba(23,71,107,.18)}
  .lv canvas{width:24vmin;height:24vmin;border-radius:1.6vmin}
  .lv small{font-size:2.8vmin;opacity:.7}
  #back{position:fixed;top:1.2vmin;left:1.2vmin;border:0;border-radius:1.2vmin;padding:.9vmin 1.6vmin;
    background:rgba(255,255,255,.9);color:#17476b;font-weight:900;font-size:2.2vmin;opacity:.3;cursor:pointer;z-index:5;display:none}
  #back.on{display:block}
  #back:hover{opacity:1}
  #ui{position:fixed;top:1.2vmin;right:1.2vmin;display:flex;gap:1vmin;opacity:.3;transition:opacity .2s;z-index:5}
  #ui:hover{opacity:1}
  #ui button{font:bold 2vmin system-ui,sans-serif;border:0;border-radius:1.2vmin;padding:.9vmin 1.4vmin;
    background:rgba(255,255,255,.9);color:#17476b;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title"><div id="levels"></div></div>
<button id="back">◀ もどる</button>
<div id="ui">
  <button id="bSound" title="音 (M)">🔊</button>
  <button id="bFull" title="全画面 (F)">⛶</button>
  <button id="bHome" title="メニューへ (Esc)">メニュー</button>
</div>

<script>
'use strict';
/* ============================================================
   パズル ― ジグソーパズル（3だんかい：9・16・36ピース）
   ・ピースをドラッグして、正しい場所の近くではなすと ぴたっとはまる
   ・ぜんぶはまったら「かんせい！」
   ・マウス／マルチタッチ対応。記録は保存しない
   ============================================================ */
const GAME_ID = 'puzzle';
const LEVELS = [
  { n: 3, name: 'かんたん' },
  { n: 4, name: 'ふつう' },
  { n: 6, name: 'むずかしい' },
];
const CFG = {
  snap: 0.35,        // 正しい場所から ピースの大きさの何倍までなら はまるか
  playIdle: 120,     // あそんでいる途中、何秒さわらないとレベル選びにもどるか
  resultIdle: 20,
};

const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, U = 1, DPR = 1;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const img = new Image(); img.src = `data:image/${ASSETS.type};base64,` + ASSETS.img;
const [IW, IH] = ASSETS.size;
const board = { x: 0, y: 0, w: 100, h: 100 };
let tray = [];   // ピースをちらばらせる場所 [{x,y,w,h}]

// ---------- 音 ----------
const Snd = {
  ac: null, on: true,
  init() {
    if (this.ac) { if (this.ac.state !== 'running') this.ac.resume(); return; }
    try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  },
  tone(type, f0, f1, dur, vol, delay = 0) {
    if (!this.on || !this.ac) return;
    const t = this.ac.currentTime + delay, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ac.destination); o.start(t); o.stop(t + dur + 0.05);
  },
  pick() { this.tone('sine', 520, 700, 0.06, 0.1); },
  drop() { this.tone('sine', 400, 300, 0.07, 0.08); },
  snap() { this.tone('triangle', 880, 880, 0.08, 0.15); this.tone('triangle', 1320, 1320, 0.14, 0.12, 0.06); },
  clear() { [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone('triangle', f, f, 0.3, 0.14, i * 0.1)); },
};

// ---------- 状態 ----------
const G = { mode: 'title', t: 0, modeT: 0, lv: 0, n: 3, start: 0, clearTime: 0, lastInput: 0 };
let pieces = [];
const drags = new Map();   // pointerId -> {piece, ox, oy}
const confetti = [];

// ---------- ジグソーの形 ----------
// u：辺にそった位置（0〜1）、v：外がわへのでっぱり
const TAB = [
  [0.35, 0], 'c', [0.40, 0], [0.42, 0.05], [0.38, 0.12],
  'c', [0.33, 0.22], [0.42, 0.28], [0.50, 0.28],
  'c', [0.58, 0.28], [0.67, 0.22], [0.62, 0.12],
  'c', [0.58, 0.05], [0.60, 0], [0.65, 0],
];
function sidePath(p, x0, y0, x1, y1, d, s) {
  // 時計まわりに進むとき、外がわは進む向きを左に90°まわした方向
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy);
  const nx = dy / L, ny = -dx / L;
  const pt = (u, v) => [x0 + dx * u + nx * v * d * s, y0 + dy * u + ny * v * d * s];
  if (d === 0) { p.lineTo(x1, y1); return; }
  p.lineTo(...pt(0.35, 0));
  for (let i = 1; i < TAB.length; i += 4) {
    const a = pt(...TAB[i + 1]), b = pt(...TAB[i + 2]), c = pt(...TAB[i + 3]);
    p.bezierCurveTo(a[0], a[1], b[0], b[1], c[0], c[1]);
  }
  p.lineTo(x1, y1);
}
function piecePath(pc, pw, ph) {
  const p = new Path2D(), s = Math.min(pw, ph);
  p.moveTo(0, 0);
  sidePath(p, 0, 0, pw, 0, pc.e.t, s);
  sidePath(p, pw, 0, pw, ph, pc.e.r, s);
  sidePath(p, pw, ph, 0, ph, pc.e.b, s);
  sidePath(p, 0, ph, 0, 0, pc.e.l, s);
  p.closePath();
  return p;
}

// ---------- 画面の大きさ ----------
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; U = Math.min(W, H) / 100;
  cv.width = W * DPR; cv.height = H * DPR;
  const asp = IW / IH;
  if (W >= H) {
    // 横長：まん中に台、左右にピース
    board.h = Math.min(H * 0.84, W * 0.42 / asp); board.w = board.h * asp;
    board.x = (W - board.w) / 2; board.y = (H - board.h) / 2;
    tray = [{ x: 2 * U, y: 6 * U, w: board.x - 4 * U, h: H - 8 * U }, { x: board.x + board.w + 2 * U, y: 6 * U, w: W - board.x - board.w - 4 * U, h: H - 8 * U }];
  } else {
    // たて長：上に台、下にピース
    board.w = Math.min(W * 0.92, H * 0.5 * asp); board.h = board.w / asp;
    board.x = (W - board.w) / 2; board.y = 7 * U;
    const ty = board.y + board.h + 2 * U;
    tray = [{ x: 2 * U, y: ty, w: W - 4 * U, h: H - ty - 2 * U }];
  }
  if (pieces.length) renderPieces();
}
addEventListener('resize', resize);

// ---------- ピースをつくる ----------
function makePuzzle(lv) {
  const n = LEVELS[lv].n;
  G.lv = lv; G.n = n;
  // となりあうピースのでっぱり・へこみを決める
  const vE = [], hE = [];
  for (let r = 0; r < n; r++) { vE.push([]); hE.push([]); for (let c = 0; c < n; c++) { vE[r].push(Math.random() < 0.5 ? 1 : -1); hE[r].push(Math.random() < 0.5 ? 1 : -1); } }
  pieces = [];
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
    pieces.push({
      r, c, locked: false,
      e: { t: r === 0 ? 0 : -hE[r - 1][c], r: c === n - 1 ? 0 : vE[r][c], b: r === n - 1 ? 0 : hE[r][c], l: c === 0 ? 0 : -vE[r][c - 1] },
      // 位置は「台のはば＝1」の単位で持っておく（画面の大きさが変わっても大丈夫なように）
      x: 0, y: 0, z: 0,
    });
  }
  renderPieces();
  scatter();
}
function renderPieces() {
  const n = G.n, pw = board.w / n, ph = board.h / n, m = 0.32 * Math.min(pw, ph);
  const sw = IW / n, sh = IH / n, sm = m * IW / board.w;
  for (const pc of pieces) {
    const cw = Math.ceil((pw + m * 2) * DPR), chh = Math.ceil((ph + m * 2) * DPR);
    const can = pc.can || document.createElement('canvas');
    can.width = cw; can.height = chh;
    const x = can.getContext('2d');
    x.setTransform(DPR, 0, 0, DPR, 0, 0);
    x.clearRect(0, 0, cw, chh);
    x.translate(m, m);
    const path = piecePath(pc, pw, ph);
    x.save(); x.clip(path);
    x.drawImage(img, pc.c * sw - sm, pc.r * sh - sm, sw + sm * 2, sh + sm * 2, -m, -m, pw + m * 2, ph + m * 2);
    x.restore();
    // ふち
    x.lineJoin = 'round';
    x.strokeStyle = 'rgba(23,71,107,0.55)'; x.lineWidth = Math.max(1, U * 0.18); x.stroke(path);
    x.strokeStyle = 'rgba(255,255,255,0.7)'; x.lineWidth = Math.max(0.5, U * 0.08); x.stroke(path);
    pc.can = can; pc.path = path; pc.m = m; pc.pw = pw; pc.ph = ph;
    // かんせいしたときに使う、ふちなしの絵は 台に直接かく
  }
}
function scatter() {
  const n = G.n, pw = board.w / n, ph = board.h / n;
  const area = tray.reduce((a, t) => a + Math.max(0, t.w) * Math.max(0, t.h), 0);
  // 置く場所をマス目にわけて、なるべく重ならないようにする
  const slots = [];
  for (const t of tray) {
    if (t.w < pw * 0.6 || t.h < ph * 0.6) continue;
    const cols = Math.max(1, Math.floor(t.w / (pw * 1.05))), rows = Math.max(1, Math.floor(t.h / (ph * 1.05)));
    for (let i = 0; i < cols; i++) for (let j = 0; j < rows; j++)
      slots.push([t.x + (i + 0.5) * t.w / cols - pw / 2, t.y + (j + 0.5) * t.h / rows - ph / 2]);
  }
  slots.sort(() => Math.random() - 0.5);
  pieces.sort(() => Math.random() - 0.5).forEach((pc, i) => {
    let sx, sy;
    if (slots.length) { const s = slots[i % slots.length]; sx = s[0] + rand(-0.12, 0.12) * pw; sy = s[1] + rand(-0.12, 0.12) * ph; }
    else { sx = rand(0, W - pw); sy = rand(0, H - ph); }
    pc.x = (sx - board.x) / board.w; pc.y = (sy - board.y) / board.w; pc.z = i;
  });
  void area;
}
const homeX = pc => pc.c / G.n, homeY = pc => (pc.r * board.h / G.n) / board.w;

// ---------- 画面切りかえ ----------
function setMode(m) {
  G.mode = m; G.modeT = 0;
  $('title').classList.toggle('off', m !== 'title');
  $('back').classList.toggle('on', m === 'play');
}
function startLevel(lv) {
  if (!img.complete) { img.addEventListener('load', () => startLevel(lv), { once: true }); return; }
  Snd.init(); Snd.pick();
  makePuzzle(lv);
  G.start = G.t; G.lastInput = G.t;
  setMode('play');
}
function buildTitle() {
  const box = $('levels'); box.innerHTML = '';
  LEVELS.forEach((L, i) => {
    const b = document.createElement('button'); b.className = 'lv';
    const c = document.createElement('canvas'); const S = 240; c.width = c.height = S;
    const x = c.getContext('2d');
    const draw = () => {
      x.drawImage(img, 0, 0, S, S);
      x.strokeStyle = 'rgba(23,71,107,0.75)'; x.lineWidth = 3;
      for (let k = 1; k < L.n; k++) { x.beginPath(); x.moveTo(k * S / L.n, 0); x.lineTo(k * S / L.n, S); x.moveTo(0, k * S / L.n); x.lineTo(S, k * S / L.n); x.stroke(); }
    };
    if (img.complete) draw(); else img.addEventListener('load', draw);
    b.appendChild(c);
    const t = document.createElement('span'); t.innerHTML = `${L.name}<br><small>${L.n * L.n} ピース</small>`; t.style.textAlign = 'center';
    b.appendChild(t);
    b.onclick = () => startLevel(i);
    box.appendChild(b);
  });
}
$('back').onclick = () => { Snd.init(); setMode('title'); };

// ---------- 入力 ----------
function pieceAt(x, y) {
  // 上にあるピースから順にしらべる
  const list = pieces.filter(p => !p.locked).sort((a, b) => b.z - a.z);
  for (const pc of list) {
    const px = board.x + pc.x * board.w - pc.m, py = board.y + pc.y * board.w - pc.m;
    const lx = x - px - pc.m, ly = y - py - pc.m;
    if (lx < -pc.m || ly < -pc.m || lx > pc.pw + pc.m || ly > pc.ph + pc.m) continue;
    // 形の中か、まん中の四角の中なら つかめる（小さい子でも つかみやすいように少し広め）
    if (hitCtx.isPointInPath(pc.path, lx, ly) || (lx > -pc.m * 0.4 && ly > -pc.m * 0.4 && lx < pc.pw + pc.m * 0.4 && ly < pc.ph + pc.m * 0.4)) return pc;
  }
  return null;
}
let zTop = 1000;
const hitCtx = document.createElement('canvas').getContext('2d');   // 形の当たり判定用
cv.addEventListener('pointerdown', e => {
  Snd.init(); G.lastInput = G.t;
  if (G.mode === 'clear') { if (G.modeT > 1.5) setMode('title'); return; }
  if (G.mode !== 'play') return;
  const pc = pieceAt(e.clientX, e.clientY);
  if (!pc || [...drags.values()].some(d => d.piece === pc)) return;
  cv.setPointerCapture(e.pointerId);
  pc.z = ++zTop;
  drags.set(e.pointerId, { piece: pc, ox: e.clientX - (board.x + pc.x * board.w), oy: e.clientY - (board.y + pc.y * board.w) });
  Snd.pick();
});
cv.addEventListener('pointermove', e => {
  const d = drags.get(e.pointerId); if (!d) return;
  G.lastInput = G.t;
  const pc = d.piece;
  const sx = clamp(e.clientX - d.ox, -pc.pw * 0.5, W - pc.pw * 0.5), sy = clamp(e.clientY - d.oy, -pc.ph * 0.5, H - pc.ph * 0.5);
  pc.x = (sx - board.x) / board.w; pc.y = (sy - board.y) / board.w;
});
function release(e) {
  const d = drags.get(e.pointerId); if (!d) return;
  drags.delete(e.pointerId);
  const pc = d.piece;
  const dx = (pc.x - homeX(pc)) * board.w, dy = (pc.y - homeY(pc)) * board.w;
  if (Math.hypot(dx, dy) < CFG.snap * Math.min(pc.pw, pc.ph)) {
    pc.x = homeX(pc); pc.y = homeY(pc); pc.locked = true; pc.snapT = 0.5;
    Snd.snap();
    if (pieces.every(p => p.locked)) {
      G.clearTime = G.t - G.start; setMode('clear'); Snd.clear();
      for (let i = 0; i < 120; i++) confetti.push({ x: rand(0, W), y: rand(-H * 0.5, 0), vx: rand(-20, 20) * U, vy: rand(10, 30) * U, rot: rand(0, 6), vr: rand(-6, 6), c: ['#7fffc4', '#9ad9ff', '#fff1a0', '#ffb4d0'][i % 4], s: rand(1, 2) * U, life: rand(3, 5) });
    }
  } else Snd.drop();
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.key === 'f' || e.key === 'F') toggleFull();
  else if (e.key === 'm' || e.key === 'M') toggleSound();
  else if (e.key === 'Escape') goHome();
});
addEventListener('pointerdown', () => { G.lastInput = G.t; }, true);
function goHome() {
  if (window.parent !== window) window.parent.postMessage({ type: 'minigame-exit', game: GAME_ID }, '*');
  else history.back();
}
function toggleFull() {
  const de = document.documentElement;
  if (!(document.fullscreenElement || document.webkitFullscreenElement)) {
    if (de.requestFullscreen) de.requestFullscreen().catch(() => {});
    else if (de.webkitRequestFullscreen) de.webkitRequestFullscreen();
  } else if (document.exitFullscreen) document.exitFullscreen();
  else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
}
function toggleSound() { Snd.on = !Snd.on; Snd.init(); $('bSound').textContent = Snd.on ? '🔊' : '🔇'; }
$('bHome').onclick = goHome; $('bFull').onclick = toggleFull; $('bSound').onclick = toggleSound;
$('ui').addEventListener('pointerdown', e => e.stopPropagation());
$('back').addEventListener('pointerdown', e => e.stopPropagation());

// ---------- かく ----------
const FONT = '"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","BIZ UDPGothic","Meiryo",system-ui,sans-serif';
function outlined(text, x, y, size, fill, stroke = '#fff', lw = 0.22) {
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * lw; ctx.strokeStyle = stroke;
  ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y);
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  G.t += dt; G.modeT += dt;
  if (G.mode === 'play' && !drags.size && G.t - G.lastInput > CFG.playIdle) setMode('title');
  if (G.mode === 'clear' && G.t - G.lastInput > CFG.resultIdle) setMode('title');

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 背景（あわい水色に、うすいドット）
  ctx.fillStyle = '#eef6fb'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(120,190,230,0.18)';
  const sp = 4 * U;
  for (let y = sp / 2; y < H; y += sp) for (let x = ((y / sp) % 2 ? sp : sp / 2); x < W; x += sp * 1) { ctx.beginPath(); ctx.arc(x, y, 0.35 * U, 0, 7); ctx.fill(); }

  if (G.mode === 'title') {
    if (img.complete) { ctx.globalAlpha = 0.25; ctx.drawImage(img, board.x, board.y, board.w, board.h); ctx.globalAlpha = 1; }
    requestAnimationFrame(frame); return;
  }
  // 台：うすく見本の絵
  ctx.save();
  ctx.shadowColor = 'rgba(23,71,107,0.2)'; ctx.shadowBlur = 2 * U; ctx.shadowOffsetY = 0.6 * U;
  ctx.fillStyle = '#fff'; ctx.fillRect(board.x, board.y, board.w, board.h);
  ctx.restore();
  if (img.complete) { ctx.globalAlpha = G.mode === 'clear' ? 1 : 0.16; ctx.drawImage(img, board.x, board.y, board.w, board.h); ctx.globalAlpha = 1; }

  if (G.mode === 'play') {
    // はまったピース → 動かせるピース（上にあるものほど あとで）
    const order = pieces.slice().sort((a, b) => (a.locked === b.locked ? a.z - b.z : a.locked ? -1 : 1));
    for (const pc of order) {
      const dragging = [...drags.values()].some(d => d.piece === pc);
      const sx = board.x + pc.x * board.w - pc.m, sy = board.y + pc.y * board.w - pc.m;
      const cw = pc.pw + pc.m * 2, ch = pc.ph + pc.m * 2;
      if (dragging || !pc.locked) {
        ctx.save();
        ctx.shadowColor = 'rgba(23,71,107,0.35)'; ctx.shadowBlur = (dragging ? 3 : 1) * U; ctx.shadowOffsetY = (dragging ? 1.2 : 0.4) * U;
        const sc = dragging ? 1.05 : 1;
        ctx.translate(sx + cw / 2, sy + ch / 2); ctx.scale(sc, sc);
        ctx.drawImage(pc.can, -cw / 2, -ch / 2, cw, ch);
        ctx.restore();
      } else {
        ctx.drawImage(pc.can, sx, sy, cw, ch);
        if (pc.snapT > 0) {
          pc.snapT -= dt;
          ctx.save(); ctx.globalAlpha = pc.snapT * 1.6; ctx.translate(sx + pc.m, sy + pc.m);
          ctx.fillStyle = '#fff'; ctx.fill(pc.path); ctx.restore();
        }
      }
    }
  }
  if (G.mode === 'clear') {
    // かんせい：ふちのない絵にもどして、きらきら
    const t = clamp(G.modeT / 0.6, 0, 1);
    ctx.save(); ctx.globalAlpha = 0.25 * (1 - t);
    ctx.fillStyle = '#fff'; ctx.fillRect(board.x, board.y, board.w, board.h); ctx.restore();
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i]; c.life -= dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= 0.99; c.rot += c.vr * dt;
      if (c.life <= 0 || c.y > H + 10) { confetti.splice(i, 1); continue; }
      ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot); ctx.fillStyle = c.c; ctx.fillRect(-c.s / 2, -c.s / 4, c.s, c.s / 2); ctx.restore();
    }
    const sc = 0.6 + 0.4 * (1 - Math.pow(1 - clamp(G.modeT / 0.4, 0, 1), 3));
    outlined('かんせい！', W / 2, board.y + board.h * 0.5, 13 * U * sc, '#ff7a9c', '#fff', 0.2);
    const sec = Math.round(G.clearTime);
    const timeTxt = sec >= 60 ? `${Math.floor(sec / 60)}ふん ${sec % 60}びょう` : `${sec}びょう`;
    outlined(timeTxt, W / 2, board.y + board.h * 0.5 + 11 * U, 5 * U * sc, '#17476b', '#fff', 0.25);
    if (G.modeT > 1.5) {
      ctx.globalAlpha = 0.7 + 0.3 * Math.sin(G.t * 4);
      outlined('タップで もどる', W / 2, Math.min(H - 4 * U, board.y + board.h + 5 * U), 4 * U, '#17476b', '#fff', 0.25);
      ctx.globalAlpha = 1;
    }
  }
  requestAnimationFrame(frame);
}

resize();
buildTitle();
setMode('title');
requestAnimationFrame(frame);
</script>
<script>
/* ---- iPhone / iPad（Safari）むけの調整 ---- */
(function () {
  const d = document;
  const re = () => { try { resize(); } catch (e) {} };
  if (window.visualViewport) visualViewport.addEventListener('resize', re);
  addEventListener('orientationchange', () => { setTimeout(re, 250); setTimeout(re, 700); });
  addEventListener('pageshow', re);
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => d.addEventListener(t, e => e.preventDefault(), { passive: false }));
  d.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  let lastEnd = 0;
  d.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastEnd < 350 && !e.target.closest('button') && !e.target.closest('canvas')) e.preventDefault();
    lastEnd = now;
  }, { passive: false });
  const fsOK = d.fullscreenEnabled || d.webkitFullscreenEnabled;
  const fb = d.getElementById('bFull');
  if (fb && !fsOK) fb.style.display = 'none';
  const unlock = () => {
    try {
      Snd.init();
      const ac = Snd.ac;
      if (!ac) return;
      if (ac.state !== 'running') ac.resume();
      if (!Snd._unlocked) {
        const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource();
        s.buffer = b; s.connect(ac.destination); s.start(0);
        Snd._unlocked = true;
      }
    } catch (e) {}
  };
  ['touchstart', 'touchend', 'pointerdown', 'click', 'keydown'].forEach(t => d.addEventListener(t, unlock, { capture: true, passive: true }));
  d.addEventListener('visibilitychange', () => { if (!d.hidden) { Snd._unlocked = false; } });
})();
</script>
</body>
