<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<!-- iPhone：ホーム画面に追加して開くと、アドレスバーなしで全画面のように表示される -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="のびのびわんこ">
<meta name="format-detection" content="telephone=no">
<title>のびのびわんこ</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#4a752c;
    touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","BIZ UDPGothic","Meiryo",system-ui,sans-serif}
  canvas{display:block;width:100vw;height:100vh}
  #title{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vmin}
  #title.off{display:none}
  #title h1{margin:0;font-size:10vmin;color:#fff;text-shadow:0 .8vmin 0 #2f5418;letter-spacing:.4vmin}
  #maps{display:flex;gap:5vmin}
  #maps button{border:0;cursor:pointer;background:#fff;border-radius:3vmin;padding:2vmin 2vmin 1.6vmin;
    box-shadow:0 1vmin 0 #2f5418;display:flex;flex-direction:column;align-items:center;gap:1.4vmin;
    font:inherit;font-weight:900;font-size:4.6vmin;color:#3b6b1f;transition:transform .08s}
  #maps button:active{transform:translateY(.6vmin);box-shadow:0 .4vmin 0 #2f5418}
  #maps img{width:30vmin;height:30vmin;border-radius:1.5vmin;image-rendering:pixelated}
  /* 画面の矢印ボタン */
  #pad{position:fixed;inset:0;display:none;pointer-events:none;z-index:4}
  #pad.on{display:block}
  #pad button{position:absolute;pointer-events:auto;border:0;border-radius:2.4vmin;background:rgba(255,255,255,.92);color:#3b6b1f;cursor:pointer;
    box-shadow:0 .9vmin 0 #2f5418;display:flex;align-items:center;justify-content:center;padding:0;
    touch-action:none;transition:transform .06s,box-shadow .06s}
  #pad button svg{width:58%;height:58%}
  #pad button.down,#pad button:active{transform:translateY(.7vmin);box-shadow:0 .2vmin 0 #2f5418;background:#ffe27a}
  #ui{position:fixed;top:1.2vmin;right:1.2vmin;display:flex;gap:1vmin;opacity:.25;transition:opacity .2s;z-index:5}
  #ui:hover{opacity:1}
  #ui button{font:bold 2vmin system-ui,sans-serif;border:0;border-radius:1.2vmin;padding:.9vmin 1.4vmin;
    background:rgba(255,255,255,.9);color:#3b6b1f;cursor:pointer}

  /* iPhone / iPad（Safari）むけ：画面をひっぱってもずれない・タップしたときの灰色のわくを出さない */
  html,body{position:fixed;inset:0;width:100%;height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  *{-webkit-tap-highlight-color:transparent}
  button{touch-action:manipulation}
  canvas#c{width:100% !important;height:100% !important}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="title">
  <h1>のびのび わんこ</h1>
  <div id="maps">
    <button id="mapL"><img id="imgL" alt="">ひろい</button>
    <button id="mapS"><img id="imgS" alt="">せまい</button>
  </div>
</div>
<div id="pad">
  <button class="up" data-d="0" aria-label="うえ"><svg viewBox="0 0 10 10"><path d="M5 1.5 L9 7.5 H1 Z" fill="currentColor"/></svg></button>
  <button class="left" data-d="3" aria-label="ひだり"><svg viewBox="0 0 10 10"><path d="M1.5 5 L7.5 1 V9 Z" fill="currentColor"/></svg></button>
  <button class="right" data-d="1" aria-label="みぎ"><svg viewBox="0 0 10 10"><path d="M8.5 5 L2.5 1 V9 Z" fill="currentColor"/></svg></button>
  <button class="dn" data-d="2" aria-label="した"><svg viewBox="0 0 10 10"><path d="M5 8.5 L9 2.5 H1 Z" fill="currentColor"/></svg></button>
</div>
<div id="ui">
  <button id="bSound" title="音 (M)">🔊</button>
  <button id="bFull" title="全画面 (F)">⛶</button>
  <button id="bHome" title="メニューへ (Esc)">メニュー</button>
</div>

<script>
'use strict';
/* ============================================================
   のびのびわんこ ― 犬の「へびゲーム」
   ・犬は前に進みつづける。スワイプ（またはタップ／矢印キー）で向きを変える
   ・骨をたべると、犬の胴がのびる
   ・かべか自分の体にぶつかったらおしまい。とった骨の数が出る
   ・マップは「ひろい（16×16）」と「せまい（8×8）」
   ・記録は保存しない。外部ファイル不要
   ============================================================ */
const GAME_ID = 'wanko';

const CFG = {
  stepL: 0.26,       // ひろいマップで1マス進む時間（秒）大きいほどゆっくり
  stepS: 0.32,       // せまいマップで1マス進む時間（秒）大きいほどゆっくり
  swipe: 3,          // スワイプとみなす長さ（U）
  dogScale: 1.7,     // マスに対する犬の大きさ（1だと素材そのままの細さ）
  resultIdle: 15,    // 結果画面で何秒さわらないとタイトルにもどるか
};

// ---------- キャンバス ----------
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, U = 1, DPR = 1;
const board = { x: 0, y: 0, s: 100, n: 16, cell: 6 };
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; U = Math.min(W, H) / 100;
  cv.width = W * DPR; cv.height = H * DPR;
  layout();
}
function layout() {
  // 矢印ボタンは十字の形。マップがいちばん大きくなる置き方をえらぶ
  //  ・横長：マップは画面の高さいっぱいでまん中、十字は右下
  //  ・たて長：マップを上に大きく、十字はその下のまん中
  //  ・その間：マップを左によせ、十字は右下
  const m = 2.5 * U, gap = 1.5 * U;
  let btn = 11 * U;
  let cross = btn * 3 + gap * 2;
  const full = H - m * 2;
  let cx0, cy0;   // 十字の左はし・上はし
  // A：十字を右に置く（横長の画面むき）
  const sideBtn = Math.min(btn, (W * 0.3 - gap * 2) / 3), sideCross = sideBtn * 3 + gap * 2;
  const sA = Math.min(full, W - sideCross - m * 3);
  // B：マップを上、十字をその下のまん中に置く（たて長の画面むき）
  const vBtn = clamp((H - (W - m * 2) - m * 3 - gap * 2 - 7 * U) / 3, 9 * U, Math.min(W * 0.24, 26 * U)), vCross = vBtn * 3 + gap * 2;
  const topR = 7 * U;   // 右上のボタンの場所
  const sB = Math.min(W - m * 2, H - vCross - m * 2 - topR);
  board.vert = false;
  if ((W - full) / 2 >= cross + m * 2) {
    board.s = full; board.x = (W - board.s) / 2; board.y = (H - board.s) / 2;
    const sideL = board.x + board.s;
    cx0 = sideL + (W - sideL - cross) / 2; cy0 = H - m - cross;
  } else if (sB > sA) {
    btn = vBtn; cross = vCross;
    board.s = sB; board.x = (W - board.s) / 2; board.y = topR;
    cx0 = (W - cross) / 2;
    cy0 = board.y + board.s + m + (H - board.y - board.s - m * 2 - cross) / 2;
    board.vert = true;
  } else {
    btn = sideBtn; cross = sideCross;
    board.s = sA; board.x = m + (W - cross - m * 3 - board.s) / 2; board.y = (H - board.s) / 2;
    cx0 = W - m - cross; cy0 = H - m - cross;
  }
  const pos = {
    up: [cx0 + btn + gap, cy0],
    left: [cx0, cy0 + btn + gap],
    right: [cx0 + (btn + gap) * 2, cy0 + btn + gap],
    dn: [cx0 + btn + gap, cy0 + (btn + gap) * 2],
  };
  // 骨の数：左に場所があれば左上、なければ十字の上（右上のボタンとかさならない高さ）
  if (board.vert) { board.countX = board.x + 7 * U; board.countY = topR / 2; }
  else if (board.x / 2 > 10 * U) { board.countX = board.x / 2; board.countY = m + 4 * U; }
  else { board.countX = cx0 + cross / 2; board.countY = Math.min(m + 14 * U, cy0 - 6 * U); }
  for (const k of ['up', 'left', 'right', 'dn']) {
    const el = document.querySelector('#pad .' + k);
    el.style.left = pos[k][0] + 'px'; el.style.top = pos[k][1] + 'px';
    el.style.width = el.style.height = btn + 'px';
  }
  board.cell = board.s / board.n;
}
addEventListener('resize', resize);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- 画像 ----------
function loadImg(b64) { const i = new Image(); i.src = 'data:image/png;base64,' + b64; return i; }
const IMG = {
  head: loadImg(ASSETS.head), tail: loadImg(ASSETS.tail), curve: loadImg(ASSETS.curve),
  bone: loadImg(ASSETS.bone), boardL: loadImg(ASSETS.boardL), boardS: loadImg(ASSETS.boardS),
};
$('imgL').src = IMG.boardL.src; $('imgS').src = IMG.boardS.src;

// 向き：0=上 1=右 2=下 3=左（時計まわり）
const DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];
const dirOf = (dx, dy) => DIRS.findIndex(d => d[0] === dx && d[1] === dy);

// ---------- 音 ----------
const Snd = {
  ac: null, on: true, noise: null,
  init() {
    if (this.ac) { if (this.ac.state !== 'running') this.ac.resume(); return; }
    try {
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
      const len = this.ac.sampleRate * 0.5, b = this.ac.createBuffer(1, len, this.ac.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = b;
    } catch (e) {}
  },
  tone(type, f0, f1, dur, vol, delay = 0) {
    if (!this.on || !this.ac) return;
    const t = this.ac.currentTime + delay, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ac.destination); o.start(t); o.stop(t + dur + 0.05);
  },
  // 「わんっ」
  bark(delay = 0) {
    if (!this.on || !this.ac) return;
    const t = this.ac.currentTime + delay;
    const o = this.ac.createOscillator(), f = this.ac.createBiquadFilter(), g = this.ac.createGain();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(520, t); o.frequency.exponentialRampToValueAtTime(300, t + 0.14);
    f.type = 'bandpass'; f.frequency.setValueAtTime(1200, t); f.frequency.exponentialRampToValueAtTime(700, t + 0.14); f.Q.value = 2;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.35, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
    o.connect(f).connect(g).connect(this.ac.destination); o.start(t); o.stop(t + 0.2);
  },
  eat() {
    // ぽりっ
    if (this.on && this.ac) {
      const t = this.ac.currentTime, s = this.ac.createBufferSource(); s.buffer = this.noise;
      const f = this.ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 2500;
      const g = this.ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
      s.connect(f).connect(g).connect(this.ac.destination); s.start(t); s.stop(t + 0.1);
    }
    this.tone('sine', 660, 1320, 0.12, 0.12, 0.04);
  },
  turn() { this.tone('sine', 500, 560, 0.04, 0.03); },
  hit() { this.tone('square', 300, 80, 0.25, 0.15); this.tone('triangle', 1200, 500, 0.45, 0.12, 0.12); }, // きゃいん
  start() { this.bark(); this.bark(0.2); },
};

// ---------- 状態 ----------
const G = {
  mode: 'title',      // title / ready / play / dead / result
  modeT: 0, t: 0, lastInput: 0,
  dog: [], dir: 1, queue: [], grow: 0,
  bone: null, bones: 0, stepT: 0, step: 0.15,
  eatFx: 0, shake: 0,
};
const parts = [], texts = [];

function setMode(m) {
  G.mode = m; G.modeT = 0;
  $('title').classList.toggle('off', m !== 'title');
  $('pad').classList.toggle('on', m === 'ready' || m === 'play' || m === 'dead');
}
function startMap(big) {
  Snd.init(); Snd.bark();
  board.n = big ? ASSETS.boardLN : ASSETS.boardSN;
  G.boardImg = big ? IMG.boardL : IMG.boardS;
  G.step = big ? CFG.stepL : CFG.stepS;
  layout();
  const n = board.n, y = Math.floor(n / 2), len = big ? 4 : 3, hx = Math.floor(n / 2) - (big ? 2 : 1);
  G.dog = [];
  for (let i = 0; i < len; i++) G.dog.push({ x: hx - i, y });
  G.dir = 1; G.queue = []; G.grow = 0; G.bones = 0; G.stepT = 0;
  placeBone();
  setMode('ready');
  G.lastInput = G.t;
}
$('mapL').onclick = () => startMap(true);
$('mapS').onclick = () => startMap(false);

function placeBone() {
  const free = [];
  for (let y = 0; y < board.n; y++) for (let x = 0; x < board.n; x++)
    if (!G.dog.some(s => s.x === x && s.y === y)) free.push({ x, y });
  G.bone = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  G.boneT = 0;
}

// 向きを変える（予約しておく）
function turn(d) {
  G.lastInput = G.t;
  if (G.mode === 'ready') {
    if (d === 3) d = 1;   // うしろ向きにはスタートしない
    G.dir = d; G.queue = []; setMode('play'); Snd.start(); return;
  }
  if (G.mode !== 'play') return;
  const lastD = G.queue.length ? G.queue[G.queue.length - 1] : G.dir;
  if (d === lastD || (d + 2) % 4 === lastD) return;
  if (G.queue.length < 3) { G.queue.push(d); Snd.turn(); }
}

function stepDog() {
  if (G.queue.length) G.dir = G.queue.shift();
  const h = G.dog[0], [dx, dy] = DIRS[G.dir];
  const nh = { x: h.x + dx, y: h.y + dy };
  const n = board.n;
  // しっぽは動くので、のびないときはしっぽのマスにははいれる
  const body = G.grow > 0 ? G.dog : G.dog.slice(0, -1);
  if (nh.x < 0 || nh.y < 0 || nh.x >= n || nh.y >= n || body.some(s => s.x === nh.x && s.y === nh.y)) {
    die(); return;
  }
  G.dog.unshift(nh);
  if (G.grow > 0) G.grow--; else G.dog.pop();
  if (G.bone && nh.x === G.bone.x && nh.y === G.bone.y) {
    G.bones++; G.grow++; G.eatFx = 1;
    Snd.eat();
    const [cx, cy] = cellCenter(nh.x, nh.y);
    for (let i = 0; i < 14; i++) {
      const a = rand(0, 6.28), s = rand(10, 30) * U;
      parts.push({ x: cx, y: cy, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.4, 0.7), r: rand(0.5, 1.1) * U, c: Math.random() < 0.5 ? '#fff' : '#ffe27a' });
    }
    texts.push({ text: '+1', x: cx, y: cy - board.cell * 0.6, life: 0.9 });
    placeBone();
    if (!G.bone) die(true);   // ぜんぶうまった
  }
}
function die(win) {
  G.win = !!win;
  if (!win) { Snd.hit(); G.shake = 1; }
  else Snd.start();
  setMode('dead');
}

// ---------- 入力 ----------
let ptr = null;
cv.addEventListener('pointerdown', e => {
  Snd.init();
  G.lastInput = G.t;
  if (G.mode === 'result') { if (G.modeT > 1) setMode('title'); return; }
  ptr = { id: e.pointerId, x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, swiped: false };
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove', e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
  if (Math.hypot(dx, dy) > CFG.swipe * U) {
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
    ptr.x = e.clientX; ptr.y = e.clientY; ptr.swiped = true;
  }
});
cv.addEventListener('pointerup', e => {
  if (!ptr || e.pointerId !== ptr.id) return;
  if (!ptr.swiped && G.dog.length) {
    // タップ：犬の頭から見て、タップした方へまがる
    const h = G.dog[0], [hx, hy] = cellCenter(h.x, h.y);
    const dx = e.clientX - hx, dy = e.clientY - hy;
    const cur = G.queue.length ? G.queue[G.queue.length - 1] : G.dir;
    if (G.mode === 'ready') turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 1 : 3) : (dy > 0 ? 2 : 0));
    else if (cur % 2 === 1) turn(dy > 0 ? 2 : 0);   // 横に進んでいるときは上か下へ
    else turn(dx > 0 ? 1 : 3);                      // たてに進んでいるときは右か左へ
  }
  ptr = null;
});
cv.addEventListener('pointercancel', () => { ptr = null; });
cv.addEventListener('contextmenu', e => e.preventDefault());
// 画面の矢印ボタン（おした瞬間に反応する）
document.querySelectorAll('#pad button').forEach(b => {
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); e.stopPropagation();
    Snd.init(); b.classList.add('down');
    turn(+b.dataset.d);
  });
  const up = () => b.classList.remove('down');
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
});
addEventListener('keydown', e => {
  Snd.init();
  const k = e.key;
  const map = { ArrowUp: 0, w: 0, W: 0, ArrowRight: 1, d: 1, D: 1, ArrowDown: 2, s: 2, S: 2, ArrowLeft: 3, a: 3, A: 3 };
  if (k in map) { e.preventDefault(); turn(map[k]); }
  else if (k === 'f' || k === 'F') toggleFull();
  else if (k === 'm' || k === 'M') toggleSound();
  else if (k === 'Escape') goHome();
  else if ((k === ' ' || k === 'Enter') && G.mode === 'result' && G.modeT > 1) setMode('title');
});

function goHome() {
  if (window.parent !== window) window.parent.postMessage({ type: 'minigame-exit', game: GAME_ID }, '*');
  else history.back();
}
function toggleFull() {
  const de = document.documentElement;
  if (!(document.fullscreenElement || document.webkitFullscreenElement)) {
    if (de.requestFullscreen) de.requestFullscreen().catch(() => {});
    else if (de.webkitRequestFullscreen) de.webkitRequestFullscreen();   // iPad の Safari
  } else if (document.exitFullscreen) document.exitFullscreen();
  else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
}
function toggleSound() { Snd.on = !Snd.on; Snd.init(); $('bSound').textContent = Snd.on ? '🔊' : '🔇'; }
$('bHome').onclick = goHome; $('bFull').onclick = toggleFull; $('bSound').onclick = toggleSound;
$('ui').addEventListener('pointerdown', e => e.stopPropagation());

// ---------- 犬をかく ----------
function cellCenter(x, y) { return [board.x + (x + 0.5) * board.cell, board.y + (y + 0.5) * board.cell]; }
function drawSprite(img, x, y, rot, scale = 1) {
  const [cx, cy] = cellCenter(x, y), c = board.cell * CFG.dogScale * scale + 1;
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot * Math.PI / 2);
  ctx.drawImage(img, -c / 2, -c / 2, c, c);
  ctx.restore();
}
// 回転 k（時計まわりに 90°×k）で dir がどこへ行くか
const rot = (d, k) => (d + k) % 4;
function drawStraight(x, y, vertical) {
  const [cx, cy] = cellCenter(x, y), c = board.cell, b = c * ASSETS.band * CFG.dogScale;
  ctx.save(); ctx.translate(cx, cy); if (!vertical) ctx.rotate(Math.PI / 2);
  ctx.fillStyle = ASSETS.skin;
  ctx.fillRect(-b / 2, -c / 2 - 1, b, c + 2);
  ctx.restore();
}
function drawDog() {
  const d = G.dog, n = d.length;
  if (n < 2) return;
  // しっぽ → 胴 → 顔 の順にかく（顔がいちばん上）
  for (let i = n - 1; i >= 0; i--) {
    const s = d[i];
    if (i === n - 1) {
      // しっぽ：絵は「左」が体につながる
      const p = dirOf(d[i - 1].x - s.x, d[i - 1].y - s.y);
      drawSprite(IMG.tail, s.x, s.y, (p - 3 + 4) % 4);
    } else if (i === 0) {
      const f = dirOf(s.x - d[1].x, s.y - d[1].y);
      // ぶつかったときは頭をぶるぶる
      const wob = G.mode === 'dead' && !G.win ? Math.sin(G.modeT * 40) * 0.06 * Math.max(0, 1 - G.modeT) : 0;
      const eat = 1 + G.eatFx * 0.15;
      const base = board.cell * CFG.dogScale, c = base * 1.3 * eat + 1;
      const [cx, cy] = cellCenter(s.x, s.y);
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(f * Math.PI / 2 + wob);
      // たべたときにふくらんでも、首のつけねの位置はかわらないように
      ctx.drawImage(IMG.head, -c / 2, -c / 2 - (c - base) / 2, c, c);
      ctx.restore();
    } else {
      const a = dirOf(d[i - 1].x - s.x, d[i - 1].y - s.y);
      const b = dirOf(d[i + 1].x - s.x, d[i + 1].y - s.y);
      if ((a + 2) % 4 === b) drawStraight(s.x, s.y, a % 2 === 0);
      else {
        // カーブの絵は「上」と「右」がつながる
        let k = 0;
        for (; k < 4; k++) {
          const u = rot(0, k), r = rot(1, k);
          if ((u === a && r === b) || (u === b && r === a)) break;
        }
        drawSprite(IMG.curve, s.x, s.y, k);
      }
    }
  }
}

// ---------- 文字 ----------
const FONT = '"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","BIZ UDPGothic","Meiryo",system-ui,sans-serif';
function outlined(text, x, y, size, fill, stroke = '#2f5418', lw = 0.2, align = 'center') {
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * lw; ctx.strokeStyle = stroke;
  ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y);
}
function drawBoneIcon(x, y, size, rotA = 0) {
  const [bw, bh] = ASSETS.boneSize, s = size / Math.max(bw, bh);
  ctx.save(); ctx.translate(x, y); ctx.rotate(rotA);
  ctx.drawImage(IMG.bone, -bw * s / 2, -bh * s / 2, bw * s, bh * s);
  ctx.restore();
}

// ---------- メインループ ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  G.t += dt; G.modeT += dt;
  G.eatFx = Math.max(0, G.eatFx - dt * 4);
  G.shake = Math.max(0, G.shake - dt * 3);

  if (G.mode === 'play') {
    G.stepT += dt;
    while (G.stepT >= G.step && G.mode === 'play') { G.stepT -= G.step; stepDog(); }
  } else if (G.mode === 'dead') {
    if (G.modeT > 1.1) { setMode('result'); G.lastInput = G.t; $('title').classList.add('off'); }
  } else if (G.mode === 'result') {
    if (G.t - G.lastInput > CFG.resultIdle) setMode('title');
  }
  if (G.mode === 'result' || G.mode === 'dead') $('title').classList.add('off');

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#4a752c'; ctx.fillRect(0, 0, W, H);
  if (G.mode === 'title') { requestAnimationFrame(frame); return; }

  if (G.shake > 0) ctx.translate(rand(-1, 1) * G.shake * U, rand(-1, 1) * G.shake * U);
  // マップ
  const pad = board.cell * 0.18;
  ctx.fillStyle = '#578a34';
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(board.x - pad, board.y - pad, board.s + pad * 2, board.s + pad * 2, pad) : ctx.rect(board.x - pad, board.y - pad, board.s + pad * 2, board.s + pad * 2); ctx.fill();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(G.boardImg, board.x, board.y, board.s, board.s);
  ctx.imageSmoothingEnabled = true;
  // 骨
  if (G.bone) {
    G.boneT += dt;
    const [bx, by] = cellCenter(G.bone.x, G.bone.y);
    const pop = Math.min(1, G.boneT * 5);
    const bob = Math.sin(G.t * 4) * 0.06;
    drawBoneIcon(bx, by, board.cell * 0.85 * pop * (1 + bob), Math.sin(G.t * 2) * 0.12);
  }
  drawDog();
  // 粒と文字
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, p.life * 3); ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i]; t.life -= dt; t.y -= dt * 6 * U;
    if (t.life <= 0) { texts.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, t.life * 2.5);
    outlined(t.text, t.x, t.y, board.cell * 0.7, '#fff');
  }
  ctx.globalAlpha = 1;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // 上に小さく骨の数
  if (G.mode === 'play' || G.mode === 'ready' || G.mode === 'dead') {
    const y = board.countY, mx = board.countX;
    drawBoneIcon(mx - 4 * U, y, 6 * U, -0.6);
    outlined(`${G.bones}`, mx + 1 * U, y, 5.5 * U, '#fff', '#2f5418', 0.2, 'left');
  }
  if (G.mode === 'ready') {
    ctx.globalAlpha = 0.75 + 0.25 * Math.sin(G.t * 4);
    outlined('やじるしを おして スタート！', board.x + board.s / 2, board.y + board.s * 0.78, Math.min(5 * U, board.s * 0.065), '#fff');
    ctx.globalAlpha = 1;
  }
  if (G.mode === 'result') {
    const t = clamp(G.modeT / 0.35, 0, 1), sc = 0.6 + 0.4 * (1 - Math.pow(1 - t, 3));
    ctx.fillStyle = `rgba(30,50,15,${0.45 * t})`; ctx.fillRect(0, 0, W, H);
    const pw = Math.min(W * 0.8, 72 * U) * sc, ph = 52 * U * sc, cx = W / 2, cy = H / 2;
    ctx.globalAlpha = t;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#578a34'; ctx.lineWidth = U;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(cx - pw / 2, cy - ph / 2, pw, ph, 4 * U) : ctx.rect(cx - pw / 2, cy - ph / 2, pw, ph);
    ctx.fill(); ctx.stroke();
    outlined(G.win ? 'ぜんぶ たべた！' : 'とった ほね', cx, cy - 17 * U * sc, 5 * U * sc, '#3b6b1f', '#fff', 0.1);
    drawBoneIcon(cx - 14 * U * sc, cy + 1 * U * sc, 16 * U * sc, -0.6 + Math.sin(G.t * 3) * 0.08);
    outlined(`× ${G.bones}`, cx + 10 * U * sc, cy + 1 * U * sc, 15 * U * sc, '#ff7a3d', '#fff', 0.12);
    if (G.modeT > 1) outlined('タップで もういちど', cx, cy + 18 * U * sc, 4.2 * U * sc, '#3b6b1f', '#fff', 0.12);
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(frame);
}

resize();
setMode('title');
requestAnimationFrame(frame);
</script>
<script>
/* ---- iPhone / iPad（Safari）むけの調整 ---- */
(function () {
  const d = document;
  // 1) 見えている大きさが変わったら描き直す（アドレスバーが出たり消えたりしたとき・画面を回したとき）
  const re = () => { try { resize(); } catch (e) {} };
  if (window.visualViewport) visualViewport.addEventListener('resize', re);
  addEventListener('orientationchange', () => { setTimeout(re, 250); setTimeout(re, 700); });
  addEventListener('pageshow', re);
  // 2) 指2本での拡大・ダブルタップでの拡大・画面のひっぱりスクロールを止める
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => d.addEventListener(t, e => e.preventDefault(), { passive: false }));
  d.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  let lastEnd = 0;
  d.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastEnd < 350 && !e.target.closest('button')) e.preventDefault();
    lastEnd = now;
  }, { passive: false });
  // 3) 全画面にできないブラウザ（iPhone の Safari）では、全画面ボタンをかくす
  const fsOK = d.fullscreenEnabled || d.webkitFullscreenEnabled;
  const fb = d.getElementById('bFull');
  if (fb && !fsOK) fb.style.display = 'none';
  // 4) 音：さわったときに必ず音を出せる状態にする（iPhone は最初にさわるまで音が出ない）
  const unlock = () => {
    try {
      Snd.init();
      const ac = Snd.ac;
      if (!ac) return;
      if (ac.state !== 'running') ac.resume();
      if (!Snd._unlocked) {
        const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource();
        s.buffer = b; s.connect(ac.destination); s.start(0);
        Snd._unlocked = true;
      }
    } catch (e) {}
  };
  ['touchstart', 'touchend', 'pointerdown', 'click', 'keydown'].forEach(t => d.addEventListener(t, unlock, { capture: true, passive: true }));
  // ほかのアプリから もどってきたとき、音を止まったままにしない
  d.addEventListener('visibilitychange', () => { if (!d.hidden) { Snd._unlocked = false; } });
})();
</script>
</body>
