<script>
/* ============================================================
   共通の土台（kit）
   ・画面の大きさ（スマホのたて・横、プロジェクター）に合わせる
   ・マウス／マルチタッチの入力（はやさ つき）
   ・音（WebAudio で合成。音声ファイルなし）
   ・だれもさわらないと、自動でうごく「おためし」と、ヒントの文字
   ・iPhone / iPad（Safari）むけの調整
   各コンテンツは K.start({ ... }) をよぶだけ
   ============================================================ */
'use strict';
const K = (() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const K = { cv, ctx, W: 0, H: 0, U: 1, DPR: 1, t: 0, dt: 0, idle: 0, portrait: false };
  let app = null, last = 0, lastInput = -1e9;

  // ---------- 道具 ----------
  K.rand = (a, b) => a + Math.random() * (b - a);
  K.randi = (a, b) => Math.floor(K.rand(a, b + 1));
  K.pick = a => a[Math.floor(Math.random() * a.length)];
  K.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  K.lerp = (a, b, t) => a + (b - a) * t;
  K.dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
  K.hsl = (h, s, l, a = 1) => `hsla(${h},${s}%,${l}%,${a})`;
  K.ease = t => 1 - Math.pow(1 - K.clamp(t, 0, 1), 3);
  K.back = t => { t = K.clamp(t, 0, 1); const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
  K.FONT = '"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","BIZ UDPGothic","Meiryo",system-ui,sans-serif';
  K.text = (t, x, y, size, fill = '#fff', stroke = 'rgba(0,0,0,.45)', lw = 0.18, align = 'center') => {
    ctx.font = `900 ${size}px ${K.FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
    if (stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = size * lw; ctx.strokeStyle = stroke; ctx.strokeText(t, x, y); }
    ctx.fillStyle = fill; ctx.fillText(t, x, y);
  };
  K.circle = (x, y, r, fill) => { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, Math.PI * 2); ctx.fillStyle = fill; ctx.fill(); };
  K.rrect = (x, y, w, h, r) => { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); };
  K.star = (x, y, r, n = 5, inner = 0.45, rot = -Math.PI / 2) => {
    ctx.beginPath();
    for (let i = 0; i < n * 2; i++) { const a = rot + i * Math.PI / n, rr = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    ctx.closePath();
  };
  K.canvas = (w, h) => { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; };

  // ---------- どうぶつの かお（中心 x,y 半径 r） ----------
  // o: { blink:bool, mouth:'smile'|'open'|'o', look:[-1..1,-1..1], blush:bool }
  K.ANIMALS = ['usagi', 'kuma', 'neko', 'inu', 'buta', 'kaeru', 'hiyoko', 'panda', 'risu', 'pengin'];
  K.animal = (kind, x, y, r, o = {}) => {
    const C = {
      usagi: ['#fff', '#ffc4d6'], kuma: ['#b07a4f', '#e8c4a0'], neko: ['#ffb15c', '#fff1de'], inu: ['#e9c48f', '#fff6e6'],
      buta: ['#ffb7c9', '#ff8fab'], kaeru: ['#7ed957', '#d9ffc9'], hiyoko: ['#ffe14d', '#ff9e2c'], panda: ['#fff', '#222'],
      risu: ['#c9773e', '#ffe0bd'], pengin: ['#2b3a55', '#fff'],
    }[kind] || ['#ccc', '#fff'];
    const [a, b] = C, dk = '#2b2118';
    ctx.save(); ctx.translate(x, y);
    const ear = (ex, ey, rx, ry, rot, c1, c2) => { ctx.save(); ctx.translate(ex * r, ey * r); ctx.rotate(rot); ctx.fillStyle = c1; ctx.beginPath(); ctx.ellipse(0, 0, rx * r, ry * r, 0, 0, 7); ctx.fill(); if (c2) { ctx.fillStyle = c2; ctx.beginPath(); ctx.ellipse(0, ry * r * 0.1, rx * r * 0.55, ry * r * 0.65, 0, 0, 7); ctx.fill(); } ctx.restore(); };
    if (kind === 'usagi') { ear(-0.38, -1.05, 0.2, 0.55, -0.15, a, b); ear(0.38, -1.05, 0.2, 0.55, 0.15, a, b); }
    if (kind === 'kuma' || kind === 'risu') { ear(-0.7, -0.7, 0.28, 0.28, 0, a, b); ear(0.7, -0.7, 0.28, 0.28, 0, a, b); }
    if (kind === 'panda') { ear(-0.7, -0.7, 0.28, 0.28, 0, b); ear(0.7, -0.7, 0.28, 0.28, 0, b); }
    if (kind === 'neko') for (const s of [-1, 1]) { ctx.fillStyle = a; ctx.beginPath(); ctx.moveTo(s * 0.85 * r, -0.2 * r); ctx.lineTo(s * 0.7 * r, -1.05 * r); ctx.lineTo(s * 0.15 * r, -0.75 * r); ctx.fill(); ctx.fillStyle = '#ffc4d6'; ctx.beginPath(); ctx.moveTo(s * 0.7 * r, -0.4 * r); ctx.lineTo(s * 0.66 * r, -0.85 * r); ctx.lineTo(s * 0.35 * r, -0.7 * r); ctx.fill(); }
    if (kind === 'inu') { ear(-0.85, -0.1, 0.25, 0.5, 0.3, '#a8743e'); ear(0.85, -0.1, 0.25, 0.5, -0.3, '#a8743e'); }
    if (kind === 'buta') { ear(-0.6, -0.8, 0.22, 0.2, -0.5, a, b); ear(0.6, -0.8, 0.22, 0.2, 0.5, a, b); }
    if (kind === 'kaeru') { K.circle(-0.45 * r, -0.75 * r, 0.33 * r, a); K.circle(0.45 * r, -0.75 * r, 0.33 * r, a); }
    if (kind === 'hiyoko') { ctx.fillStyle = a; for (const s of [-1, 0, 1]) { ctx.beginPath(); ctx.ellipse(s * 0.15 * r, -1 * r, 0.08 * r, 0.2 * r, s * 0.5, 0, 7); ctx.fill(); } }
    // かお

    if (now - lastEnd < 350 && !e.target.closest('button') && !e.target.closest('canvas')) e.preventDefault();
    lastEnd = now;
  }, { passive: false });
  if (!(d.fullscreenEnabled || d.webkitFullscreenEnabled)) $('bFull').style.display = 'none';
  const unlock = () => {
    try {
      S.init();
      if (!S.ac) return;
      if (S.ac.state !== 'running') S.ac.resume();
      if (!S._unlocked) { const b = S.ac.createBuffer(1, 1, 22050), s = S.ac.createBufferSource(); s.buffer = b; s.connect(S.ac.destination); s.start(0); S._unlocked = true; }
    } catch (e) {}
  };
  ['touchstart', 'touchend', 'pointerdown', 'click', 'keydown'].forEach(t => d.addEventListener(t, unlock, { capture: true, passive: true }));
  d.addEventListener('visibilitychange', () => { if (!d.hidden) S._unlocked = false; });

  return K;
})();

</script>
<script>
/* ===== 泡風呂 ===== */
// @id awaburo
// @title 泡風呂
// @cat すな・ゆき・ねんど
// @desc あわを はらうと デジパの え や アヒル・ロボットが 出てくる
// @bg #bfe6f5
const { rand, pick, clamp, dist } = K;
let cover = null, ducks = [], checkT = 0;
let grid = null, GW = 0, GH = 0, CS = 1;
const BACK = 10;   // けした あわが もどるまでの びょうすう
const pops = new K.Parts(400);
function drawFoam(c, W, H) {
  const U = K.U;
  c.fillStyle = '#f7fbff'; c.fillRect(0, 0, W, H);
  for (let i = 0; i < W * H / (U * U) * 0.12; i++) {
    const x = rand(0, W), y = rand(0, H), r = rand(1.5, 5) * U;
    const g = c.createRadialGradient(x - r * 0.3, y - r * 0.3, 0, x, y, r);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.7, 'rgba(235,245,255,0.95)'); g.addColorStop(1, 'rgba(190,215,240,0.9)');
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
  }
}
K.start({
  id: 'awaburo', title: '泡風呂', hint: 'あわを はらって なにが かくれているか みてみよう',
  demoTap: 0, demoPoint() { const d = pick(ducks); return [d.x - 6 * K.U, d.y]; },
  resize() {
    const { W, H, U } = K;
    ducks = [];
    const n = K.portrait ? 3 : 4;
    for (let i = 0; i < n; i++) ducks.push({ robot: i === 1, x: (i + 0.5) / n * W + rand(-3, 3) * U, y: rand(0.3, 0.8) * H, ph: rand(0, 6), s: rand(1, 1.3), found: false, wig: 0, face: Math.random() < 0.5 ? -1 : 1, c: pick(['#ffd23f', '#ffd23f', '#ff8fb1', '#7fd0ff']) });
    cover = new K.Cover(drawFoam, 0.5); grid = null;
  },
  down(p) { cover.erase(p.x, p.y, p.x + 0.1, p.y, 5 * K.U); mark(p.x, p.y, p.x, p.y, 5 * K.U); bubble(p.x, p.y); },
  move(p) {
    if (!p.down) return;
    cover.erase(p.px, p.py, p.x, p.y, 5 * K.U); mark(p.px, p.py, p.x, p.y, 5 * K.U);
    if (Math.random() < 0.3) bubble(p.x, p.y);
  },
  update(dt) {
    pops.update(dt);
    for (const d of ducks) { d.ph += dt; d.wig = Math.max(0, d.wig - dt); }
    checkT -= dt;
    if (checkT <= 0) {
      checkT = 0.3;
      for (const d of ducks) {
        const s = 5 * K.U * d.s, r = cover.remain(d.x - s, d.y - s, s * 2, s * 2, 3);
        if (!d.found && r < 0.5) { d.found = true; d.wig = 1; d.robot ? beep(d) : quack(d); }
        if (d.found && r > 0.85) d.found = false;
      }
    }
    regrow();   // けしてから 10びょう たつと あわが もどる
  },
  draw(ctx) {
    const { W, H, U, t } = K;
    // あわの したの え（デジパ）
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, W, H);
    const im = K.img('logo');
    if (im) { const sc = Math.max(W / im.width, H / im.height) * 1.02, iw = im.width * sc, ih = im.height * sc; ctx.drawImage(im, (W - iw) / 2 + Math.sin(t * 0.4) * U * 0.6, (H - ih) / 2 + Math.cos(t * 0.3) * U * 0.6, iw, ih); }
    // おゆの ゆらめき
    ctx.fillStyle = 'rgba(120,200,235,0.16)'; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 0.35 * U;
    for (let y = 3 * U; y < H; y += 9 * U) { ctx.beginPath(); for (let x = 0; x <= W; x += 15) ctx.lineTo(x, y + Math.sin(x * 0.025 + t * 1.3 + y) * U); ctx.stroke(); }
    for (const d of ducks) d.robot ? drawRobot(ctx, d, t) : drawDuck(ctx, d, t);
    cover.draw();
    pops.draw();
  },
});
// けした ところを マスごとに おぼえておく（けした じかん）
function mark(x0, y0, x1, y1, r) {
  if (!grid || grid.w !== cover.w) { CS = 2 * K.U; GW = Math.ceil(K.W / CS); GH = Math.ceil(K.H / CS); grid = new Float32Array(GW * GH).fill(-1); grid.w = cover.w; }
  const n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / (r * 0.5)));
  for (let i = 0; i <= n; i++) {
    const cx = x0 + (x1 - x0) * i / n, cy = y0 + (y1 - y0) * i / n;
    const ga = Math.max(0, Math.floor((cx - r) / CS)), gb = Math.min(GW - 1, Math.floor((cx + r) / CS));
    const ha = Math.max(0, Math.floor((cy - r) / CS)), hb = Math.min(GH - 1, Math.floor((cy + r) / CS));
    for (let gy = ha; gy <= hb; gy++) for (let gx = ga; gx <= gb; gx++) if (Math.hypot((gx + 0.5) * CS - cx, (gy + 0.5) * CS - cy) < r + CS) grid[gy * GW + gx] = K.t;
  }
}
function regrow() {
  if (!grid) return;
  const x = cover.x, s = cover.scale;
  let fade = false, done = false;
  const pf = new Path2D(), pd = new Path2D();
  for (let i = 0; i < grid.length; i++) {
    const t0 = grid[i]; if (t0 < 0) continue;
    const age = K.t - t0; if (age < BACK) continue;
    const rx = (i % GW) * CS * s, ry = Math.floor(i / GW) * CS * s, w = CS * s + 1;
    if (age > BACK + 1.2) { pd.rect(rx, ry, w, w); done = true; grid[i] = -1; }
    else { pf.rect(rx, ry, w, w); fade = true; }
  }
  // 1びょう くらいで じわっと もどる
  if (fade) { x.save(); x.clip(pf); x.globalAlpha = 0.1; x.drawImage(cover.full, 0, 0); x.restore(); }
  if (done) { x.save(); x.clip(pd); x.drawImage(cover.full, 0, 0); x.restore(); }
}
function bubble(x, y) {
  const U = K.U;
  pops.add({ x: x + rand(-3, 3) * U, y, vx: rand(-4, 4) * U, vy: -rand(8, 20) * U, life: rand(1, 2), size: rand(0.8, 2) * U, color: 'rgba(255,255,255,0.8)', shape: (c, p) => { c.strokeStyle = 'rgba(255,255,255,0.9)'; c.lineWidth = 0.25 * U; c.beginPath(); c.arc(0, 0, p.size, 0, 7); c.stroke(); c.fillStyle = 'rgba(255,255,255,0.7)'; c.beginPath(); c.arc(-p.size * 0.35, -p.size * 0.35, p.size * 0.2, 0, 7); c.fill(); }, wob: 3, wobA: 4 * U });
  if (Math.random() < 0.3) K.snd.pop(0.05);
}
function quack(d) { const pan = d.x / K.W * 2 - 1; K.snd.tone('square', 700, 450, 0.12, 0.08, 0, pan); K.snd.tone('sawtooth', 1400, 900, 0.12, 0.04, 0, pan); K.snd.tone('square', 650, 420, 0.12, 0.07, 0.18, pan); }
function drawDuck(ctx, d, t) {
  const U = K.U, s = d.s * U;
  ctx.save(); ctx.translate(d.x, d.y + Math.sin(d.ph * 1.5) * 0.6 * U); ctx.rotate(Math.sin(d.ph) * 0.06 + Math.sin(t * 25) * d.wig * 0.15); ctx.scale(d.face, 1);
  ctx.fillStyle = 'rgba(0,60,90,0.15)'; ctx.beginPath(); ctx.ellipse(0, 3.6 * s, 6 * s, 1.2 * s, 0, 0, 7); ctx.fill();
  ctx.fillStyle = d.c;
  ctx.beginPath(); ctx.ellipse(0, 1 * s, 5.5 * s, 3.2 * s, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-5 * s, 0); ctx.lineTo(-7 * s, -2.5 * s); ctx.lineTo(-3.5 * s, -1 * s); ctx.fill();
  K.circle(2.6 * s, -3 * s, 2.8 * s, d.c);
  ctx.fillStyle = '#ff8c00'; ctx.beginPath(); ctx.ellipse(5.4 * s, -2.4 * s, 1.8 * s, 0.8 * s, 0.1, 0, 7); ctx.fill();
  K.circle(3.4 * s, -3.8 * s, 0.6 * s, '#111'); K.circle(3.6 * s, -4 * s, 0.2 * s, '#fff');
  ctx.fillStyle = 'rgba(0,0,0,0.12)'; ctx.beginPath(); ctx.ellipse(-1 * s, 0.6 * s, 2.6 * s, 1.4 * s, 0.2, 0, 7); ctx.fill();
  ctx.restore();
}
function beep(d) { const pan = d.x / K.W * 2 - 1; [0, 4, 7].forEach((n, i) => K.snd.tone('square', K.snd.midi(79 + n), 0, 0.1, 0.05, i * 0.09, pan)); }
function drawRobot(ctx, d, t) {
  const im = K.img('robot'); if (!im) return;
  const U = K.U, w = 14 * U * d.s, h = w * im.height / im.width;
  ctx.save(); ctx.translate(d.x, d.y + Math.sin(d.ph * 1.5) * 0.6 * U); ctx.rotate(Math.sin(d.ph) * 0.08 + Math.sin(t * 25) * d.wig * 0.15);
  ctx.fillStyle = 'rgba(0,60,90,0.18)'; ctx.beginPath(); ctx.ellipse(0, h * 0.42, w * 0.45, h * 0.1, 0, 0, 7); ctx.fill();
  ctx.drawImage(im, -w / 2, -h / 2, w, h);
  ctx.restore();
}

</script>
