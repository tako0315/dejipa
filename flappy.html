<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="mobile-web-app-capable" content="yes">

<title>ぱたぱたフライト</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#abe1fb;

  canvas{display:block;width:100vw;height:100vh;cursor:pointer}
  #ui{position:fixed;top:1.2vmin;right:1.2vmin;display:flex;gap:1vmin;opacity:.25;transition:opacity .2s}
  #ui:hover{opacity:1}
  #ui button{font:bold 2vmin system-ui,sans-serif;border:0;border-radius:1.2vmin;padding:.9vmin 1.4vmin;
    background:rgba(255,255,255,.9);color:#2a7ab5;cursor:pointer}

  /* iPhone / iPad（Safari）むけ：画面をひっぱってもずれない・タップしたときの灰色のわくを出さない */
  html,body{position:fixed;inset:0;width:100%;height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  *{-webkit-tap-highlight-color:transparent}
  button{touch-action:manipulation}
  canvas#c{width:100% !important;height:100% !important}
</style>
</head>

const CFG = {
  gravity: 230,        // 重力
  flap: -68,           // はばたいたときの上むきの速さ
  maxFall: 95,         // 落ちる速さの上限
  speed: 30,           // 横に進む速さ
  speedUp: 0.06,       // 1メートル進むごとに速くなる量
  speedMax: 42,
  gapStart: 34,        // 土管のすきま（はじめ）
  gapEnd: 26,          // 土管のすきま（いちばんせまく）
  gapShrinkM: 150,     // 何メートルで いちばんせまくなるか
  spacing: 58,         // 土管と土管のあいだ
  pipeW: 17,           // 土管の先端のはば
  birdW: 16,           // キャラクターのはば
  meter: 10,           // 10U 進むと 1メートル
  resultIdle: 15,      // 結果画面で何秒さわらないとタイトルにもどるか
};

// ---------- キャンバス ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, U = 1, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; U = H / 100;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.imageSmoothingQuality = 'high';
}
addEventListener('resize', resize);

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- 画像 ----------
function loadImg(b64, type = 'png') { const i = new Image(); i.src = `data:image/${type};base64,` + b64; return i; }
const IMG = {
  bg: loadImg(ASSETS.bg, 'jpeg'),
  cap: loadImg(ASSETS.cap), body: loadImg(ASSETS.body),
  close: loadImg(ASSETS.close), open: loadImg(ASSETS.open),
};
const [BGW, BGH] = ASSETS.bgSize;
const GROUND = ASSETS.groundY;            // 地面の上はしの位置（画面の高さに対する割合）
const [CAPW, CAPH] = ASSETS.capSize;
const [BODYW, BODYH] = ASSETS.bodySize;
const [CHW, CHH] = ASSETS.charSize;
const CH_CENTER = [255, 290], CH_R = 118;  // キャラクター画像の中の体の中心と当たり判定の半径

// ---------- 音（WebAudio で合成） ----------
const Snd = {
  ac: null, on: true, noise: null,
  init() {
    if (this.ac) { if (this.ac.state !== 'running') this.ac.resume(); return; }
    try {
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
      const len = this.ac.sampleRate * 0.5, b = this.ac.createBuffer(1, len, this.ac.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = b;
    } catch (e) {}
  },
  tone(type, f0, f1, dur, vol, delay = 0) {
    if (!this.on || !this.ac) return;
    const t = this.ac.currentTime + delay, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ac.destination); o.start(t); o.stop(t + dur + 0.05);
  },
  flap() {
    if (!this.on || !this.ac) return;
    const t = this.ac.currentTime, s = this.ac.createBufferSource(); s.buffer = this.noise;
    const f = this.ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(900, t);
    f.frequency.exponentialRampToValueAtTime(2200, t + 0.12); f.Q.value = 1.5;
    const g = this.ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
    s.connect(f).connect(g).connect(this.ac.destination); s.start(t); s.stop(t + 0.2);
    this.tone('sine', 420, 620, 0.08, 0.05);
  },
  point() { this.tone('square', 988, 988, 0.06, 0.06); this.tone('square', 1319, 1319, 0.12, 0.06, 0.06); },
  hit() { this.tone('sawtooth', 220, 60, 0.3, 0.25); this.tone('square', 120, 40, 0.25, 0.15); },
  fall() { this.tone('triangle', 700, 150, 0.5, 0.12, 0.15); },
  result() { [523, 659, 784].forEach((f, i) => this.tone('triangle', f, f, 0.22, 0.14, i * 0.1)); },
};

// ---------- 状態 ----------
// mode: 'ready'（タイトル） → 'play' → 'dead'（落ちている） → 'result'
const G = {
  mode: 'ready', t: 0, modeT: 0,
  y: 50, vy: 0, ang: 0, flapT: 0,
  dist: 0, speed: CFG.speed,
  pipes: [], nextPipe: 0,
  bgOff: 0, groundOff: 0,
  shake: 0, flash: 0,
  lastInput: 0,
};
const birdX = () => Math.min(W * 0.3, 60 * U);

function setMode(m) { G.mode = m; G.modeT = 0; }
function reset() {
  G.y = 45; G.vy = 0; G.ang = 0; G.flapT = 0;
  G.dist = 0; G.speed = CFG.speed;
  G.pipes = []; G.nextPipe = 0;
  setMode('ready');
}

function flap() {
  G.vy = CFG.flap; G.flapT = 0.18;
  Snd.flap();
  for (let i = 0; i < 4; i++) feathers.push({ x: birdX() - 4 * U, y: G.y * U + 2 * U, vx: rand(-25, -10) * U, vy: rand(-5, 10) * U, life: rand(0.3, 0.5), r: rand(0.5, 0.9) * U });
}

function input() {
  Snd.init();
  G.lastInput = G.t;
  if (G.mode === 'ready') { setMode('play'); G.nextPipe = W - birdX() + 10 * U; flap(); }
  else if (G.mode === 'play') flap();
  else if (G.mode === 'result' && G.modeT > 1.0) { reset(); }
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); input(); });
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  if (e.repeat) return;
  if (e.code === 'Space' || e.key === 'ArrowUp' || e.key === 'Enter') { e.preventDefault(); input(); }
  else if (e.key === 'f' || e.key === 'F') toggleFull();
  else if (e.key === 'm' || e.key === 'M') toggleSound();
  else if (e.key === 'Escape') goHome();
});

function goHome() {
  if (window.parent !== window) window.parent.postMessage({ type: 'minigame-exit', game: GAME_ID }, '*');
  else history.back();
}
function toggleFull() {
  const de = document.documentElement;
  if (!(document.fullscreenElement || document.webkitFullscreenElement)) {
    if (de.requestFullscreen) de.requestFullscreen().catch(() => {});
    else if (de.webkitRequestFullscreen) de.webkitRequestFullscreen();   // iPad の Safari
  } else if (document.exitFullscreen) document.exitFullscreen();
  else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
}
function toggleSound() {
  Snd.on = !Snd.on; Snd.init();
  document.getElementById('bSound').textContent = Snd.on ? '🔊' : '🔇';
}
document.getElementById('bHome').onclick = goHome;
document.getElementById('bFull').onclick = toggleFull;
document.getElementById('bSound').onclick = toggleSound;
// ボタンを押したときにゲームが反応しないように
document.getElementById('ui').addEventListener('pointerdown', e => e.stopPropagation());

// ---------- 土管 ----------
function addPipe(x) {
  const m = G.dist / CFG.gapShrinkM;
  const gap = CFG.gapStart + (CFG.gapEnd - CFG.gapStart) * clamp(m, 0, 1);
  const top = 10, bottom = GROUND * 100 - 10;
  // 前の土管からいきなり大きくはなれないようにする
  const prev = G.pipes.length ? G.pipes[G.pipes.length - 1].c : (top + bottom) / 2;
  const maxJump = 28;
  const c = clamp(rand(top + gap / 2, bottom - gap / 2), prev - maxJump, prev + maxJump);
  G.pipes.push({ x, c: clamp(c, top + gap / 2, bottom - gap / 2), gap, passed: false });
}
function pipeGeom() {
  const p = CFG.pipeW * U / CAPW;           // 画像 → 画面 の倍率
  return { p, capW: CAPW * p, capH: CAPH * p, bodyW: BODYW * p, off: ASSETS.capOff * p };
}
function drawPipe(pp) {
  const g = pipeGeom(), x = pp.x * U;
  const yb = (pp.c + pp.gap / 2) * U, yt = (pp.c - pp.gap / 2) * U, gy = GROUND * H;
  // 下の土管（先端が上）
  ctx.drawImage(IMG.body, x + g.off, yb + g.capH - 2, g.bodyW, Math.max(0, gy - yb - g.capH + 4 * U));
  ctx.drawImage(IMG.cap, x, yb, g.capW, g.capH);
  // 上の土管（上下反転して先端が下）
  ctx.save();
  ctx.translate(0, yt); ctx.scale(1, -1);
  ctx.drawImage(IMG.body, x + g.off, g.capH - 2, g.bodyW, Math.max(0, yt - g.capH + 4));
  ctx.drawImage(IMG.cap, x, 0, g.capW, g.capH);
  ctx.restore();
}
function circleRect(cx, cy, r, x, y, w, h) {
  const nx = clamp(cx, x, x + w), ny = clamp(cy, y, y + h);
  return (cx - nx) ** 2 + (cy - ny) ** 2 < r * r;
}
function hitPipes(cx, cy, r) {
  const g = pipeGeom();
  for (const pp of G.pipes) {
    const x = pp.x * U, yb = (pp.c + pp.gap / 2) * U, yt = (pp.c - pp.gap / 2) * U;
    // 先端（はばが広い）と、胴（少しせまい）
    if (circleRect(cx, cy, r, x + 2, yb + 2, g.capW - 4, g.capH)) return true;
    if (circleRect(cx, cy, r, x + g.off, yb + g.capH, g.bodyW, H)) return true;
    if (circleRect(cx, cy, r, x + 2, yt - g.capH - 2, g.capW - 4, g.capH)) return true;
    if (circleRect(cx, cy, r, x + g.off, -H, g.bodyW, yt - g.capH + H)) return true;
  }
  return false;
}

// ---------- 背景 ----------
// 背景の絵を高さに合わせて横にならべる。つなぎ目が目立たないよう1枚おきに左右反転
function drawTiled(sy, sh, dy, dh, off) {
  const tw = BGW * (H / BGH);
  let start = -((off % (tw * 2)) + tw * 2) % (tw * 2);
  for (let x = start, i = 0; x < W; x += tw, i++) {
    if (i % 2 === 0) ctx.drawImage(IMG.bg, 0, sy, BGW, sh, x, dy, tw + 1, dh);
    else {
      ctx.save(); ctx.translate(x + tw, 0); ctx.scale(-1, 1);
      ctx.drawImage(IMG.bg, 0, sy, BGW, sh, 0, dy, tw + 1, dh);
      ctx.restore();
    }
  }
}
function drawSky() { drawTiled(0, BGH * GROUND, 0, H * GROUND + 1, G.bgOff); }
function drawGround() { drawTiled(BGH * GROUND, BGH * (1 - GROUND), H * GROUND, H * (1 - GROUND) + 1, G.groundOff); }

// ---------- キャラクター ----------
const feathers = [];
function drawBird() {
  const s = CFG.birdW * U / CHW;
  const img = (G.mode === 'ready' ? (Math.floor(G.t * 5) % 2 === 0) : G.flapT > 0) && G.mode !== 'dead' && G.mode !== 'result' ? IMG.open : IMG.close;
  ctx.save();
  ctx.translate(birdX(), G.y * U);
  ctx.rotate(G.ang);
  ctx.drawImage(img, -CH_CENTER[0] * s, -CH_CENTER[1] * s, CHW * s, CHH * s);
  ctx.restore();
}

// ---------- 文字 ----------
const FONT = '"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","BIZ UDPGothic","Meiryo",system-ui,sans-serif';
function outlined(text, x, y, size, fill, stroke = '#fff', lw = 0.2) {
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * lw; ctx.strokeStyle = stroke;
  ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y);
}

// ---------- メインループ ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.04, (now - last) / 1000); last = now;
  G.t += dt; G.modeT += dt;
  G.flapT = Math.max(0, G.flapT - dt);
  const groundY = GROUND * 100;
  const r = CH_R * (CFG.birdW / CHW);   // 当たり判定の半径（U）

  if (G.mode === 'ready') {
    // ふわふわ待つ
    G.y = 45 + Math.sin(G.t * 3) * 2;
    G.ang = Math.sin(G.t * 3) * 0.05;
    G.groundOff += CFG.speed * U * dt; G.bgOff += CFG.speed * U * dt * 0.15;
  } else if (G.mode === 'play') {
    G.speed = Math.min(CFG.speedMax, CFG.speed + G.dist * CFG.speedUp);
    const dx = G.speed * dt;
    G.dist += dx / CFG.meter;
    G.groundOff += dx * U; G.bgOff += dx * U * 0.15;
    G.vy = Math.min(CFG.maxFall, G.vy + CFG.gravity * dt);
    G.y += G.vy * dt;
    if (G.y < r) { G.y = r; G.vy = Math.max(0, G.vy); }    // 天井はぶつからない
    G.ang = clamp(G.vy / 110, -0.45, 1.2);
    // 土管
    for (const pp of G.pipes) {
      pp.x -= dx;
      if (!pp.passed && pp.x + CFG.pipeW < birdX() / U) { pp.passed = true; Snd.point(); }
    }
    while (G.pipes.length && G.pipes[0].x < -CFG.pipeW - 5) G.pipes.shift();
    G.nextPipe -= dx * U;
    if (G.nextPipe <= 0) { addPipe(W / U + 2); G.nextPipe += CFG.spacing * U; }
    // ぶつかった？
    const cx = birdX(), cy = G.y * U;
    if (hitPipes(cx, cy, r * U) || G.y + r >= groundY) {
      Snd.hit(); G.shake = 1; G.flash = 1;
      if (G.y + r < groundY) { Snd.fall(); G.vy = -20; }
      setMode('dead');
    }
  } else if (G.mode === 'dead') {
    // 地面まで落ちる
    G.vy = Math.min(CFG.maxFall * 1.3, G.vy + CFG.gravity * 1.2 * dt);
    G.y = Math.min(groundY - r * 0.7, G.y + G.vy * dt);
    G.ang = Math.min(1.5, G.ang + dt * 5);
    if (G.y >= groundY - r * 0.7 && G.modeT > 0.4) { setMode('result'); G.lastInput = G.t; Snd.result(); }
  } else if (G.mode === 'result') {
    if (G.t - G.lastInput > CFG.resultIdle) reset();
  }
  G.shake = Math.max(0, G.shake - dt * 3);
  G.flash = Math.max(0, G.flash - dt * 4);

  // ---- 描画 ----
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (G.shake > 0) ctx.translate(rand(-1, 1) * G.shake * U, rand(-1, 1) * G.shake * U);
  if (IMG.bg.complete) drawSky();
  for (const pp of G.pipes) drawPipe(pp);
  if (IMG.bg.complete) drawGround();

  // はね
  for (let i = feathers.length - 1; i >= 0; i--) {
    const f = feathers[i]; f.life -= dt; f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.life <= 0) { feathers.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, f.life * 3); ctx.fillStyle = '#dfe8ff';
    ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawBird();

  if (G.flash > 0) { ctx.fillStyle = `rgba(255,255,255,${G.flash * 0.7})`; ctx.fillRect(-10, -10, W + 20, H + 20); }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // ---- 文字（最小限） ----
  if (G.mode === 'play' || G.mode === 'dead') {
    outlined(`${Math.floor(G.dist)} m`, W / 2, 9 * U, 8 * U, '#ffffff', '#3a7bbf', 0.18);
  }
  if (G.mode === 'ready') {
    const a = 0.75 + 0.25 * Math.sin(G.t * 4);
    ctx.globalAlpha = a;
    outlined('タップで はばたく！', W / 2, GROUND * H - 9 * U, 6.5 * U, '#ffffff', '#3a7bbf', 0.22);
    ctx.globalAlpha = 1;
  }
  if (G.mode === 'result') {
    const t = clamp(G.modeT / 0.35, 0, 1), sc = 0.6 + 0.4 * (1 - Math.pow(1 - t, 3));
    const pw = Math.min(W * 0.8, 70 * U), ph = 50 * U, px = W / 2 - pw / 2 * sc, py = H * 0.38 - ph / 2 * sc;
    ctx.save();
    ctx.globalAlpha = t;
    ctx.fillStyle = 'rgba(255,255,255,0.92)'; ctx.strokeStyle = '#3a7bbf'; ctx.lineWidth = 1 * U;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(px, py, pw * sc, ph * sc, 4 * U) : ctx.rect(px, py, pw * sc, ph * sc);
    ctx.fill(); ctx.stroke();
    outlined('すすんだ きょり', W / 2, H * 0.38 - 16 * U * sc, 5 * U * sc, '#3a7bbf', '#fff', 0.1);
    outlined(`${Math.floor(G.dist)} m`, W / 2, H * 0.38 + 1 * U * sc, 18 * U * sc, '#ff7a3d', '#fff', 0.12);
    ctx.restore();
    if (G.modeT > 1.0) {
      ctx.globalAlpha = 0.75 + 0.25 * Math.sin(G.t * 4);
      outlined('タップで もういちど', W / 2, H * 0.38 + 17 * U, 4.5 * U, '#3a7bbf', '#fff', 0.15);
      ctx.globalAlpha = 1;
    }
  }
  requestAnimationFrame(frame);
}

resize();
reset();
requestAnimationFrame(frame);
</script>
<script>
/* ---- iPhone / iPad（Safari）むけの調整 ---- */
(function () {
  const d = document;
  // 1) 見えている大きさが変わったら描き直す（アドレスバーが出たり消えたりしたとき・画面を回したとき）
  const re = () => { try { resize(); } catch (e) {} };
  if (window.visualViewport) visualViewport.addEventListener('resize', re);
  addEventListener('orientationchange', () => { setTimeout(re, 250); setTimeout(re, 700); });
  addEventListener('pageshow', re);
  // 2) 指2本での拡大・ダブルタップでの拡大・画面のひっぱりスクロールを止める
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => d.addEventListener(t, e => e.preventDefault(), { passive: false }));
  d.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  let lastEnd = 0;
  d.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastEnd < 350 && !e.target.closest('button')) e.preventDefault();
    lastEnd = now;
  }, { passive: false });
  // 3) 全画面にできないブラウザ（iPhone の Safari）では、全画面ボタンをかくす
  const fsOK = d.fullscreenEnabled || d.webkitFullscreenEnabled;
  const fb = d.getElementById('bFull');
  if (fb && !fsOK) fb.style.display = 'none';
  // 4) 音：さわったときに必ず音を出せる状態にする（iPhone は最初にさわるまで音が出ない）
  const unlock = () => {
    try {
      Snd.init();
      const ac = Snd.ac;
      if (!ac) return;
      if (ac.state !== 'running') ac.resume();
      if (!Snd._unlocked) {
        const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource();
        s.buffer = b; s.connect(ac.destination); s.start(0);
        Snd._unlocked = true;
      }
    } catch (e) {}
  };
  ['touchstart', 'touchend', 'pointerdown', 'click', 'keydown'].forEach(t => d.addEventListener(t, unlock, { capture: true, passive: true }));
  // ほかのアプリから もどってきたとき、音を止まったままにしない
  d.addEventListener('visibilitychange', () => { if (!d.hidden) { Snd._unlocked = false; } });
})();
</script>
</body>
