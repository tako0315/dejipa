<script>
'use strict';
/* ============================================================
   はなげぬき  ― 鼻からはみ出た鼻毛をひたすら抜くインタラクティブコンテンツ
   ・鼻毛をつまんで（クリック／タッチ）ひっぱると、するする出てきて抜ける
   ・ゆっくり抜くと平気、いきおいよく抜くと痛がる
   ・マウス／マルチタッチ対応、外部ファイル不要（画像はこのファイルに埋め込み）
   ============================================================ */
const GAME_ID = 'hanage';

// ---------- 設定（調整用） ----------
const CFG = {
  hairsPerNostril: 3,
  slowSpeed: 45,      // これより遅い(U/秒)なら「平気」
  fastSpeed: 110,     // これより速いと「大いたがり」
  grabRadius: 7,      // つかめる範囲（U）
  regrowMin: 1.2, regrowMax: 3.0,   // 抜けたあと生えてくるまでの秒数
  idleHint: 7,        // 何秒さわらないとヒントを出すか
  idleReset: 60,      // 何秒さわらないとカウントをリセットするか
};

// ---------- キャンバス ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, U = 1, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; U = Math.min(W, H) / 100;
  cv.width = W * DPR; cv.height = H * DPR;
  layout();
}
addEventListener('resize', resize);

// ---------- 画像 ----------
function loadImg(b64) { const i = new Image(); i.src = 'data:image/png;base64,' + b64; return i; }
const noseImg = loadImg(ASSETS.nose);
const [NW, NH] = ASSETS.noseSize;
const hairTypes = ASSETS.hairs.map(h => {
  const img = loadImg(h.img);
  const dx = h.tip[0] - h.root[0], dy = h.tip[1] - h.root[1];
  return { img, root: h.root, len: Math.hypot(dx, dy), ang: Math.atan2(dy, dx) };
});
const SKIN = `rgb(${ASSETS.skin.join(',')})`;
const LINE = '#a87b28';
const DARK = '#4a2c12';

// 痛いときの赤い鼻（あらかじめ作っておく）
let redNose = null;
noseImg.onload = () => {
  redNose = document.createElement('canvas');
  redNose.width = NW; redNose.height = NH;
  const r = redNose.getContext('2d');
  r.drawImage(noseImg, 0, 0);
  r.globalCompositeOperation = 'source-atop';
  r.fillStyle = 'rgba(255,50,50,0.45)';
  r.fillRect(0, 0, NW, NH);
};

// ---------- レイアウト ----------
// 鼻の画像座標 → 画面座標  : sx = L.x + px*L.k
const L = { x: 0, y: 0, k: 1 };
function layout() {
  const nh = Math.min(H * 0.6, (W * 0.72) * NH / NW);
  L.k = nh / NH;
  L.x = (W - NW * L.k) / 2;
  L.y = H * 0.17;
}
const toS = (px, py) => [L.x + px * L.k, L.y + py * L.k];

// ---------- 音（WebAudio で合成。音声ファイルなし） ----------
const Snd = {
  ac: null, on: true,
  init() {
    if (this.ac) { if (this.ac.state !== 'running') this.ac.resume(); return; }
    try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  },
  tone(type, f0, f1, dur, vol, delay = 0) {
    if (!this.on || !this.ac) return;
    const t = this.ac.currentTime + delay;
    const o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ac.destination);
    o.start(t); o.stop(t + dur + 0.05);
  },
  tick(p) { this.tone('sine', 500 + p * 700, 520 + p * 760, 0.05, 0.05); },
  pop() { this.tone('sine', 380, 1100, 0.12, 0.35); this.tone('triangle', 1400, 2200, 0.06, 0.1, 0.03); },
  ouch(big) {
    if (!this.on || !this.ac) return;
    this.pop();
    const t = this.ac.currentTime + 0.02, dur = big ? 0.55 : 0.3;
    const o = this.ac.createOscillator(), o2 = this.ac.createOscillator();
    const lfo = this.ac.createOscillator(), lg = this.ac.createGain();
    const f = this.ac.createBiquadFilter(), g = this.ac.createGain();
    o.type = 'sawtooth'; o2.type = 'square';
    const hi = big ? 1000 : 800, lo = big ? 260 : 380;
    [o, o2].forEach((x, i) => {
      x.frequency.setValueAtTime(hi * (i ? 1.01 : 1), t);
      x.frequency.exponentialRampToValueAtTime(lo, t + dur);
    });
    lfo.frequency.value = big ? 14 : 9; lg.gain.value = big ? 40 : 20;
    lfo.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency);
    f.type = 'lowpass'; f.frequency.value = 2200; f.Q.value = 6;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(big ? 0.22 : 0.15, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(f); o2.connect(f); f.connect(g).connect(this.ac.destination);
    [o, o2, lfo].forEach(x => { x.start(t); x.stop(t + dur + 0.05); });
  },
  relief() { this.tone('sine', 660, 990, 0.12, 0.12, 0.08); this.tone('sine', 990, 1320, 0.15, 0.1, 0.18); },
  grow() { this.tone('sine', 200, 420, 0.18, 0.06); },
};

// ---------- 状態 ----------
const S = {
  count: 0, painCount: 0,
  pain: 0, painBig: false,     // 痛がり度 0〜1
  happy: 0,                    // ほっとした度 0〜1
  tension: 0,                  // ひっぱられ度 0〜1
  blink: 0, nextBlink: 2,
  lastInput: performance.now() / 1000,
  look: { x: 0, y: 0 },
  time: 0,
};

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];

// ---------- 鼻毛 ----------
class Hair {
  constructor(ex) {
    this.ex = ex;               // [x, y, side] 鼻画像座標での出口
    this.reset(true);
  }
  reset(initial) {
    this.type = pick(hairTypes);
    this.scale = rand(0.65, 0.9);
    this.len = this.type.len * this.scale;              // 画像座標での長さ
    this.flip = Math.random() < 0.5 ? -1 : 1;           // 左右反転で見た目に変化
    const side = this.ex[2];
    this.rest = Math.PI / 2 - side * rand(0.05, 0.5);   // 下向き＋外向き
    this.angle = this.rest;
    this.restOut = this.len * rand(0.1, 0.2);           // 「ちょっと」はみ出ている長さ
    this.out = initial ? this.restOut : 0;
    this.target = this.restOut;
    this.wait = initial ? 0 : rand(CFG.regrowMin, CFG.regrowMax);
    this.grabbed = null;
    this.phase = rand(0, 6.28);
    this.grew = initial;
  }
  exitS() { return toS(this.ex[0], this.ex[1]); }
  tipS() {
    const [x, y] = this.exitS(), o = this.out * L.k;
    return [x + Math.cos(this.angle) * o, y + Math.sin(this.angle) * o];
  }
  // 画面上の点からの距離（出ている部分の線分まで）
  dist(px, py) {
    if (this.wait > 0 || this.out < 2) return Infinity;
    const [x, y] = this.exitS(), o = this.out * L.k;
    const dx = Math.cos(this.angle), dy = Math.sin(this.angle);
    const t = clamp((px - x) * dx + (py - y) * dy, 0, o);
    return Math.hypot(px - (x + dx * t), py - (y + dy * t));
  }
  update(dt) {
    if (this.wait > 0) {
      this.wait -= dt;
      if (this.wait <= 0) { this.wait = 0; Snd.grow(); }
      return;
    }
    if (!this.grabbed) {
      // ゆれる・元の長さに戻る・ほうっておくと少しずつのびる
      this.target = clamp(this.target + dt * this.len * 0.006, this.restOut, this.len * 0.4);
      this.out += (this.target - this.out) * Math.min(1, dt * 3);
      const sway = Math.sin(S.time * 1.6 + this.phase) * 0.05;
      this.angle += (this.rest + sway - this.angle) * Math.min(1, dt * 5);
    }
  }
  draw(c) {
    if (this.wait > 0 || this.out <= 0.5) return;
    const [x, y] = this.exitS();
    const t = this.type, k = L.k * this.scale;
    c.save();
    c.translate(x, y);
    c.rotate(this.angle - Math.PI / 2);      // ここから +y が鼻毛の向き
    c.beginPath(); c.rect(-W, 0, W * 2, H * 2); c.clip();   // 鼻の穴の中は見えない
    c.translate(0, -(this.len - this.out) * L.k);            // 根元の位置
    if (this.flip < 0) c.scale(-1, 1);
    c.rotate(Math.PI / 2 - t.ang);
    c.scale(k, k);
    c.drawImage(t.img, -t.root[0], -t.root[1]);
    c.restore();
  }
}

let hairs = [];
function makeHairs() {
  hairs = ASSETS.exits.map(e => new Hair(e));
}

// ---------- 抜けた鼻毛・エフェクト ----------
const flying = [];   // 飛んでいく鼻毛
const parts = [];    // 粒
const texts = [];    // 文字
const tears = [];    // なみだ

function spawnFlying(h, vx, vy) {
  const [x, y] = h.tipS();
  flying.push({
    type: h.type, scale: h.scale, flip: h.flip,
    // 抜けた鼻毛は先端（指の位置）を中心に回転させる
    x, y, ang: h.angle, vx, vy,
    spin: clamp(vx / (30 * U), -6, 6) + rand(-2, 2), life: 4,
  });
  if (flying.length > 20) flying.shift();
}
function burst(x, y, n, colors, spd) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(0.4, 1) * spd * U;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 10 * U, r: rand(0.6, 1.4) * U,
      c: pick(colors), life: rand(0.5, 0.9), max: 0.9, star: Math.random() < 0.5 });
  }
}
function say(text, x, y, color, size, shake) {
  texts.push({ text, x, y, color, size, shake, life: 1.4, max: 1.4 });
  if (texts.length > 8) texts.shift();
}

// ---------- 抜けたとき ----------
function pulledOut(h, speed, ptr) {
  const [tx, ty] = h.tipS();
  const [ex, ey] = h.exitS();
  S.count++;
  spawnFlying(h, ptr.vx, ptr.vy);
  const big = speed >= CFG.fastSpeed, mid = speed >= CFG.slowSpeed;
  if (mid) {
    S.painCount++;
    S.pain = Math.max(S.pain, big ? 1 : 0.6);
    S.painBig = big || S.painBig;
    S.happy = 0;
    Snd.ouch(big);
    const msg = big ? pick(['いったーーい！！', 'ぎゃーーっ！！', 'いたたたたっ！！', 'ひぃーーっ！！'])
                    : pick(['いてっ！', 'いたっ！', 'あいたっ！']);
    say(msg, W / 2 + rand(-15, 15) * U, L.y + NH * L.k * 0.42, '#e8333a', big ? 11 : 8, big);
    burst(ex, ey, big ? 26 : 14, ['#ff4d4d', '#ffcc00', '#ffffff'], big ? 60 : 40);
    for (let i = 0; i < (big ? 14 : 6); i++) spawnTear(i % 2 ? 1 : -1, big);
  } else {
    S.happy = 1;
    Snd.pop(); Snd.relief();
    say(pick(['すぽっ', 'すっきり〜', 'ぬけた〜', 'ぽんっ']), ex + rand(-6, 6) * U, ey + 10 * U, '#2f8fd8', 7, false);
    burst(ex, ey, 10, ['#ffffff', '#8fd3ff', '#ffe066'], 30);
  }
  say(`${S.count}本！`, tx, ty - 4 * U, '#8a5a1c', 5, false);
  h.reset(false);
}

// ---------- 顔 ----------
function eyePos(side) {
  const ex = NW * (side < 0 ? 0.15 : 0.85), ey = NH * 0.02;
  return toS(ex, ey);
}
function spawnTear(side, big) {
  const [x, y] = eyePos(side);
  const r = NW * L.k * 0.085;
  tears.push({ x: x + side * r * 0.9, y: y + r * 0.1,
    vx: side * rand(12, big ? 55 : 28) * U, vy: rand(-45, -10) * U, life: 1.6 });
}

function drawFace(c) {
  const nw = NW * L.k, nh = NH * L.k;
  // ほっぺ
  for (const s of [-1, 1]) {
    const cx = W / 2 + s * nw * 0.62, cy = L.y + nh * 0.52;
    const g = c.createRadialGradient(cx, cy, 0, cx, cy, nw * 0.2);
    const a = 0.35 + S.pain * 0.4;
    g.addColorStop(0, `rgba(255,120,130,${a})`); g.addColorStop(1, 'rgba(255,120,130,0)');
    c.fillStyle = g; c.beginPath(); c.arc(cx, cy, nw * 0.2, 0, 7); c.fill();
  }
  const r = nw * 0.085;
  c.lineCap = 'round'; c.lineJoin = 'round';
  for (const s of [-1, 1]) {
    const [x, y] = eyePos(s);
    // まゆげ
    c.strokeStyle = DARK; c.lineWidth = r * 0.22;
    c.beginPath();
    const lift = S.pain > 0.05 ? -r * 0.35 * S.pain : 0;
    const tilt = S.pain > 0.05 ? r * 0.5 * S.pain : -S.tension * r * 0.3;
    // s=-1 左目：内側(右)が下がると怒り顔、上がると困り顔。痛いときは困り顔
    c.moveTo(x - s * r * 0.9, y - r * 1.5 + lift);
    c.quadraticCurveTo(x, y - r * 1.85 + lift - tilt * 0.3, x + s * r * 0.9, y - r * 1.6 + lift - tilt);
    c.stroke();

    c.lineWidth = r * 0.16;
    if (S.pain > 0.15) {
      // > <
      c.strokeStyle = DARK;
      c.beginPath();
      c.moveTo(x - s * r * 0.7, y - r * 0.6); c.lineTo(x + s * r * 0.5, y); c.lineTo(x - s * r * 0.7, y + r * 0.6);
      c.stroke();
    } else if (S.happy > 0.15) {
      // ^ ^
      c.strokeStyle = DARK;
      c.beginPath(); c.arc(x, y + r * 0.25, r * 0.7, Math.PI * 1.1, Math.PI * 1.9); c.stroke();
    } else {
      // ふつうの目（白目＋黒目、指の方を見る）
      const open = (1 - S.tension * 0.6) * (S.blink > 0 ? 0.1 : 1);
      c.save();
      c.beginPath(); c.ellipse(x, y, r * 0.8, r * open, 0, 0, 7);
      c.fillStyle = '#fff'; c.fill();
      c.clip();
      const lx = clamp((S.look.x - x) / (W * 0.4), -1, 1), ly = clamp((S.look.y - y) / (H * 0.5), -1, 1);
      c.fillStyle = DARK;
      c.beginPath(); c.arc(x + lx * r * 0.35, y + ly * r * 0.4, r * 0.48, 0, 7); c.fill();
      c.fillStyle = '#fff';
      c.beginPath(); c.arc(x + lx * r * 0.35 + r * 0.16, y + ly * r * 0.4 - r * 0.18, r * 0.14, 0, 7); c.fill();
      c.restore();
      c.strokeStyle = DARK;
      c.beginPath(); c.ellipse(x, y, r * 0.8, r * open, 0, 0, 7); c.stroke();
      if (S.tension > 0.3) {   // ぷるぷる汗
        c.fillStyle = 'rgba(120,200,255,0.8)';
        const sx = x + s * r * 1.3, sy = y - r * 1.2 + Math.sin(S.time * 20) * r * 0.05;
        c.beginPath(); c.moveTo(sx, sy - r * 0.35);
        c.quadraticCurveTo(sx + r * 0.25, sy, sx, sy + r * 0.12);
        c.quadraticCurveTo(sx - r * 0.25, sy, sx, sy - r * 0.35); c.fill();
      }
    }
  }
  // 口
  const mx = W / 2, my = L.y + nh + (H - L.y - nh) * 0.42;
  const mw = nw * 0.16;
  c.strokeStyle = DARK; c.lineWidth = r * 0.16;
  if (S.pain > 0.15) {
    const o = mw * (0.5 + 0.4 * S.pain) * (1 + Math.sin(S.time * 40) * 0.08 * S.pain);
    c.fillStyle = '#7a1f1f';
    c.beginPath(); c.ellipse(mx, my, mw * 0.8, o, 0, 0, 7); c.fill(); c.stroke();
    c.fillStyle = '#ff7a8a';
    c.beginPath(); c.ellipse(mx, my + o * 0.55, mw * 0.45, o * 0.32, 0, 0, 7); c.fill();
  } else if (S.tension > 0.25) {
    c.beginPath();
    for (let i = 0; i <= 12; i++) {
      const px = mx - mw + (mw * 2) * i / 12, py = my + Math.sin(i * 1.6 + S.time * 25) * r * 0.12;
      i ? c.lineTo(px, py) : c.moveTo(px, py);
    }
    c.stroke();
  } else if (S.happy > 0.15) {
    c.fillStyle = '#7a1f1f';
    c.beginPath(); c.moveTo(mx - mw, my - mw * 0.1);
    c.quadraticCurveTo(mx, my + mw * 1.2, mx + mw, my - mw * 0.1); c.closePath(); c.fill(); c.stroke();
  } else {
    c.beginPath(); c.moveTo(mx - mw * 0.8, my);
    c.quadraticCurveTo(mx, my + mw * 0.55, mx + mw * 0.8, my); c.stroke();
  }
}

function drawPainMarks(c) {
  if (S.pain < 0.2 || !S.painBig) return;
  // 鼻のまわりの「ズキズキ」線
  const nw = NW * L.k, nh = NH * L.k;
  c.strokeStyle = `rgba(232,51,58,${S.pain})`; c.lineWidth = U * 0.8; c.lineCap = 'round';
  for (const s of [-1, 1]) {
    const cx = W / 2 + s * nw * 0.56, cy = L.y + nh * 0.86;
    for (let i = -1; i <= 1; i++) {
      const a = (s < 0 ? Math.PI : 0) + i * 0.45;
      const r0 = nw * 0.05, r1 = nw * (0.1 + S.pain * 0.04);
      c.beginPath();
      c.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
      c.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1); c.stroke();
    }
  }
}

// ---------- 入力（マウス／マルチタッチ） ----------
const pointers = new Map();   // pointerId -> {x,y,vx,vy,t,hair,offset,speed}

function nearestHair(x, y) {
  let best = null, bd = CFG.grabRadius * U;
  for (const h of hairs) {
    if (h.grabbed) continue;
    const d = h.dist(x, y);
    if (d < bd) { bd = d; best = h; }
  }
  return best;
}

cv.addEventListener('pointerdown', e => {
  Snd.init();
  cv.setPointerCapture(e.pointerId);
  S.lastInput = performance.now() / 1000;
  const p = { x: e.clientX, y: e.clientY, vx: 0, vy: 0, t: e.timeStamp, hair: null, offset: 0, speed: 0, lastTick: 0 };
  pointers.set(e.pointerId, p);
  const h = nearestHair(p.x, p.y);
  if (h) {
    const [ex, ey] = h.exitS();
    const g = clamp((p.x - ex) * Math.cos(h.angle) + (p.y - ey) * Math.sin(h.angle), 0, h.out * L.k);
    p.offset = h.out * L.k - g;    // 指から先端までの長さ（画面px）
    p.hair = h; h.grabbed = p;
    cv.classList.add('grabbing');
  }
});

cv.addEventListener('pointermove', e => {
  const p = pointers.get(e.pointerId);
  S.look.x = e.clientX; S.look.y = e.clientY;
  if (!p) return;
  S.lastInput = performance.now() / 1000;
  const dt = Math.max(1, e.timeStamp - p.t) / 1000;
  const nx = e.clientX, ny = e.clientY;
  const a = Math.min(1, dt / 0.06);
  p.vx += ((nx - p.x) / dt - p.vx) * a;
  p.vy += ((ny - p.y) / dt - p.vy) * a;
  p.x = nx; p.y = ny; p.t = e.timeStamp;
  const h = p.hair;
  if (!h) {
    // 何もつかんでいない指がなぞったら、つかむ
    const n = nearestHair(nx, ny);
    if (n && n.dist(nx, ny) < CFG.grabRadius * U * 0.6) {
      const [ex, ey] = n.exitS();
      const g = clamp((nx - ex) * Math.cos(n.angle) + (ny - ey) * Math.sin(n.angle), 0, n.out * L.k);
      p.offset = n.out * L.k - g; p.hair = n; n.grabbed = p; p.speed = 0;
    }
    return;
  }
  const [ex, ey] = h.exitS();
  const ang = clamp(Math.atan2(ny - ey, nx - ex), Math.PI / 2 - 1.35, Math.PI / 2 + 1.35);
  const d = Math.hypot(nx - ex, ny - ey);
  const prev = h.out;
  h.angle = ang;
  h.out = clamp((d + p.offset) / L.k, h.len * 0.05, h.len);
  h.target = Math.max(h.restOut, Math.min(h.out, h.len * 0.4));
  // 抜けるはやさ（U/秒）
  const v = (h.out - prev) * L.k / U / dt;
  p.speed += (v - p.speed) * Math.min(1, dt / 0.08);
  // ひっぱっている音
  const frac = h.out / h.len;
  if (Math.abs(frac - p.lastTick) > 0.06) { p.lastTick = frac; Snd.tick(frac); }
  if (h.out >= h.len * 0.985) {
    pulledOut(h, Math.max(p.speed, v * 0.7), p);
    p.hair = null;
  }
});

function release(e) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  if (p.hair) p.hair.grabbed = null;
  pointers.delete(e.pointerId);
  if (![...pointers.values()].some(q => q.hair)) cv.classList.remove('grabbing');
}
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', release);
cv.addEventListener('contextmenu', e => e.preventDefault());

// ---------- ボタン ----------
function goHome() {
  if (window.parent !== window) window.parent.postMessage({ type: 'minigame-exit', game: GAME_ID }, '*');
  else history.back();
}
function toggleFull() {
  const de = document.documentElement;
  if (!(document.fullscreenElement || document.webkitFullscreenElement)) {
    if (de.requestFullscreen) de.requestFullscreen().catch(() => {});
    else if (de.webkitRequestFullscreen) de.webkitRequestFullscreen();   // iPad の Safari
  } else if (document.exitFullscreen) document.exitFullscreen();
  else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
}
function toggleSound() {
  Snd.on = !Snd.on; Snd.init();
  document.getElementById('bSound').textContent = Snd.on ? '🔊' : '🔇';
  try { localStorage.setItem(GAME_ID + ':sound', Snd.on ? '1' : '0'); } catch (e) {}
}
try { if (localStorage.getItem(GAME_ID + ':sound') === '0') { Snd.on = false; document.getElementById('bSound').textContent = '🔇'; } } catch (e) {}
document.getElementById('bHome').onclick = goHome;
document.getElementById('bFull').onclick = toggleFull;
document.getElementById('bSound').onclick = toggleSound;
addEventListener('keydown', e => {
  Snd.init();
  if (e.key === 'f' || e.key === 'F') toggleFull();
  else if (e.key === 'm' || e.key === 'M') toggleSound();
  else if (e.key === 'Escape') goHome();
});

// ---------- 文字 ----------
const FONT = '"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","BIZ UDPGothic","Meiryo",system-ui,sans-serif';
function outlined(c, text, x, y, size, fill) {
  c.font = `900 ${size}px ${FONT}`;
  c.textAlign = 'center'; c.textBaseline = 'middle';
  c.lineJoin = 'round'; c.lineWidth = size * 0.22; c.strokeStyle = '#fff';
  c.strokeText(text, x, y);
  c.fillStyle = fill; c.fillText(text, x, y);
}

// ---------- メインループ ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  S.time += dt;
  const idle = now / 1000 - S.lastInput;

  // 表情
  S.pain = Math.max(0, S.pain - dt * 0.8);
  if (S.pain <= 0) S.painBig = false;
  S.happy = Math.max(0, S.happy - dt * 1.1);
  let ten = 0;
  for (const h of hairs) if (h.grabbed) ten = Math.max(ten, clamp((h.out / h.len - 0.35) / 0.6, 0, 1));
  S.tension += (ten - S.tension) * Math.min(1, dt * 8);
  S.nextBlink -= dt;
  if (S.nextBlink <= 0) { S.blink = 0.12; S.nextBlink = rand(2, 5); }
  S.blink = Math.max(0, S.blink - dt);
  if (!pointers.size && idle > 3) {   // だれもいないときは、きょろきょろ
    S.look.x = W / 2 + Math.sin(S.time * 0.7) * W * 0.3;
    S.look.y = H * 0.5 + Math.sin(S.time * 0.4) * H * 0.2;
  }
  // 放置リセット
  if (idle > CFG.idleReset && (S.count || S.painCount)) {
    S.count = 0; S.painCount = 0; makeHairs();
  }

  for (const h of hairs) h.update(dt);

  // ---- 描画 ----
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = SKIN; ctx.fillRect(0, 0, W, H);

  ctx.save();
  const shake = S.pain * (S.painBig ? 1.4 : 0.7) * U + S.tension * 0.35 * U;
  if (shake > 0.01) ctx.translate(rand(-shake, shake), rand(-shake, shake));
  drawFace(ctx);
  if (noseImg.complete) {
    ctx.drawImage(noseImg, L.x, L.y, NW * L.k, NH * L.k);
    if (redNose && S.pain > 0.01) {
      ctx.globalAlpha = Math.min(1, S.pain * 1.3);
      ctx.drawImage(redNose, L.x, L.y, NW * L.k, NH * L.k);
      ctx.globalAlpha = 1;
    }
  }
  for (const h of hairs) h.draw(ctx);
  drawPainMarks(ctx);
  ctx.restore();

  // ヒント（だれもさわっていないとき）
  if (idle > CFG.idleHint && !pointers.size) {
    const h = hairs[Math.floor(S.time / 3) % hairs.length];
    if (h && h.wait <= 0) {
      const [tx, ty] = h.tipS();
      const pulse = (S.time * 1.5) % 1;
      ctx.strokeStyle = `rgba(255,255,255,${1 - pulse})`; ctx.lineWidth = U * 0.8;
      ctx.beginPath(); ctx.arc(tx, ty, U * (3 + pulse * 6), 0, 7); ctx.stroke();
      // ゆび
      const fy = ty + U * 4 + Math.abs(Math.sin(S.time * 3)) * U * 4;
      ctx.font = `${U * 8}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
      ctx.fillText('👆', tx, fy);
    }
    const msg = Math.floor(S.time / 6) % 2 ? 'ゆっくり ぬくと…？' : 'はなげを つまんで ひっぱってね！';
    outlined(ctx, msg, W / 2, H - U * 4.5, U * 5, '#8a5a1c');
  }

  // 飛んでいく鼻毛
  for (let i = flying.length - 1; i >= 0; i--) {
    const f = flying[i];
    f.vy += 160 * U * dt;  f.vx *= 1 - dt * 0.8;
    f.x += f.vx * dt; f.y += f.vy * dt; f.ang += f.spin * dt; f.life -= dt;
    if (f.life <= 0 || f.y > H + 60 * U) { flying.splice(i, 1); continue; }
    const t = f.type, k = L.k * f.scale;
    ctx.save();
    ctx.globalAlpha = Math.min(1, f.life);
    ctx.translate(f.x, f.y);
    ctx.rotate(f.ang - Math.PI / 2);
    ctx.translate(0, -t.len * k);           // 先端が(0,0)になるように
    if (f.flip < 0) ctx.scale(-1, 1);
    ctx.rotate(Math.PI / 2 - t.ang);
    ctx.scale(k, k);
    ctx.drawImage(t.img, -t.root[0], -t.root[1]);
    ctx.restore();
  }

  // なみだ
  for (let i = tears.length - 1; i >= 0; i--) {
    const t = tears[i];
    t.vy += 160 * U * dt; t.x += t.vx * dt; t.y += t.vy * dt; t.life -= dt;
    if (t.life <= 0) { tears.splice(i, 1); continue; }
    ctx.fillStyle = `rgba(110,190,255,${Math.min(1, t.life)})`;
    const r = U * 1.3;
    ctx.beginPath(); ctx.moveTo(t.x, t.y - r * 1.6);
    ctx.quadraticCurveTo(t.x + r * 1.2, t.y, t.x, t.y + r);
    ctx.quadraticCurveTo(t.x - r * 1.2, t.y, t.x, t.y - r * 1.6); ctx.fill();
  }

  // 粒
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i];
    p.vy += 90 * U * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, p.life / p.max * 1.5);
    ctx.fillStyle = p.c;
    ctx.beginPath();
    if (p.star) {
      for (let j = 0; j < 10; j++) {
        const a = j * Math.PI / 5 - Math.PI / 2, rr = j % 2 ? p.r * 0.45 : p.r * 1.3;
        ctx.lineTo(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr);
      }
    } else ctx.arc(p.x, p.y, p.r, 0, 7);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // 文字
  for (let i = texts.length - 1; i >= 0; i--) {
    const t = texts[i];
    t.life -= dt;
    if (t.life <= 0) { texts.splice(i, 1); continue; }
    const age = t.max - t.life;
    const sc = age < 0.15 ? 0.5 + age / 0.15 * 0.7 : age < 0.25 ? 1.2 - (age - 0.15) / 0.1 * 0.2 : 1;
    ctx.globalAlpha = Math.min(1, t.life * 2.5);
    const jx = t.shake ? rand(-1, 1) * U * 0.8 : 0;
    outlined(ctx, t.text, t.x + jx, t.y - age * U * 6, t.size * U * sc, t.color);
  }
  ctx.globalAlpha = 1;

  // カウンター
  ctx.textAlign = 'left';
  const cs = U * 4.2;
  ctx.font = `900 ${cs}px ${FONT}`;
  ctx.textBaseline = 'top';
  ctx.lineJoin = 'round'; ctx.lineWidth = cs * 0.25; ctx.strokeStyle = '#fff';
  const l1 = `ぬいた はなげ  ${S.count}本`, l2 = `いたがった  ${S.painCount}回`;
  ctx.strokeText(l1, U * 2.5, U * 2.5); ctx.fillStyle = '#8a5a1c'; ctx.fillText(l1, U * 2.5, U * 2.5);
  ctx.font = `900 ${cs * 0.75}px ${FONT}`; ctx.lineWidth = cs * 0.2;
  ctx.strokeText(l2, U * 2.5, U * 2.5 + cs * 1.3); ctx.fillStyle = '#d0454b'; ctx.fillText(l2, U * 2.5, U * 2.5 + cs * 1.3);

  requestAnimationFrame(frame);
}

resize();
makeHairs();
requestAnimationFrame(frame);
</script>
<script>
/* ---- iPhone / iPad（Safari）むけの調整 ---- */
(function () {
  const d = document;
  // 1) 見えている大きさが変わったら描き直す（アドレスバーが出たり消えたりしたとき・画面を回したとき）
  const re = () => { try { resize(); } catch (e) {} };
  if (window.visualViewport) visualViewport.addEventListener('resize', re);
  addEventListener('orientationchange', () => { setTimeout(re, 250); setTimeout(re, 700); });
  addEventListener('pageshow', re);
  // 2) 指2本での拡大・ダブルタップでの拡大・画面のひっぱりスクロールを止める
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => d.addEventListener(t, e => e.preventDefault(), { passive: false }));
  d.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  let lastEnd = 0;
  d.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastEnd < 350 && !e.target.closest('button')) e.preventDefault();
    lastEnd = now;
  }, { passive: false });
  // 3) 全画面にできないブラウザ（iPhone の Safari）では、全画面ボタンをかくす
  const fsOK = d.fullscreenEnabled || d.webkitFullscreenEnabled;
  const fb = d.getElementById('bFull');
  if (fb && !fsOK) fb.style.display = 'none';
  // 4) 音：さわったときに必ず音を出せる状態にする（iPhone は最初にさわるまで音が出ない）
  const unlock = () => {
    try {
      Snd.init();
      const ac = Snd.ac;
      if (!ac) return;
      if (ac.state !== 'running') ac.resume();
      if (!Snd._unlocked) {
        const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource();
        s.buffer = b; s.connect(ac.destination); s.start(0);
        Snd._unlocked = true;
      }
    } catch (e) {}
  };
  ['touchstart', 'touchend', 'pointerdown', 'click', 'keydown'].forEach(t => d.addEventListener(t, unlock, { capture: true, passive: true }));
  // ほかのアプリから もどってきたとき、音を止まったままにしない
  d.addEventListener('visibilitychange', () => { if (!d.hidden) { Snd._unlocked = false; } });
})();
</script>
