<script>
'use strict';
/* ============================================================
   とげからまもれ ― キャラクターのまわりに線をかいて、とんでくるとげから守るゲーム
   ・ゆびでなぞる（マウスでドラッグ）と、線のかべができる。かける長さはインクのぶんだけ（すこしずつもどる）
   ・とげが線にあたると、こわれる。線はしばらくすると消える
   ・とげがキャラクターにあたったらおしまい。生きた時間が出る
   ・記録は保存しない。外部ファイル不要
   ============================================================ */
const GAME_ID = 'mamoru';

// ---------- 設定（U = 画面の短い辺の1%） ----------
const CFG = {
  charW: 30,          // キャラクターのはば
  lineLife: 3.5,      // 線が消えるまでの秒数
  ink: 200,           // インクがまんたんのとき かける線の長さ（U）
  inkRegen: 0.35,     // かいていないとき、1秒でもどるインクの量（0〜1）
  inkDelay: 0.4,      // かき終わってから、インクがもどりはじめるまでの秒数
  lineW: 1.8,         // 線の太さ
  hitCost: 0.7,       // とげが当たると、その線の残り時間がこれだけへる（秒）
  spawnStart: 1.5,    // はじめ：とげが出てくる間かく（秒）
  spawnEnd: 0.38,     // いちばん多いとき
  speedStart: 16,     // はじめ：とげのはやさ
  speedEnd: 38,
  rampTime: 70,       // 何秒で いちばんむずかしくなるか
  resultIdle: 15,
};

// ---------- キャンバス ----------
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, U = 1, DPR = 1;
let stars = [];
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; U = Math.min(W, H) / 100;
  cv.width = W * DPR; cv.height = H * DPR;
  stars = [];
  for (let i = 0; i < 90; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 0.25 + 0.1, ph: Math.random() * 6 });
}
addEventListener('resize', resize);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- キャラクター ----------
const charImg = new Image(); charImg.src = 'data:image/png;base64,' + ASSETS.img;
const [CW, CH] = ASSETS.size;
function charGeom() {
  const s = CFG.charW * U / CW;
  return { s, x: W / 2, y: H / 2 + Math.sin(G.t * 2) * U * 0.6, rx: ASSETS.rx * s, ry: ASSETS.ry * s };
}
// 点がキャラクターの体（だ円）＋ r の中にあるか
function hitChar(px, py, r) {
  const c = charGeom();
  const dx = (px - c.x) / (c.rx + r), dy = (py - c.y) / (c.ry + r);
  return dx * dx + dy * dy < 1;
}

// ---------- 音 ----------
const Snd = {
  ac: null, on: true, noise: null,
  init() {
    if (this.ac) { if (this.ac.state !== 'running') this.ac.resume(); return; }
    try {
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
      const len = this.ac.sampleRate * 0.5, b = this.ac.createBuffer(1, len, this.ac.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = b;
    } catch (e) {}
  },
  tone(type, f0, f1, dur, vol, delay = 0) {
    if (!this.on || !this.ac) return;
    const t = this.ac.currentTime + delay, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ac.destination); o.start(t); o.stop(t + dur + 0.05);
  },
  noiseHit(freq, dur, vol) {
    if (!this.on || !this.ac) return;
    const t = this.ac.currentTime, s = this.ac.createBufferSource(); s.buffer = this.noise;
    const f = this.ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = freq; f.Q.value = 1.2;
    const g = this.ac.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(this.ac.destination); s.start(t); s.stop(t + dur + 0.05);
  },
  block() { this.noiseHit(2600, 0.12, 0.25); this.tone('triangle', 900 + Math.random() * 300, 1400, 0.08, 0.08); },
  draw() { this.tone('sine', 700, 760, 0.03, 0.02); },
  hit() { this.noiseHit(500, 0.4, 0.4); this.tone('sawtooth', 400, 60, 0.6, 0.18); },
  start() { [523, 784].forEach((f, i) => this.tone('triangle', f, f, 0.15, 0.12, i * 0.08)); },
  result() { [784, 659, 523].forEach((f, i) => this.tone('triangle', f, f, 0.2, 0.12, i * 0.12)); },
  empty() { this.tone('square', 220, 180, 0.12, 0.06); },
};

// ---------- 状態 ----------
// ready（はじまる前） → play → dead → result
const G = { mode: 'ready', t: 0, modeT: 0, time: 0, spawnT: 1, lastInput: 0, shake: 0, flash: 0 };
let lines = [];     // {pts:[[x,y]...], life, len}
let spikes = [];    // {x,y,vx,vy,r,rot,spin,kind}
const parts = [];
const active = new Map();   // pointerId -> line

function setMode(m) { G.mode = m; G.modeT = 0; }
function reset() {
  lines = []; spikes = []; parts.length = 0; active.clear(); G.ink = 1; G.inkT = 0;
  G.time = 0; G.spawnT = 1.2; setMode('ready');
}
function startGame() { setMode('play'); G.time = 0; G.spawnT = 1.0; Snd.start(); }

// ---------- とげ ----------
function difficulty() { return clamp(G.time / CFG.rampTime, 0, 1); }
function queueSpike() {
  const d = difficulty();
  // 画面のはしのどこかから、キャラクターをねらう
  const ang = rand(0, Math.PI * 2);
  const R = Math.hypot(W, H) / 2 + 4 * U;
  const c = charGeom();
  let x = c.x + Math.cos(ang) * R, y = c.y + Math.sin(ang) * R;
  const kind = G.time > 25 && Math.random() < 0.25 + d * 0.2 ? 'fast' : (G.time > 45 && Math.random() < 0.2 ? 'big' : 'normal');
  launchSpike({ x, y, kind });
}
function launchSpike(w) {
  const d = difficulty(), c = charGeom();
  let sp = (CFG.speedStart + (CFG.speedEnd - CFG.speedStart) * d) * U;
  let r = 2.6 * U;
  if (w.kind === 'fast') { sp *= 1.45; r = 2.1 * U; }
  if (w.kind === 'big') { sp *= 0.75; r = 4 * U; }
  // 少しだけねらいをずらす
  const ang = Math.atan2(c.y - w.y, c.x - w.x) + rand(-0.12, 0.12);
  spikes.push({ x: w.x, y: w.y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r, rot: rand(0, 6), spin: rand(-3, 3), kind: w.kind, hp: w.kind === 'big' ? 2 : 1 });
}
function drawSpike(s) {
  const n = s.kind === 'big' ? 12 : 9;
  const col = s.kind === 'fast' ? ['#ff4d6d', '#b3123a'] : s.kind === 'big' ? ['#b57bff', '#5b2aa8'] : ['#9b6bff', '#4b2591'];
  ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.rot);
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = i * Math.PI / n, rr = i % 2 ? s.r * 0.62 : s.r * 1.25;
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
  const g = ctx.createRadialGradient(-s.r * 0.3, -s.r * 0.3, 0, 0, 0, s.r * 1.25);
  g.addColorStop(0, col[0]); g.addColorStop(1, col[1]);
  ctx.fillStyle = g; ctx.fill();
  ctx.lineWidth = Math.max(1, s.r * 0.12); ctx.strokeStyle = '#1a0b33'; ctx.lineJoin = 'round'; ctx.stroke();
  // 目（ちょっとこわい顔）
  ctx.fillStyle = '#fff';
  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * s.r * 0.28, -s.r * 0.05, s.r * 0.16, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#1a0b33';
  for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(sx * s.r * 0.28, -s.r * 0.02, s.r * 0.08, 0, 7); ctx.fill(); }
  if (s.kind === 'big' && s.hp <= 1) { ctx.strokeStyle = '#fff'; ctx.lineWidth = s.r * 0.08; ctx.beginPath(); ctx.moveTo(-s.r * 0.4, s.r * 0.3); ctx.lineTo(s.r * 0.1, -s.r * 0.1); ctx.stroke(); }
  ctx.restore();
}
function burst(x, y, colors, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.28), s = rand(0.3, 1) * spd * U;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.35, 0.7), r: rand(0.4, 1) * U, c: colors[i % colors.length] });
  }
}

// ---------- 線 ----------
function segDist(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let t = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0; t = clamp(t, 0, 1);
  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}
function lineHit(s) {
  const lw = CFG.lineW * U / 2;
  for (const L of lines) {
    if (L.life <= 0) continue;
    const p = L.pts;
    for (let i = 1; i < p.length; i++) {
      if (segDist(s.x, s.y, p[i - 1][0], p[i - 1][1], p[i][0], p[i][1]) < s.r + lw) return L;
    }
  }
  return null;
}
// ---------- 入力 ----------
cv.addEventListener('pointerdown', e => {
  Snd.init();
  G.lastInput = G.t;
  if (G.mode === 'result') { if (G.modeT > 1) reset(); return; }
  if (G.mode === 'dead') return;
  if (G.mode === 'ready') startGame();
  cv.setPointerCapture(e.pointerId);
  const L = { pts: [[e.clientX, e.clientY]], life: CFG.lineLife, len: 0, born: G.t };
  lines.push(L); active.set(e.pointerId, L);
});
cv.addEventListener('pointermove', e => {
  const L = active.get(e.pointerId);
  if (!L) return;
  G.lastInput = G.t;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ev of (evs.length ? evs : [e])) {
    const x = ev.clientX, y = ev.clientY, l = L.pts[L.pts.length - 1];
    const d = Math.hypot(x - l[0], y - l[1]);
    if (d < U * 0.8) continue;
    // キャラクターの上には線をかけない（線がキャラクターにかからないように）
    if (hitChar(x, y, CFG.lineW * U)) continue;
    // インクがなければ、それ以上かけない
    if (G.ink <= 0) { if (!G.inkOut) { G.inkOut = 0.5; Snd.empty(); } break; }
    G.ink = Math.max(0, G.ink - d / (CFG.ink * U)); G.inkT = 0;
    L.pts.push([x, y]); L.len += d;
    L.life = CFG.lineLife;     // かいている間は消えない
    if (Math.random() < 0.15) Snd.draw();
  }
});
function endLine(e) { active.delete(e.pointerId); }
cv.addEventListener('pointerup', endLine);
cv.addEventListener('pointercancel', endLine);
cv.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('keydown', e => {
  Snd.init();
  if (e.key === 'f' || e.key === 'F') toggleFull();
  else if (e.key === 'm' || e.key === 'M') toggleSound();
  else if (e.key === 'Escape') goHome();
  else if ((e.key === ' ' || e.key === 'Enter') && G.mode === 'result' && G.modeT > 1) reset();
});

function goHome() {
  if (window.parent !== window) window.parent.postMessage({ type: 'minigame-exit', game: GAME_ID }, '*');
  else history.back();
}
function toggleFull() {
  const de = document.documentElement;
  if (!(document.fullscreenElement || document.webkitFullscreenElement)) {
    if (de.requestFullscreen) de.requestFullscreen().catch(() => {});
    else if (de.webkitRequestFullscreen) de.webkitRequestFullscreen();   // iPad の Safari
  } else if (document.exitFullscreen) document.exitFullscreen();
  else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
}
function toggleSound() { Snd.on = !Snd.on; Snd.init(); $('bSound').textContent = Snd.on ? '🔊' : '🔇'; }
$('bHome').onclick = goHome; $('bFull').onclick = toggleFull; $('bSound').onclick = toggleSound;
$('ui').addEventListener('pointerdown', e => e.stopPropagation());

// ---------- 文字 ----------
const FONT = '"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","BIZ UDPGothic","Meiryo",system-ui,sans-serif';
function outlined(text, x, y, size, fill, stroke = '#1d2b53', lw = 0.2) {
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * lw; ctx.strokeStyle = stroke;
  ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y);
}

// ---------- メインループ ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.04, (now - last) / 1000); last = now;
  G.t += dt; G.modeT += dt;
  G.shake = Math.max(0, G.shake - dt * 2.5); G.flash = Math.max(0, G.flash - dt * 3);

  // 線の寿命
  for (const L of lines) if (![...active.values()].includes(L)) L.life -= dt;
  lines = lines.filter(L => L.life > 0);

  if (G.mode === 'play') {
    G.time += dt;
    const d = difficulty();
    G.spawnT -= dt;
    if (G.spawnT <= 0) {
      queueSpike();
      // 後半はときどき2こ同時
      if (G.time > 35 && Math.random() < d * 0.35) queueSpike();
      G.spawnT = CFG.spawnStart + (CFG.spawnEnd - CFG.spawnStart) * d;
    }
  }
  // 「！」→ とげ
  // インク：かいていないときは少しずつもどる
  G.inkT += dt; G.inkOut = Math.max(0, (G.inkOut || 0) - dt);
  if (!active.size && G.inkT > CFG.inkDelay) G.ink = Math.min(1, G.ink + CFG.inkRegen * dt);
  // とげをうごかす（はやいときもすりぬけないように、こまかく分けて動かす）
  for (let i = spikes.length - 1; i >= 0; i--) {
    const s = spikes[i];
    const steps = Math.ceil(Math.hypot(s.vx, s.vy) * dt / (s.r * 0.5)) || 1;
    let gone = false;
    for (let k = 0; k < steps && !gone; k++) {
      s.x += s.vx * dt / steps; s.y += s.vy * dt / steps;
      const L = (s.inv || 0) > 0 ? null : lineHit(s);
      if (L) {
        L.life -= CFG.hitCost;
        s.hp--; s.inv = 0.35;
        burst(s.x, s.y, s.kind === 'fast' ? ['#ff4d6d', '#ffd1dc', '#fff'] : ['#b57bff', '#e7d6ff', '#fff'], 12, 30);
        Snd.block();
        if (s.hp <= 0) { spikes.splice(i, 1); gone = true; }
        else {
          // 大きいとげは はね返って、もう一度くる
          s.vx *= -0.6; s.vy *= -0.6; s.x += s.vx * 0.05; s.y += s.vy * 0.05;
          setTimeout(() => { const c = charGeom(), a = Math.atan2(c.y - s.y, c.x - s.x), sp = Math.hypot(s.vx, s.vy) / 0.6; s.vx = Math.cos(a) * sp; s.vy = Math.sin(a) * sp; }, 500);
        }
      } else if (G.mode === 'play' && hitChar(s.x, s.y, s.r * 0.7)) {
        // あたった！
        G.mode = 'dead'; G.modeT = 0; G.shake = 1; G.flash = 1; G.hitAt = [s.x, s.y];
        burst(s.x, s.y, ['#ff4d6d', '#ffe27a', '#fff'], 30, 45);
        Snd.hit();
        spikes.splice(i, 1); gone = true;
      }
    }
    if (!gone) { s.inv = Math.max(0, (s.inv || 0) - dt); s.rot += s.spin * dt; if (Math.abs(s.x - W / 2) > W + 20 * U || Math.abs(s.y - H / 2) > H + 20 * U) spikes.splice(i, 1); }
  }
  if (G.mode === 'dead') {
    // まわりのとげは消えていく
    for (const s of spikes) { s.vx *= 0.9; s.vy *= 0.9; }
    if (G.modeT > 1.2) { setMode('result'); G.lastInput = G.t; Snd.result(); spikes = []; }
  }
  if (G.mode === 'result' && G.t - G.lastInput > CFG.resultIdle) reset();

  // ---- 描画 ----
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const bg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.hypot(W, H) / 2);
  bg.addColorStop(0, '#3a4f96'); bg.addColorStop(1, '#16214a');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  for (const s of stars) {
    ctx.globalAlpha = 0.35 + 0.35 * Math.sin(G.t * 2 + s.ph);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.r * U, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (G.shake > 0) ctx.translate(rand(-1, 1) * G.shake * 1.5 * U, rand(-1, 1) * G.shake * 1.5 * U);

  // キャラクターのまわりの「まもるところ」の目じるし（うすい円）
  const c = charGeom();
  if (G.mode === 'ready' || G.mode === 'play') {
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = U * 0.5; ctx.setLineDash([U * 1.5, U * 1.5]);
    ctx.beginPath(); ctx.ellipse(c.x, c.y, c.rx + 9 * U, c.ry + 9 * U, 0, 0, 7); ctx.stroke(); ctx.setLineDash([]);
  }
  // キャラクター
  ctx.save();
  ctx.translate(c.x, c.y);
  if (G.mode === 'dead' || G.mode === 'result') {
    const k = Math.min(1, (G.mode === 'dead' ? G.modeT : 1.2) / 0.5);
    ctx.rotate(Math.sin(G.t * 30) * 0.08 * (G.mode === 'dead' ? Math.max(0, 1 - G.modeT) : 0));
    ctx.globalAlpha = 1 - 0.3 * k;
  }
  if (charImg.complete) ctx.drawImage(charImg, -ASSETS.center[0] * c.s, -ASSETS.center[1] * c.s, CW * c.s, CH * c.s);
  ctx.restore();
  ctx.globalAlpha = 1;
  // ぶつかったときの目（バツ）
  if ((G.mode === 'dead' || G.mode === 'result')) {
    const ex = c.rx * 0.33, ey = 0, r = c.ry * 0.22;
    ctx.strokeStyle = '#ff6b8a'; ctx.lineWidth = U * 0.9; ctx.lineCap = 'round';
    for (const sx of [-1, 1]) {
      const x = c.x + sx * ex, y = c.y + ey;
      ctx.beginPath(); ctx.moveTo(x - r, y - r); ctx.lineTo(x + r, y + r); ctx.moveTo(x + r, y - r); ctx.lineTo(x - r, y + r); ctx.stroke();
    }
  }

  // 線（光る線。消える前はうすくなる）
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const L of lines) {
    if (L.pts.length < 2) continue;
    const a = clamp(L.life / 1.0, 0, 1);
    const blink = L.life < 1 ? (0.6 + 0.4 * Math.sin(G.t * 25)) : 1;
    ctx.beginPath(); L.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.strokeStyle = `rgba(120,230,255,${0.3 * a})`; ctx.lineWidth = CFG.lineW * U * 2.6; ctx.stroke();
    ctx.strokeStyle = `rgba(255,255,255,${a * blink})`; ctx.lineWidth = CFG.lineW * U; ctx.stroke();
  }
  // とげ
  for (const s of spikes) drawSpike(s);
  // 「！」
  // 粒
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, p.life * 3); ctx.fillStyle = p.c;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (G.flash > 0) { ctx.fillStyle = `rgba(255,80,110,${G.flash * 0.45})`; ctx.fillRect(0, 0, W, H); }

  // ---- 文字（最小限） ----
  if (G.mode === 'play' || G.mode === 'dead') {
    outlined(`${G.time.toFixed(1)} びょう`, W / 2, 7 * U, 5 * U, '#fff', '#1d2b53', 0.22);
  }
  // インクのゲージ（のこりの線の長さ）
  if (G.mode === 'play' || G.mode === 'ready') {
    const bw = 34 * U, bh = 2.4 * U, bx = W / 2 - bw / 2 + 3 * U, by = 12 * U;
    const low = G.ink < 0.2, shakeX = G.inkOut > 0 ? Math.sin(G.t * 60) * U * 0.6 : 0;
    // ペンのマーク
    ctx.save(); ctx.translate(bx - 4 * U + shakeX, by + bh / 2); ctx.rotate(-0.7);
    ctx.fillStyle = '#fff'; ctx.fillRect(-0.6 * U, -2.4 * U, 1.2 * U, 3.6 * U);
    ctx.beginPath(); ctx.moveTo(-0.6 * U, 1.2 * U); ctx.lineTo(0.6 * U, 1.2 * U); ctx.lineTo(0, 2.6 * U); ctx.fill();
    ctx.restore();
    ctx.fillStyle = 'rgba(10,16,40,0.55)';
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx + shakeX, by, bw, bh, bh / 2) : ctx.rect(bx + shakeX, by, bw, bh); ctx.fill();
    if (G.ink > 0) {
      ctx.fillStyle = low ? (Math.sin(G.t * 20) > 0 ? '#ff4d6d' : '#ff99ad') : '#7fe3ff';
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx + shakeX, by, bw * G.ink, bh, bh / 2) : ctx.rect(bx + shakeX, by, bw * G.ink, bh); ctx.fill();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = U * 0.3;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(bx + shakeX, by, bw, bh, bh / 2) : ctx.rect(bx + shakeX, by, bw, bh); ctx.stroke();
  }
  if (G.mode === 'ready') {
    ctx.globalAlpha = 0.75 + 0.25 * Math.sin(G.t * 4);
    outlined('ゆびで せんを かいて まもろう！', W / 2, Math.min(H - 8 * U, c.y + c.ry + 22 * U), 5 * U, '#fff', '#1d2b53', 0.22);
    ctx.globalAlpha = 1;
  }
  if (G.mode === 'result') {
    const t = clamp(G.modeT / 0.35, 0, 1), sc = 0.6 + 0.4 * (1 - Math.pow(1 - t, 3));
    const pw = Math.min(W * 0.86, 72 * U) * sc, ph = 46 * U * sc, cx = W / 2, cy = H / 2;
    ctx.fillStyle = `rgba(10,16,40,${0.5 * t})`; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = t;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#7fd8ff'; ctx.lineWidth = U;
    ctx.beginPath(); ctx.roundRect ? ctx.roundRect(cx - pw / 2, cy - ph / 2, pw, ph, 4 * U) : ctx.rect(cx - pw / 2, cy - ph / 2, pw, ph);
    ctx.fill(); ctx.stroke();
    outlined('いきた じかん', cx, cy - 13 * U * sc, 5 * U * sc, '#2a3f7a', '#fff', 0.1);
    outlined(`${G.time.toFixed(1)} びょう`, cx, cy + 2 * U * sc, 10.5 * U * sc, '#ff7a3d', '#fff', 0.12);
    if (G.modeT > 1) outlined('タップで もういちど', cx, cy + 16 * U * sc, 4.2 * U * sc, '#2a3f7a', '#fff', 0.12);
    ctx.globalAlpha = 1;
  }
  requestAnimationFrame(frame);
}

resize();
reset();
requestAnimationFrame(frame);
</script>
<script>
/* ---- iPhone / iPad（Safari）むけの調整 ---- */
(function () {
  const d = document;
  const re = () => { try { resize(); } catch (e) {} };
  if (window.visualViewport) visualViewport.addEventListener('resize', re);
  addEventListener('orientationchange', () => { setTimeout(re, 250); setTimeout(re, 700); });
  addEventListener('pageshow', re);
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => d.addEventListener(t, e => e.preventDefault(), { passive: false }));
  d.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  let lastEnd = 0;
  d.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastEnd < 350 && !e.target.closest('button')) e.preventDefault();
    lastEnd = now;
  }, { passive: false });
  const fsOK = d.fullscreenEnabled || d.webkitFullscreenEnabled;
  const fb = d.getElementById('bFull');
  if (fb && !fsOK) fb.style.display = 'none';
  const unlock = () => {
    try {
      Snd.init();
      const ac = Snd.ac;
      if (!ac) return;
      if (ac.state !== 'running') ac.resume();
      if (!Snd._unlocked) {
        const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource();
        s.buffer = b; s.connect(ac.destination); s.start(0);
        Snd._unlocked = true;
      }
    } catch (e) {}
  };
  ['touchstart', 'touchend', 'pointerdown', 'click', 'keydown'].forEach(t => d.addEventListener(t, unlock, { capture: true, passive: true }));
  d.addEventListener('visibilitychange', () => { if (!d.hidden) { Snd._unlocked = false; } });
})();
</script>
</body>
</html>
