<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<!-- iPhone：ホーム画面に追加して開くと、アドレスバーなしで全画面のように表示される -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="なぞってぴったり">
<meta name="format-detection" content="telephone=no">
<title>なぞってぴったり</title>
<style>
  :root{--ink:#3b2a1a;--accent:#ff7a3d;--blue:#2f8fd8;--bg1:#fff6dc;--bg2:#ffe2b8}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","BIZ UDPGothic","Meiryo",system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(circle at 50% 30%,var(--bg1),var(--bg2))}
  canvas#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
  .screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
  .screen.on{display:flex}
  .screen *{pointer-events:auto}
  button{font:inherit;font-weight:900;border:0;cursor:pointer;color:#fff;border-radius:3vmin;
    padding:1.6vmin 3.4vmin;font-size:3.6vmin;box-shadow:0 .8vmin 0 rgba(0,0,0,.18);transition:transform .08s}
  button:active{transform:translateY(.5vmin);box-shadow:0 .3vmin 0 rgba(0,0,0,.18)}
  /* タイトル */
  #title h1{margin:0 0 1vmin;font-size:9vmin;letter-spacing:.3vmin;color:var(--accent);
    text-shadow:.5vmin .5vmin 0 #fff,-.5vmin .5vmin 0 #fff,.5vmin -.5vmin 0 #fff,-.5vmin -.5vmin 0 #fff,0 1.2vmin 0 rgba(0,0,0,.08)}
  #title p{margin:0 0 4vmin;font-size:3.6vmin;font-weight:900}
  #levels{display:flex;gap:2.4vmin;flex-wrap:wrap;justify-content:center;max-width:96vw}
  .lv{background:#fff;color:var(--ink);width:min(17vw,30vmin);padding:1.6vmin 1.2vmin 1.4vmin;display:flex;flex-direction:column;align-items:center;gap:.6vmin;border-radius:3vmin}
  .lv img{width:100%;aspect-ratio:1;object-fit:contain}
  @media (orientation:portrait){ .lv{width:28vw} #title h1{font-size:8vw} #title p{font-size:3.6vw;padding:0 4vw;text-align:center} }
  .lv .n{font-size:2.6vmin;color:#fff;border-radius:2vmin;padding:.3vmin 1.6vmin}
  /* プレイ中 */
  #hud{position:fixed;display:none;pointer-events:none}
  #hud.on{display:block}
  #hudName{font-size:4.2vmin;font-weight:900;background:#fff;border-radius:3vmin;padding:1.2vmin 1.6vmin;text-align:center;line-height:1.25}
  #side{position:fixed;display:none;flex-direction:column;gap:2.4vmin;align-items:stretch}
  #side.on{display:flex}
  #bDone{background:#3cc46b;font-size:4.6vmin;padding:2.4vmin 3vmin}
  #bDone.ready{animation:pulse 1s infinite}
  @keyframes pulse{50%{transform:scale(1.08)}}
  #bClear{background:#f0a23a}
  #bBack{background:#9b8f84;font-size:3vmin}
  #meter{background:#fff;border-radius:3vmin;padding:1.4vmin 2vmin;font-size:2.6vmin;font-weight:900;text-align:center}
  #meter .bar{height:2vmin;background:#f1e7d8;border-radius:1vmin;margin-top:1vmin;overflow:hidden}
  #meter .fill{height:100%;width:0;background:linear-gradient(90deg,#ffb23d,#ff7a3d);border-radius:1vmin;transition:width .15s}
  /* 結果 */
  #resBox{position:fixed;display:flex;flex-direction:column;gap:2.4vmin}
  /* たて長の画面では、ボタンを絵の下に横にならべる */
  body.portrait #side, body.portrait #resBox{flex-direction:row;flex-wrap:wrap}
  body.portrait #side > *, body.portrait #resBox > *{flex:1 1 30%}
  body.portrait #meter{flex-basis:100%}
  body.portrait #side #bDone{flex-basis:100%}
  #resBox button,#side button{white-space:nowrap;font-size:3.2vmin;padding:1.8vmin 1.6vmin}
  #side #bDone{font-size:4.4vmin;padding:2.4vmin 1.6vmin}
  #bAgain{background:var(--accent)}
  #bNext{background:var(--blue)}
  #bSel{background:#9b8f84}
  /* すみのボタン */
  #ui{position:fixed;top:1.2vmin;right:1.2vmin;display:flex;gap:1vmin;opacity:.3;transition:opacity .2s;z-index:5}
  #ui:hover{opacity:1}
  #ui button{font-size:2vmin;padding:.9vmin 1.4vmin;border-radius:1.2vmin;background:#fff;color:#8a5a1c;box-shadow:none}

  /* iPhone / iPad（Safari）むけ：画面をひっぱってもずれない・タップしたときの灰色のわくを出さない */
  html,body{position:fixed;inset:0;width:100%;height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  *{-webkit-tap-highlight-color:transparent}
  button{touch-action:manipulation}
  canvas#c{width:100% !important;height:100% !important}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title" class="screen on">
  <h1>なぞって ぴったり！</h1>
  <p>えの せんを ゆびで なぞって、どれだけ ぴったりか チャレンジ！</p>
  <div id="levels"></div>
</div>

<div id="hud"><div id="hudName"></div><div></div></div>
<div id="side">
  <div id="meter">なぞった ところ<div class="bar"><div class="fill" id="fill"></div></div></div>
  <button id="bDone">できた！</button>
  <button id="bClear">けす</button>
  <button id="bBack">やめる</button>
</div>

<div id="result" class="screen">
  <div id="resBox">
    <button id="bAgain">もういちど</button>
    <button id="bNext">つぎの レベル</button>
    <button id="bSel">レベルを えらぶ</button>
  </div>
</div>

<div id="ui">
  <button id="bSound" title="音 (M)">🔊</button>
  <button id="bFull" title="全画面 (F)">⛶</button>
  <button id="bHome" title="メニューへ (Esc)">メニュー</button>
</div>

    card.x = (W - card.s) / 2; card.y = top;
    const hud = $('hud');
    hud.style.width = Math.min(W * 0.48, 50 * U) + 'px';
    hud.style.left = (W - Math.min(W * 0.48, 50 * U)) / 2 + 'px';
    hud.style.top = 2.5 * U + 'px';
    for (const id of ['side', 'resBox']) {
      const el = $(id);
      el.style.left = card.x + 'px';
      el.style.top = (card.y + card.s + m) + 'px';
      el.style.width = card.s + 'px';
    }
    return;
  }
  // 絵の紙をできるだけ大きく。右にボタンの列をならべ、全体をまん中に
  const sideW = 30 * U, gap = 3 * U;
  card.s = Math.min(H * 0.92, W - sideW - gap - 6 * U);
  card.x = (W - (card.s + gap + sideW)) / 2;
  card.y = (H - card.s) / 2;
  const hud = $('hud');
  hud.style.left = (card.x + card.s + gap) + 'px';
  hud.style.top = (card.y + 2 * U) + 'px';
  hud.style.width = sideW + 'px';
  for (const id of ['side', 'resBox']) {
    const el = $(id);
    el.style.left = (card.x + card.s + gap) + 'px';
    el.style.top = (card.y + 18 * U) + 'px';
    el.style.width = sideW + 'px';
  }
}
addEventListener('resize', resize);

// ---------- 絵の準備（1000×1000 の黒い線画にする） ----------
const TS = 1000;
function renderLevel(lv) {
  return new Promise(res => {
    const c = document.createElement('canvas'); c.width = c.height = TS;
    const x = c.getContext('2d');
    if (lv.image) {
      const img = new Image();
      img.onload = () => {
        const m = 90, sc = Math.min((TS - m * 2) / img.width, (TS - m * 2) / img.height);
        const w = img.width * sc, h = img.height * sc;
        x.drawImage(img, (TS - w) / 2, (TS - h) / 2, w, h);
        res(c);
      };
      img.src = 'data:image/png;base64,' + lv.image;
    } else {
      x.strokeStyle = '#2b2b2b'; x.lineWidth = 9; x.lineCap = 'round'; x.lineJoin = 'round';
      for (const p of lv.paths) x.stroke(new Path2D(p));
      res(c);
    }
  });
}

// 線画 → 採点用のマス（線のあるマス、線までのきょり）
function analyze(lvCanvas) {
  const G = CFG.grid;
  const c = document.createElement('canvas'); c.width = c.height = G;
  const x = c.getContext('2d');
  x.drawImage(lvCanvas, 0, 0, G, G);
  const d = x.getImageData(0, 0, G, G).data;
  const on = new Uint8Array(G * G);
  const cells = [];
  for (let i = 0; i < G * G; i++) {
    const a = d[i * 4 + 3], lum = (d[i * 4] + d[i * 4 + 1] + d[i * 4 + 2]) / 3;
    if (a > 60 && lum < 160) { on[i] = 1; cells.push(i); }
  }
  // きょり変換（チャンファー法 3-4）
  const INF = 1e9, dist = new Float32Array(G * G);
  for (let i = 0; i < G * G; i++) dist[i] = on[i] ? 0 : INF;
  const at = (xx, yy) => dist[yy * G + xx];
  for (let yy = 0; yy < G; yy++) for (let xx = 0; xx < G; xx++) {
    let v = dist[yy * G + xx];
    if (xx > 0) v = Math.min(v, at(xx - 1, yy) + 3);
    if (yy > 0) {
      v = Math.min(v, at(xx, yy - 1) + 3);
      if (xx > 0) v = Math.min(v, at(xx - 1, yy - 1) + 4);
      if (xx < G - 1) v = Math.min(v, at(xx + 1, yy - 1) + 4);
    }
    dist[yy * G + xx] = v;
  }
  for (let yy = G - 1; yy >= 0; yy--) for (let xx = G - 1; xx >= 0; xx--) {
    let v = dist[yy * G + xx];
    if (xx < G - 1) v = Math.min(v, at(xx + 1, yy) + 3);
    if (yy < G - 1) {
      v = Math.min(v, at(xx, yy + 1) + 3);
      if (xx < G - 1) v = Math.min(v, at(xx + 1, yy + 1) + 4);
      if (xx > 0) v = Math.min(v, at(xx - 1, yy + 1) + 4);
    }
    dist[yy * G + xx] = v;
  }
  for (let i = 0; i < G * G; i++) dist[i] /= 3;   // マス単位
  // うすい線（見本）用の画像
  const ghost = document.createElement('canvas'); ghost.width = ghost.height = TS;
  const g = ghost.getContext('2d');
  g.globalAlpha = 0.28; g.drawImage(lvCanvas, 0, 0);
  return { on, cells, dist, ghost };
}

// ---------- 音 ----------
const Snd = {
  ac: null, on: true,
  init() {
    if (this.ac) { if (this.ac.state !== 'running') this.ac.resume(); return; }
    try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  },
  tone(type, f, dur, vol, delay = 0, f2) {
    if (!this.on || !this.ac) return;
    const t = this.ac.currentTime + delay, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ac.destination); o.start(t); o.stop(t + dur + 0.05);
  },
  click() { this.tone('sine', 660, 0.08, 0.15, 0, 880); },
  tick(p) { this.tone('triangle', 700 + p * 600, 0.04, 0.03); },
  count() { this.tone('square', 1200, 0.03, 0.03); },
  star(i) { this.tone('triangle', [784, 988, 1175][i], 0.25, 0.2); this.tone('sine', [1568, 1976, 2349][i], 0.2, 0.06, 0.02); },
  fanfare(good) {
    const n = good ? [523, 659, 784, 1047] : [392, 440, 523];
    n.forEach((f, i) => this.tone('triangle', f, 0.3, 0.18, i * 0.12));
  },
};

// ---------- 状態 ----------
const S = {
  mode: 'title', lv: 0, data: null, lvCanvas: [], analyzed: [],
  strokes: [],                 // [{pts:[[u,v],...]}]  u,v は 0〜1（絵の中の位置）
  covered: null, coverCount: 0,
  lastInput: 0, time: 0,
  res: null, resT: 0,
};
const active = new Map();      // pointerId -> stroke


// ---------- 画面切りかえ ----------
function show(mode) {
  S.mode = mode;
  $('title').classList.toggle('on', mode === 'title');
  $('result').classList.toggle('on', mode === 'result');
  $('hud').classList.toggle('on', mode !== 'title');
  $('side').classList.toggle('on', mode === 'play');
  S.lastInput = S.time;
}
function buildTitle() {
  const box = $('levels'); box.innerHTML = '';
  LEVELS.forEach((lv, i) => {
    const b = document.createElement('button'); b.className = 'lv';
    b.innerHTML = `<span class="n" style="background:${lv.color}">レベル${i + 1}</span>
      <img src="${S.lvCanvas[i].toDataURL()}" alt="${lv.name}">`;
    b.onclick = () => { Snd.init(); Snd.click(); startLevel(i); };
    box.appendChild(b);
  });
}
function startLevel(i) {
  S.lv = i; S.data = S.analyzed[i];
  clearStrokes();
  $('hudName').innerHTML = `<span style="color:${LEVELS[i].color}">レベル${i + 1}</span><br>${LEVELS[i].name}`;
  show('play');
}
function clearStrokes() {
  S.strokes = []; active.clear();
  S.covered = new Uint8Array(CFG.grid * CFG.grid); S.coverCount = 0;
  updateMeter();
}
function coverage() { return S.data ? S.coverCount / S.data.cells.length : 0; }
function updateMeter() {
  const c = coverage();
  $('fill').style.width = Math.round(c * 100) + '%';
  $('bDone').classList.toggle('ready', c > 0.8);
}

// なぞった点のまわりの線を「なぞった」にする
function markCover(u, v) {
  const G = CFG.grid, r = CFG.tolCover * G, r2 = r * r;
  const cx = u * G, cy = v * G;
  const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(G - 1, Math.ceil(cx + r));
  const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(G - 1, Math.ceil(cy + r));
  let n = 0;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const i = y * G + x;
    if (S.data.on[i] && !S.covered[i] && (x - cx) ** 2 + (y - cy) ** 2 <= r2) { S.covered[i] = 1; n++; }
  }
  S.coverCount += n;
  return n;
}

// ---------- 採点 ----------
function score() {
  const G = CFG.grid, near = CFG.tolNear * G, far = CFG.tolFar * G;
  // はみ出し：なぞった点が線からどれだけ近いか（点を0.5マスごとにならべて調べる）
  let sum = 0, n = 0;
  for (const st of S.strokes) {
    const p = st.pts;
    for (let i = 0; i < p.length; i++) {
      const a = p[i], b = p[i + 1] || p[i];
      const len = Math.hypot((b[0] - a[0]) * G, (b[1] - a[1]) * G);
      const steps = Math.max(1, Math.ceil(len / 0.5));
      for (let k = 0; k < (i + 1 < p.length ? steps : 1); k++) {
        const u = a[0] + (b[0] - a[0]) * k / steps, v = a[1] + (b[1] - a[1]) * k / steps;
        const x = clamp(Math.round(u * G), 0, G - 1), y = clamp(Math.round(v * G), 0, G - 1);
        const d = S.data.dist[y * G + x];
        sum += d <= near ? 1 : d >= far ? 0 : 1 - (d - near) / (far - near);
        n++;
      }
    }
  }
  const precision = n ? sum / n : 0;
  const cover = coverage();
  // はみ出しは強めに、なぞり残しはそのまま点数にひびく（めちゃくちゃに ぬりつぶしても高くならない）
  return { precision, cover, score: Math.round(100 * precision * precision * cover) };
}
function finish() {
  if (S.mode !== 'play') return;
  active.clear();
  const r = score();
  S.res = r; S.resT = 0; S.lastCount = -1; S.fan = false;
  $('bNext').style.display = S.lv < LEVELS.length - 1 ? '' : 'none';
  show('result');
  Snd.click();
}

// ---------- 入力 ----------
function toCard(e) { return [(e.clientX - card.x) / card.s, (e.clientY - card.y) / card.s]; }
cv.addEventListener('pointerdown', e => {
  Snd.init();
  S.lastInput = S.time;
  if (S.mode !== 'play') return;
  cv.setPointerCapture(e.pointerId);
  const st = { pts: [toCard(e)], color: LEVELS[S.lv].color };
  S.strokes.push(st); active.set(e.pointerId, st);
  const [u, v] = st.pts[0];
  if (u >= -0.05 && u <= 1.05 && v >= -0.05 && v <= 1.05) markCover(u, v);
  updateMeter();
});
cv.addEventListener('pointermove', e => {
  const st = active.get(e.pointerId);
  if (!st) return;
  S.lastInput = S.time;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  for (const ev of (evs.length ? evs : [e])) {
    const p = toCard(ev), l = st.pts[st.pts.length - 1];
    if (Math.hypot((p[0] - l[0]) * card.s, (p[1] - l[1]) * card.s) < 2) continue;
    // 点と点のあいだもぬけなく「なぞった」にする
    const steps = Math.ceil(Math.hypot(p[0] - l[0], p[1] - l[1]) * CFG.grid / 1.5);
    let got = 0;
    for (let k = 1; k <= steps; k++) got += markCover(l[0] + (p[0] - l[0]) * k / steps, l[1] + (p[1] - l[1]) * k / steps);
    st.pts.push(p);
    if (got && Math.random() < 0.5) Snd.tick(coverage());
  }
  updateMeter();
});
function endStroke(e) {
  if (!active.has(e.pointerId)) return;
  active.delete(e.pointerId);
  // ほぼ全部なぞれたら、自動で採点
  if (coverage() >= 0.985 && !active.size) setTimeout(() => { if (!active.size) finish(); }, 600);
}
cv.addEventListener('pointerup', endStroke);
cv.addEventListener('pointercancel', endStroke);
cv.addEventListener('contextmenu', e => e.preventDefault());

$('bDone').onclick = () => { Snd.init(); if (S.strokes.length) finish(); };
$('bClear').onclick = () => { Snd.init(); Snd.click(); clearStrokes(); };
$('bBack').onclick = () => { Snd.init(); Snd.click(); buildTitle(); show('title'); };
$('bAgain').onclick = () => { Snd.click(); startLevel(S.lv); };
$('bNext').onclick = () => { Snd.click(); startLevel(Math.min(S.lv + 1, LEVELS.length - 1)); };
$('bSel').onclick = () => { Snd.click(); buildTitle(); show('title'); };

function goHome() {
  if (window.parent !== window) window.parent.postMessage({ type: 'minigame-exit', game: GAME_ID }, '*');
  else history.back();
}
function toggleFull() {
  const de = document.documentElement;
  if (!(document.fullscreenElement || document.webkitFullscreenElement)) {
    if (de.requestFullscreen) de.requestFullscreen().catch(() => {});
    else if (de.webkitRequestFullscreen) de.webkitRequestFullscreen();   // iPad の Safari
  } else if (document.exitFullscreen) document.exitFullscreen();
  else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
}
function toggleSound() {
  Snd.on = !Snd.on; Snd.init();
  $('bSound').textContent = Snd.on ? '🔊' : '🔇';
  try { localStorage.setItem(GAME_ID + ':sound', Snd.on ? '1' : '0'); } catch (e) {}
}
try { if (localStorage.getItem(GAME_ID + ':sound') === '0') { Snd.on = false; $('bSound').textContent = '🔇'; } } catch (e) {}
$('bHome').onclick = goHome; $('bFull').onclick = toggleFull; $('bSound').onclick = toggleSound;
addEventListener('keydown', e => {
  Snd.init();
  if (e.key === 'f' || e.key === 'F') toggleFull();
  else if (e.key === 'm' || e.key === 'M') toggleSound();
  else if (e.key === 'Escape') goHome();
});
addEventListener('pointerdown', () => { S.lastInput = S.time; }, true);

// ---------- 描画 ----------
const FONT = '"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","BIZ UDPGothic","Meiryo",system-ui,sans-serif';
function outlined(text, x, y, size, fill, stroke = '#fff') {
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = size * 0.22; ctx.strokeStyle = stroke;
  ctx.strokeText(text, x, y); ctx.fillStyle = fill; ctx.fillText(text, x, y);
}
function drawStar(x, y, r, fill, line) {
  ctx.beginPath();
  for (let j = 0; j < 10; j++) { const a = j * Math.PI / 5 - Math.PI / 2, rr = j % 2 ? r * 0.48 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
  if (line) { ctx.lineWidth = r * 0.12; ctx.strokeStyle = line; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function drawPaper() {
  const { x, y, s } = card, r = 3 * U;
  ctx.save();
  ctx.shadowColor = 'rgba(120,70,20,0.18)'; ctx.shadowBlur = 3 * U; ctx.shadowOffsetY = 1 * U;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, s, s, r) : ctx.rect(x, y, s, s); ctx.fill();
  ctx.restore();
}
function drawStrokes(alpha = 1) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = card.s * 0.016;
  ctx.globalAlpha = alpha;
  for (const st of S.strokes) {
    if (st.pts.length === 1) {
      ctx.fillStyle = st.color;
      ctx.beginPath(); ctx.arc(card.x + st.pts[0][0] * card.s, card.y + st.pts[0][1] * card.s, ctx.lineWidth / 2, 0, 7); ctx.fill();
      continue;
    }
    ctx.strokeStyle = st.color;
    ctx.beginPath();
    st.pts.forEach((p, i) => { const X = card.x + p[0] * card.s, Y = card.y + p[1] * card.s; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); });
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
// 結果：なぞれた線は緑、なぞり残しは赤
function drawCoverMap(t) {
  const G = CFG.grid, cs = card.s / G;
  const { cells } = S.data;
  const showN = Math.floor(cells.length * clamp(t, 0, 1));
  for (let k = 0; k < showN; k++) {
    const i = cells[k];
    ctx.fillStyle = S.covered[i] ? '#2fbf62' : '#ff4d4d';
    ctx.fillRect(card.x + (i % G) * cs - cs * 0.3, card.y + Math.floor(i / G) * cs - cs * 0.3, cs * 1.6, cs * 1.6);
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  S.time += dt;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const idle = S.time - S.lastInput;
  if (S.mode === 'play' && !active.size && idle > CFG.idlePlay) { buildTitle(); show('title'); }
  if (S.mode === 'result' && idle > CFG.idleResult) { buildTitle(); show('title'); }

  if (S.mode === 'play' && S.data) {
    drawPaper();
    ctx.drawImage(S.data.ghost, card.x, card.y, card.s, card.s);
    drawStrokes();
    if (!S.strokes.length) {
      const a = 0.6 + 0.4 * Math.sin(S.time * 4);
      ctx.globalAlpha = a;
      outlined('うすい せんを なぞってね', card.x + card.s / 2, card.y + card.s * 0.95, U * 4, '#ff7a3d');
      ctx.globalAlpha = 1;
    }
  }

  if (S.mode === 'result' && S.res) {
    S.resT += dt;
    drawPaper();
    // 結果では絵を少し小さくして下によせ、上のあいたところに％を出す（絵にかぶらない）
    const full = { ...card };
    Object.assign(card, { x: full.x + full.s * 0.1, y: full.y + full.s * 0.22, s: full.s * 0.8 });
    drawStrokes(0.35);
    drawCoverMap(S.resT / 0.8);
    Object.assign(card, full);
    // 点数をカウントアップ
    const r = S.res;
    const t = clamp((S.resT - 0.6) / 1.2, 0, 1);
    const shown = Math.round(r.score * (1 - Math.pow(1 - t, 3)));
    if (shown !== S.lastCount && t > 0 && t < 1) Snd.count();
    S.lastCount = shown;
    const cx = card.x + card.s / 2;
    outlined('せいかくど', cx, card.y + card.s * 0.055, card.s * 0.042, '#7a5a3a');
    const pop = t >= 1 ? 1 + Math.max(0, 0.25 - (S.resT - 1.8)) * 0.8 : 1;
    outlined(shown + '%', cx, card.y + card.s * 0.165, card.s * 0.14 * pop, '#ff7a3d', '#fff');
    if (t >= 1 && !S.fan) { S.fan = true; Snd.fanfare(r.score >= 70); }
  }
  requestAnimationFrame(frame);
}

// ---------- はじめる ----------
(async () => {
  resize();
  for (const lv of LEVELS) {
    const c = await renderLevel(lv);
    S.lvCanvas.push(c);
    S.analyzed.push(analyze(c));
  }
  buildTitle();
  show('title');
  requestAnimationFrame(frame);
})();
</script>
<script>
/* ---- iPhone / iPad（Safari）むけの調整 ---- */
(function () {
  const d = document;
  // 1) 見えている大きさが変わったら描き直す（アドレスバーが出たり消えたりしたとき・画面を回したとき）
  const re = () => { try { resize(); } catch (e) {} };
  if (window.visualViewport) visualViewport.addEventListener('resize', re);
  addEventListener('orientationchange', () => { setTimeout(re, 250); setTimeout(re, 700); });
  addEventListener('pageshow', re);
  // 2) 指2本での拡大・ダブルタップでの拡大・画面のひっぱりスクロールを止める
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => d.addEventListener(t, e => e.preventDefault(), { passive: false }));
  d.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  let lastEnd = 0;
  d.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastEnd < 350 && !e.target.closest('button')) e.preventDefault();
    lastEnd = now;
  }, { passive: false });
  // 3) 全画面にできないブラウザ（iPhone の Safari）では、全画面ボタンをかくす
  const fsOK = d.fullscreenEnabled || d.webkitFullscreenEnabled;
  const fb = d.getElementById('bFull');
  if (fb && !fsOK) fb.style.display = 'none';
  // 4) 音：さわったときに必ず音を出せる状態にする（iPhone は最初にさわるまで音が出ない）
  const unlock = () => {
    try {
      Snd.init();
      const ac = Snd.ac;
      if (!ac) return;
      if (ac.state !== 'running') ac.resume();
      if (!Snd._unlocked) {
        const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource();
        s.buffer = b; s.connect(ac.destination); s.start(0);
        Snd._unlocked = true;
      }
    } catch (e) {}
  };
  ['touchstart', 'touchend', 'pointerdown', 'click', 'keydown'].forEach(t => d.addEventListener(t, unlock, { capture: true, passive: true }));
  // ほかのアプリから もどってきたとき、音を止まったままにしない
  d.addEventListener('visibilitychange', () => { if (!d.hidden) { Snd._unlocked = false; } });
})();
</script>
