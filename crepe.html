<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>クレープやさん</title>
<style>
:root {
  --bg: #1d2228;
  --dark: #181c21;
  --ink: #e8e6e1;
  --muted: #9aa1a9;
  --accent: #8fb0bd;
  --easy: #7fae95;
  --normal: #c9a468;
  --hard: #c98890;
  --gold: #e0c88c;
  --line: rgba(255, 255, 255, .1);
  --glass: rgba(24, 28, 33, .72);
  --panel: rgba(32, 37, 44, .94);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: "Hiragino Maru Gothic ProN", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif;
  font-weight: 700;
  color: var(--ink);
  background: var(--dark);
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }

.screen {
  position: fixed; inset: 0;
  display: none;
  flex-direction: column; align-items: center; justify-content: center;
  padding: 16px; text-align: center;
}
.screen.show { display: flex; }

/* パネル(タイトル・けっか) */
.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: clamp(20px, 4vmin, 36px);
  max-width: 540px; width: 100%;
  max-height: 100%; overflow-y: auto;
  box-shadow: 0 8px 24px rgba(0, 0, 0, .25);
  scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, .2) transparent;
}
.screen.show .panel { animation: fadeIn .3s ease-out both; }
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
h1 {
  font-size: clamp(28px, 7vmin, 46px);
  line-height: 1.25;
  letter-spacing: .04em;
  color: var(--ink);
}
.sub { font-size: clamp(14px, 2.8vmin, 17px); color: var(--muted); margin: 10px 0 4px; }
.how {
  text-align: left; font-size: clamp(13px, 2.6vmin, 16px); line-height: 1.7; font-weight: 600;
  margin: 16px 0;
  list-style: none;
  display: grid; gap: 8px;
}
.how li {
  background: rgba(255, 255, 255, .04);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 8px 12px;
}
.how b { color: var(--gold); }

.btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
button {
  font: inherit; color: #1d2228; cursor: pointer;
  border: 0; border-radius: 14px;
  padding: 12px 10px; min-width: 120px; max-width: 220px; flex: 1 1 120px;
  font-size: clamp(16px, 3.4vmin, 20px);
  letter-spacing: .03em;
  background: var(--accent);
  transition: transform .1s, filter .1s;
}
button:hover { filter: brightness(1.07); }
button:active { transform: scale(.97); }
button:focus-visible, .link:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
button small { display: block; font-size: .6em; font-weight: 700; opacity: .8; margin-top: 2px; letter-spacing: 0; }
.b-easy { background: var(--easy); }
.b-normal { background: var(--normal); }
.b-hard { background: var(--hard); }
.b-plain {
  background: transparent;
  border: 1px solid rgba(255, 255, 255, .25);
  color: var(--ink);
}
.note { font-size: 12px; font-weight: 500; color: var(--muted); margin-top: 14px; }
.link { display: inline-block; margin-top: 16px; color: var(--accent); font-size: 14px; text-decoration: none; }
.link:hover { text-decoration: underline; }

.bigmsg {
  font-size: clamp(20px, 5vmin, 34px); color: #fff;
  text-shadow: 0 1px 6px rgba(0, 0, 0, .6);
  line-height: 1.5;
}
.spinner {
  width: 48px; height: 48px; margin: 24px auto;
  border: 4px solid rgba(255, 255, 255, .15);
  border-top-color: var(--ink);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
#ready { justify-content: flex-end; padding-bottom: 8vh; pointer-events: none; }
#readyBar {
  width: min(60vw, 340px); height: 8px; border-radius: 8px;
  background: rgba(255, 255, 255, .25);
  margin-top: 14px; overflow: hidden;
}
#readyFill { height: 100%; width: 0; border-radius: 8px; background: var(--ink); }

/* HUD */
#hud { pointer-events: none; display: none; }
#hud.show { display: block; }
.chip {
  position: fixed; top: 12px;
  background: var(--glass); color: rgba(255, 255, 255, .75);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 6px 16px; font-size: clamp(11px, 2.2vmin, 14px); line-height: 1.25;
  letter-spacing: .06em;
}
.chip b {
  display: block; font-size: 1.8em; letter-spacing: .02em;
  font-variant-numeric: tabular-nums;
  color: #fff;
}
#chipL, #scoreChip { left: 12px; text-align: left; }
#chipR, #comboChip { right: 12px; text-align: right; }
#big {
  position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
  max-width: 62vw;
  background: var(--glass); color: #fff;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 8px 24px; font-size: clamp(20px, 5vmin, 40px); line-height: 1.3;
  text-align: center;
}
#big:empty { display: none; }
#big .red { color: #f0a0a6; }
#big .blue { color: #9cc6ea; }
#big .green { color: #94d1ae; }
#big .dim { color: rgba(255, 255, 255, .3); }
#quit {
  position: fixed; bottom: 12px; right: 12px; pointer-events: auto;
  min-width: 0; flex: none; padding: 6px 14px; font-size: 13px;
  color: var(--ink);
  background: var(--glass);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border: 1px solid var(--line); border-radius: 999px;
}
#judge, #count {
  position: fixed; left: 0; right: 0; top: 50%; text-align: center;
  font-size: clamp(40px, 11vmin, 96px); color: #fff;
  letter-spacing: .04em;
  text-shadow: 0 2px 10px rgba(0, 0, 0, .5);
  opacity: 0; transform: translateY(-50%);
}
#count { opacity: 1; }
#judge.pop { animation: pop .7s ease-out forwards; }
#judge.perfect { color: var(--gold); }
#judge.good { color: #94d1ae; }
#judge.miss { color: #b9bcc2; }
@keyframes pop {
  0% { opacity: 0; transform: translateY(-50%) scale(.85); }
  20% { opacity: 1; transform: translateY(-50%) scale(1); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-62%) scale(1); }
}

/* result */
#rank {
  font-size: clamp(64px, 18vmin, 120px); line-height: 1.05;
  color: var(--gold);
}
#rankMsg { font-size: clamp(16px, 3.6vmin, 22px); margin: 8px 0; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 14px 0; font-size: clamp(12px, 2.4vmin, 14px); color: var(--muted); }
.stats div {
  background: rgba(255, 255, 255, .04);
  border: 1px solid var(--line);
  border-radius: 12px; padding: 8px;
}
.stats b { display: block; font-size: 1.6em; color: var(--ink); font-variant-numeric: tabular-nums; }
#newRecord { color: var(--gold); font-size: clamp(14px, 3vmin, 18px); display: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01s !important; transition: none !important; }
}
</style>
</head>
<body>
<script>
/* カメラゲーム きょうつうぶひん
   つかいかた: CG.setup({ id, title, desc, how, modes, needs, start, update }) */
(function () {
  "use strict";
  const MP = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";
  const MODELS = {
    pose: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
    hand: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
  };
  const $ = (id) => document.getElementById(id);

  const CG = (window.CG = {
    W: 0, H: 0, u: 1,          // がめんサイズ と たんい(みじかい辺の 1/100)
    state: "title", mode: null,
    pose: null,                // { nose, Ls, Rs, Le, Re, Lw, Rw, Lhand, Rhand, unit, cx, cy }  R = じぶんの右(がめんでも右)
    hand: null,                // 手のランドマーク 21こ(がめん座標)
    fresh: false,              // このフレームで あたらしく にんしきしたか
    time: 0, score: 0, ctx: null,
  });

  let cfg, video, stage, ctx;
  let landmarker = null, camReady = false, lastVT = -1;
  let lay = { ox: 0, oy: 0, dw: 1, dh: 1 };
  let readyT = 0, countT = 0, lastCount = "", lastTs = 0;
  let particles = [];

  /* ---------- がめんづくり ---------- */
  CG.setup = function (c) {
    cfg = c;
    cfg.needs = cfg.needs || "pose";
    const cls = ["b-easy", "b-normal", "b-hard"];
    const modeBtns = cfg.modes.map((m, i) =>
      `<button class="${cls[i % 3]}" data-mode="${m.key}">${m.label}<small>${m.sub || ""}</small></button>`).join("");
    document.body.insertAdjacentHTML("beforeend", `
<canvas id="stage"></canvas>
<div id="title" class="screen show"><div class="panel">
  <h1>${cfg.title}</h1>
  <p class="sub">${cfg.desc}</p>
  <ul class="how">${cfg.how.map((h) => `<li>${h}</li>`).join("")}</ul>
  <p class="sub">むずかしさを えらんで スタート</p>
  <div class="btns">${modeBtns}</div>
  <p class="note">カメラの えいぞうは どこにも おくられません。まわりに 気をつけて あそんでね。</p>
</div></div>
<div id="loading" class="screen">
  <div class="bigmsg" id="loadMsg">じゅんびちゅう…</div>
  <div class="spinner" id="spinner"></div>
  <div class="btns"><button class="b-plain" id="loadBack" style="display:none">もどる</button></div>
</div>
<div id="ready" class="screen">
  <div class="bigmsg" id="readyMsg"></div>
  <div id="readyBar"><div id="readyFill"></div></div>
</div>
<div id="hud">
  <div class="chip" id="chipL">スコア<b id="score">0</b></div>
  <div class="chip" id="chipR"><span id="infoLabel">のこり</span><b id="info">-</b></div>
  <div id="big"></div>
  <div id="count"></div>
  <div id="judge"></div>
  <button id="quit">✕ やめる</button>
</div>
<div id="result" class="screen"><div class="panel">
  <div id="rank">S</div>
  <div id="rankMsg"></div>
  <div id="newRecord">🎉 しんきろく!</div>
  <div class="stats" id="stats"></div>
  <div class="btns">
    <button class="b-normal" id="retry">もういちど</button>
    <button class="b-plain" id="toTitle">タイトルへ</button>
  </div>
</div></div>`);
    video = document.createElement("video");
    video.playsInline = true; video.muted = true;
    stage = $("stage");
    ctx = CG.ctx = stage.getContext("2d");
    addEventListener("resize", resize);
    resize();

    document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => begin(b.dataset.mode)));
    $("retry").addEventListener("click", () => begin(CG.mode));
    $("toTitle").addEventListener("click", () => show("title"));
    $("loadBack").addEventListener("click", () => show("title"));
    $("quit").addEventListener("click", () => { stopAll(); show("title"); });
    requestAnimationFrame(frame);
  };

  function show(name) {
    CG.state = name;
    for (const id of ["title", "loading", "ready", "result"]) $(id).classList.toggle("show", id === name);
    $("hud").classList.toggle("show", name === "play" || name === "count");
  }
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    stage.width = CG.W = Math.round(innerWidth * dpr);
    stage.height = CG.H = Math.round(innerHeight * dpr);
    CG.u = Math.min(CG.W, CG.H) / 100;
  }

  /* ---------- カメラ と にんしき ---------- */
  async function initCamera() {
    if (camReady) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error("nocam");
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 960 }, height: { ideal: 540 } }, audio: false,
    });
    await video.play();
    camReady = true;
  }
  async function initModel() {
    if (landmarker) return;
    const vision = await import(`${MP}/vision_bundle.mjs`);
    const fileset = await vision.FilesetResolver.forVisionTasks(`${MP}/wasm`);
    const make = (delegate) => {
      const base = { baseOptions: { modelAssetPath: MODELS[cfg.needs], delegate }, runningMode: "VIDEO" };
      return cfg.needs === "hand"
        ? vision.HandLandmarker.createFromOptions(fileset, { ...base, numHands: 1 })
        : vision.PoseLandmarker.createFromOptions(fileset, { ...base, numPoses: 1 });
    };
    try { landmarker = await make("GPU"); } catch (e) { landmarker = await make("CPU"); }
  }
  const toScreen = (l) => ({ x: CG.W - (lay.ox + l.x * lay.dw), y: lay.oy + l.y * lay.dh });

  function detect() {
    let lm = null;
    try {
      const res = landmarker.detectForVideo(video, performance.now());
      lm = res.landmarks && res.landmarks[0] ? res.landmarks[0] : null;
    } catch (e) { lm = null; }
    CG.fresh = true;
    if (cfg.needs === "hand") { CG.hand = lm ? lm.map(toScreen) : null; return; }
    CG.pose = null;
    if (!lm) return;
    const vis = (i) => (lm[i].visibility == null ? 1 : lm[i].visibility) > 0.5;
    if (!vis(11) || !vis(12)) return;
    const P = (i) => toScreen(lm[i]);
    const p = { nose: P(0), Ls: P(11), Rs: P(12), Le: P(13), Re: P(14), Lw: P(15), Rw: P(16) };
    p.unit = Math.hypot(p.Ls.x - p.Rs.x, p.Ls.y - p.Rs.y);
    if (p.unit < CG.u * 3) return;
    p.cx = (p.Ls.x + p.Rs.x) / 2; p.cy = (p.Ls.y + p.Rs.y) / 2;
    const palm = (e, w) => ({ x: w.x + (w.x - e.x) * 0.3, y: w.y + (w.y - e.y) * 0.3 });
    p.Lhand = palm(p.Le, p.Lw); p.Rhand = palm(p.Re, p.Rw);
    CG.pose = p;
  }

  /* ---------- おと ---------- */
  let actx = null, master = null, noiseBuf = null, bgmTimer = null;
  function initAudio() {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = 0.6; master.connect(actx.destination);
      noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.5, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (actx.state === "suspended") actx.resume();
  }
  function tone(freq, t, dur, type, vol, slideTo) {
    if (!actx) return;
    t = t == null ? actx.currentTime : t;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(t, dur, vol, filterType, freq) {
    if (!actx) return;
    t = t == null ? actx.currentTime : t;
    const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    s.buffer = noiseBuf; f.type = filterType; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur + 0.02);
  }
  CG.tone = tone; CG.noise = noise;
  CG.sfx = function (kind) {
    if (!actx) return;
    const t = actx.currentTime;
    if (kind === "perfect") { tone(1318.5, t, 0.12, "sine", 0.2); tone(1568, t + 0.08, 0.12, "sine", 0.2); tone(2093, t + 0.16, 0.25, "sine", 0.2); }
    else if (kind === "good" || kind === "coin") { tone(988, t, 0.08, "sine", 0.18); tone(1318.5, t + 0.07, 0.2, "sine", 0.18); }
    else if (kind === "miss") { tone(200, t, 0.25, "sawtooth", 0.1, 110); }
    else if (kind === "pop") { noise(t, 0.07, 0.4, "bandpass", 1400); tone(500, t, 0.09, "square", 0.08, 1300); }
    else if (kind === "boom") { tone(130, t, 0.4, "sawtooth", 0.25, 40); noise(t, 0.35, 0.4, "lowpass", 900); }
    else if (kind === "tick") { tone(660, t, 0.07, "square", 0.07); }
    else if (kind === "go") { tone(1320, t, 0.3, "square", 0.08); }
    else if (kind === "fanfare") { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, t + i * 0.13, 0.3, "triangle", 0.2)); }
  };
  const CHORDS = [[261.63, 329.63, 392.0], [220.0, 261.63, 329.63], [174.61, 220.0, 261.63], [196.0, 246.94, 293.66]];
  const ARP = [0, 1, 2, 1, 0, 2, 1, 2];
  CG.bgm = function (bpm) {
    CG.bgmStop();
    if (!actx) return;
    const beat = 60 / bpm, t0 = actx.currentTime + 0.1;
    let b = 0;
    bgmTimer = setInterval(() => {
      while (t0 + b * beat < actx.currentTime + 0.25) {
        const t = t0 + b * beat, inBar = b % 4, chord = CHORDS[Math.floor(b / 4) % 4];
        if (inBar === 0 || inBar === 2) { tone(150, t, 0.16, "sine", 0.35, 45); tone(chord[0] / 2, t, beat * 0.9, "triangle", 0.14); }
        else noise(t, 0.09, 0.1, "bandpass", 1800);
        noise(t + beat / 2, 0.04, 0.04, "highpass", 7000);
        tone(chord[ARP[inBar * 2]] * 2, t, beat * 0.45, "triangle", 0.06);
        tone(chord[ARP[inBar * 2 + 1]] * 2, t + beat / 2, beat * 0.45, "triangle", 0.06);
        b++;
      }
    }, 25);
  };
  CG.bgmStop = function () { if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; } };
  let jaVoice = null;
  function pickVoice() {
    try {
      const vs = speechSynthesis.getVoices().filter((v) => /^ja/i.test(v.lang));
      jaVoice = vs.find((v) => v.localService) || vs[0] || null;
    } catch (e) {}
  }
  if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
  /* よみあげ。ev = { onstart, onend } で はじまり・おわりを うけとれる。つかえないときは false */
  CG.say = function (text, rate, ev) {
    try {
      if (!window.speechSynthesis) return false;
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = "ja-JP"; if (jaVoice) u.voice = jaVoice;
      u.rate = rate || 1.1; u.pitch = 1.2;
      if (ev) {
        u.onstart = ev.onstart || null; u.onend = ev.onend || null; u.onerror = ev.onend || null;
        u.onboundary = ev.onboundary || null;
        if (ev.volume != null) u.volume = ev.volume;
      }
      speechSynthesis.speak(u);
      return true;
    } catch (e) { return false; }
  };
  function stopAll() {
    CG.bgmStop();
    try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {}
  }

  /* ---------- ながれ ---------- */
  async function begin(mode) {
    CG.mode = mode;
    initAudio();
    show("loading");
    $("spinner").style.display = "";
    $("loadBack").style.display = "none";
    $("loadMsg").innerHTML = "カメラを じゅんびちゅう…<br>「きょか」を おしてね";
    try { await initCamera(); }
    catch (e) { return loadError("カメラが つかえませんでした。<br>カメラの「きょか」を たしかめてね"); }
    $("loadMsg").innerHTML = "うごきを 見るじゅんびを しているよ…";
    try { await initModel(); }
    catch (e) { console.error(e); return loadError("よみこみに しっぱいしました。<br>インターネットに つながっているか たしかめてね"); }
    if (CG.state !== "loading") return;
    readyT = 0;
    show("ready");
  }
  function loadError(html) {
    $("loadMsg").innerHTML = html;
    $("spinner").style.display = "none";
    $("loadBack").style.display = "";
  }
  const isReady = () => (cfg.ready ? cfg.ready() : cfg.needs === "hand" ? !!CG.hand : !!CG.pose);
  const readyText = () => cfg.readyMsg || (cfg.needs === "hand"
    ? "手を カメラに 見せてね"
    : "カメラから すこし はなれて<br>からだを うつしてね");

  function startPlay() {
    CG.time = 0; particles = [];
    CG.setScore(0); CG.big(""); CG.setInfo("のこり", "-");
    $("count").textContent = ""; $("judge").className = "";
    show("play");
    cfg.start(CG.mode);
  }

  CG.finish = function (r) {
    if (CG.state !== "play") return;
    stopAll();
    const rate = r.rate || 0;
    const [rank, msg] =
      rate >= 0.9 ? ["S", "すごすぎる! たつじんだ!"] :
      rate >= 0.7 ? ["A", "とっても じょうず!"] :
      rate >= 0.45 ? ["B", "いいかんじ! そのちょうし!"] :
                    ["C", "つぎは もっと できるよ!"];
    const key = "camGameHi_" + cfg.id + "_" + CG.mode;
    let hi = 0;
    try { hi = Number(localStorage.getItem(key)) || 0; } catch (e) {}
    const isNew = CG.score > hi;
    if (isNew) { hi = CG.score; try { localStorage.setItem(key, String(hi)); } catch (e) {} }
    $("rank").textContent = rank;
    $("rankMsg").textContent = r.msg || msg;
    $("newRecord").style.display = isNew && CG.score > 0 ? "block" : "none";
    const stats = [["スコア", CG.score], ["さいこうきろく", hi]].concat(r.stats || []);
    $("stats").innerHTML = stats.map(([l, v]) => `<div>${l}<b>${v}</b></div>`).join("");
    show("result");
    CG.sfx("fanfare");
  };

  /* ---------- HUD ---------- */
  CG.setScore = (n) => { CG.score = Math.max(0, Math.round(n)); $("score").textContent = CG.score; };
  CG.addScore = (d) => CG.setScore(CG.score + d);
  let infoL = "", infoV = "";
  CG.setInfo = (label, v) => {
    if (label !== infoL) { infoL = label; $("infoLabel").textContent = label; }
    if (String(v) !== infoV) { infoV = String(v); $("info").textContent = infoV; }
  };
  let bigHtml = "";
  CG.big = (html) => { if (html !== bigHtml) { bigHtml = html; $("big").innerHTML = html; } };
  CG.pop = (text, cls) => {
    const j = $("judge");
    j.textContent = text; j.className = "";
    void j.offsetWidth;
    j.className = "pop " + (cls || "perfect");
  };

  /* ---------- えがく どうぐ ---------- */
  CG.emoji = function (ch, x, y, size, rot) {
    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    ctx.font = `${size}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#000";
    ctx.fillText(ch, 0, 0);
    ctx.restore();
  };
  CG.text = function (str, x, y, size, fill) {
    ctx.save();
    ctx.font = `700 ${size}px "Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic UI","Meiryo",sans-serif`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = size * 0.2;
    ctx.fillStyle = fill || "#fff"; ctx.fillText(str, x, y);
    ctx.restore();
  };
  /* 下の タイムバー (frac: 0〜1) */
  CG.bar = function (frac, color) {
    const { W, H, u } = CG, w = 50 * u, x = (W - w) / 2, y = H - 7 * u;
    ctx.lineCap = "round"; ctx.lineWidth = 1.6 * u;
    ctx.strokeStyle = "rgba(255,255,255,.3)";
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.stroke();
    const f = Math.max(0, Math.min(1, frac));
    if (f > 0) {
      ctx.strokeStyle = color || "#fff";
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w * f, y); ctx.stroke();
    }
  };
  CG.skeleton = function (color) {
    const p = CG.pose;
    if (!p) return;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.lineWidth = Math.max(3, p.unit * 0.05);
    ctx.strokeStyle = color || "rgba(255,255,255,.75)";
    ctx.beginPath();
    ctx.moveTo(p.Lw.x, p.Lw.y); ctx.lineTo(p.Le.x, p.Le.y); ctx.lineTo(p.Ls.x, p.Ls.y);
    ctx.lineTo(p.Rs.x, p.Rs.y); ctx.lineTo(p.Re.x, p.Re.y); ctx.lineTo(p.Rw.x, p.Rw.y);
    ctx.stroke();
    ctx.fillStyle = "#fff";
    for (const h of [p.Rhand, p.Lhand]) { ctx.beginPath(); ctx.arc(h.x, h.y, p.unit * 0.13, 0, 6.3); ctx.fill(); }
  };
  CG.burst = function (x, y, color, n) {
    for (let i = 0; i < (n || 12); i++) {
      const a = Math.random() * 6.283, s = (20 + Math.random() * 50) * CG.u;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.5 + Math.random() * 0.3, color, size: (0.8 + Math.random() * 1.2) * CG.u });
    }
  };
  function drawParticles(dt) {
    for (const p of particles) {
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 120 * CG.u * dt;
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2.5));
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, 6.3); ctx.fill();
    }
    ctx.globalAlpha = 1;
    particles = particles.filter((p) => p.life > 0);
  }
  function drawVideo() {
    const { W, H } = CG;
    ctx.clearRect(0, 0, W, H);
    if (!camReady || !video.videoWidth) return;
    const vw = video.videoWidth, vh = video.videoHeight, s = Math.max(W / vw, H / vh);
    lay = { dw: vw * s, dh: vh * s, ox: (W - vw * s) / 2, oy: (H - vh * s) / 2 };
    ctx.save();
    ctx.translate(W, 0); ctx.scale(-1, 1);
    ctx.drawImage(video, lay.ox, lay.oy, lay.dw, lay.dh);
    ctx.restore();
    // タイトルなどでは くらくする。cfg.dim を きめた ゲームは あそんでいる あいだも カメラを うすくする
    const menu = CG.state === "title" || CG.state === "result" || CG.state === "loading";
    const dim = menu ? 0.6 : cfg.dim || 0;
    if (dim > 0) { ctx.fillStyle = `rgba(24,28,33,${dim})`; ctx.fillRect(0, 0, W, H); }
  }

  /* ---------- メインループ ---------- */
  function frame(ts) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0);
    lastTs = ts;
    const st = CG.state;
    const active = st === "ready" || st === "count" || st === "play";
    drawVideo();
    CG.fresh = false;
    if (active && camReady && landmarker && video.readyState >= 2 && video.currentTime !== lastVT) {
      lastVT = video.currentTime;
      detect();
    }
    if (st === "ready") {
      const ok = isReady();
      readyT = ok ? readyT + dt : Math.max(0, readyT - dt * 2);
      $("readyFill").style.width = Math.min(100, readyT * 100) + "%";
      $("readyMsg").innerHTML = ok ? "いいね! そのまま…" : readyText();
      if (cfg.needs === "pose") CG.skeleton();
      if (readyT >= 1) { countT = 3; lastCount = ""; show("count"); CG.big(""); $("judge").className = ""; }
    } else if (st === "count") {
      if (cfg.needs === "pose") CG.skeleton();
      countT -= dt;
      const c = countT > 0 ? String(Math.ceil(countT)) : "スタート!";
      if (c !== lastCount) { lastCount = c; $("count").textContent = c; CG.sfx(countT > 0 ? "tick" : "go"); }
      if (countT <= -0.6) startPlay();
    } else if (st === "play") {
      CG.time += dt;
      cfg.update(dt);
      drawParticles(dt);
    }
  }
})();
</script>
<script>
const MODES = {
  easy:   { stir: 2, swipe: 4, top: 2, crepes: 1 },
  normal: { stir: 3, swipe: 6, top: 3, crepes: 1 },
  hard:   { stir: 4, swipe: 8, top: 4, crepes: 2 },
};
const TOPS = ["🍓", "🍌", "🫐", "🍫", "🍒", "🥝"];
const PAR = 4;          // これより はやければ まんてん(びょう)
const SKIP = 25;        // これだけ できなければ つぎへ すすむ(びょう)

let M, si, crepe, prog, stepT, pause, showT, A, S, picked, allPicked, flipK, skipped;

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

/* ---------- こうてい(うごきの はんてい) ---------- */
const STEPS = [
  { // 1. まぜる: 手で ボウルの まわりを ぐるぐる
    text: "手を ぐるぐる まわして きじを まぜる",
    init() { S = { sum: [0, 0], last: [null, null] }; },
    update() {
      const p = CG.pose;
      if (p && CG.fresh) {
        [p.Rhand, p.Lhand].forEach((h, i) => {
          const d = dist(h, A) / A.r;
          if (d < 0.2 || d > 3) { S.last[i] = null; return; }
          const ang = Math.atan2(h.y - A.y, h.x - A.x);
          if (S.last[i] != null) {
            let da = ang - S.last[i];
            if (da > Math.PI) da -= 2 * Math.PI; else if (da < -Math.PI) da += 2 * Math.PI;
            if (Math.abs(da) < 1.5) S.sum[i] += da;      // 行ったり来たりは うちけしあう
          }
          S.last[i] = ang;
        });
      }
      return Math.max(Math.abs(S.sum[0]), Math.abs(S.sum[1])) / (2 * Math.PI * M.stir);
    },
  },
  { // 2. のばす: りょうてを 大きく ひろげる
    text: "りょうてを 大きく ひろげて きじを のばす",
    init() { S = { hold: 0 }; },
    update(dt) {
      const p = CG.pose;
      if (p && dist(p.Lhand, p.Rhand) > 2.4 * p.unit) S.hold += dt;
      return S.hold / 1.0;
    },
  },
  { // 3. ひっくりかえす: りょうてを 下から 上へ
    text: "りょうてを 下から 上へ ポーン! ひっくりかえす",
    init() { S = { armed: false }; },
    update() {
      const p = CG.pose;
      if (!p) return 0;
      if (p.Lw.y > p.Ls.y + 0.2 * p.unit && p.Rw.y > p.Rs.y + 0.2 * p.unit) S.armed = true;
      if (S.armed && p.Lw.y < p.nose.y && p.Rw.y < p.nose.y) return 1;
      return S.armed ? 0.5 : 0;
    },
  },
  { // 4. クリーム: 手を 左右に ふる
    text: "手を 左右に ふって クリームを ぬる",
    init() { S = { dir: [0, 0], ext: [null, null], count: 0 }; },
    update() {
      const p = CG.pose;
      if (p && CG.fresh) {
        [p.Rhand, p.Lhand].forEach((h, i) => {
          const x = h.x / p.unit;
          if (S.ext[i] == null) { S.ext[i] = x; return; }
          const dx = x - S.ext[i];
          if (S.dir[i] === 0) {
            if (Math.abs(dx) > 0.7) { S.dir[i] = Math.sign(dx); S.ext[i] = x; S.count++; CG.sfx("tick"); }
          } else if (dx * S.dir[i] > 0) S.ext[i] = x;                       // おなじ むきに すすんでいる
          else if (Math.abs(dx) > 0.7) { S.dir[i] = -S.dir[i]; S.ext[i] = x; S.count++; CG.sfx("tick"); }  // おりかえした
        });
      }
      return S.count / M.swipe;
    },
  },
  { // 5. トッピング: すきな ものを タッチ
    text: "",
    init() {
      const { W, H, u } = CG;
      S = { items: TOPS.map((ch, i) => {
        const side = i < 3 ? -1 : 1, row = i % 3;
        const x = A.x + side * (1.45 + (row === 1 ? 0.35 : 0)) * A.r, y = A.y + (row - 1.3) * 0.9 * A.r;
        return { ch, x: Math.max(10 * u, Math.min(W - 10 * u, x)), y: Math.max(28 * u, Math.min(H - 12 * u, y)) };
      }) };
      this.text = `すきな トッピングを ${M.top}つ タッチ`;
    },
    update() {
      const p = CG.pose;
      if (p) {
        for (const it of S.items) {
          if (it.taken || picked.length >= M.top) continue;
          if (dist(p.Rhand, it) < 11 * CG.u || dist(p.Lhand, it) < 11 * CG.u) {
            it.taken = true; picked.push(it.ch); allPicked.push(it.ch);
            CG.sfx("pop"); CG.burst(it.x, it.y, "#fff", 8);
          }
        }
      }
      return picked.length / M.top;
    },
  },
  { // 6. まく: うでを クロス
    text: "うでを クロスして くるっと まく",
    init() { S = { hold: 0 }; },
    update(dt) {
      const p = CG.pose;
      // ふだんは みぎてが がめんの右。クロスすると ぎゃくになる
      const inBody = (w) => p && w.y > p.cy - 0.4 * p.unit && w.y < p.cy + 1.7 * p.unit;
      const crossed = p && p.Rw.x < p.Lw.x - 0.1 * p.unit && inBody(p.Rw) && inBody(p.Lw);
      S.hold = crossed ? S.hold + dt : Math.max(0, S.hold - dt);
      return S.hold / 0.8;
    },
  },
  { // 7. いただきます: 手を あわせる
    text: "手を あわせて いただきます!",
    init() { S = { hold: 0 }; },
    update(dt) {
      const p = CG.pose;
      const together = p && dist(p.Lw, p.Rw) < 0.7 * p.unit;
      S.hold = together ? S.hold + dt : Math.max(0, S.hold - dt);
      return S.hold / 0.6;
    },
  },
];

// クレープは がめんの まん中に おいたまま うごかさない
function place() { A = { x: CG.W / 2, y: CG.H * 0.58, r: 25 * CG.u }; }
function enter(i) {
  si = i; prog = 0; stepT = 0;
  STEPS[i].init();
  CG.big(`${i + 1}/${STEPS.length}　${STEPS[i].text}`);
}
function newCrepe() { picked = []; flipK = -1; enter(0); }

/* ---------- え(かげ・グラデーションで りったいてきに えがく) ---------- */
function rng(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const R0 = rng(7);
const inDisc = () => { const a = R0() * 6.283, d = Math.sqrt(R0()) * 0.95; return { x: Math.cos(a) * d, y: Math.sin(a) * d }; };
const SPOTS = Array.from({ length: 80 }, () => ({ ...inDisc(), r: 0.03 + R0() * 0.1, a: 0.1 + R0() * 0.22 }));    // やきいろ
const BUBBLES = Array.from({ length: 50 }, () => ({ ...inDisc(), r: 0.012 + R0() * 0.025 }));                       // 小さな あわ

function radial(x0, y0, r0, x1, y1, r1, stops) {
  const g = CG.ctx.createRadialGradient(x0, y0, r0, x1, y1, r1);
  stops.forEach(([o, c]) => g.addColorStop(o, c));
  return g;
}
function linear(x0, y0, x1, y1, stops) {
  const g = CG.ctx.createLinearGradient(x0, y0, x1, y1);
  stops.forEach(([o, c]) => g.addColorStop(o, c));
  return g;
}
function circle(x, y, r, fill) {
  const { ctx } = CG;
  ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
}
function shadow(x, y, rx, ry, a) {
  const { ctx } = CG;
  ctx.save();
  ctx.translate(x, y); ctx.scale(1, ry / rx);
  circle(0, 0, rx, radial(0, 0, rx * 0.55, 0, 0, rx, [[0, `rgba(0,0,0,${a})`], [1, "rgba(0,0,0,0)"]]));
  ctx.restore();
}
// きじの ふち: まんまるでは なく すこし ゆがんだ 形
function blobPath(r) {
  const { ctx } = CG;
  ctx.beginPath();
  for (let i = 0; i <= 60; i++) {
    const t = (i / 60) * 6.2832, rr = r * (1 + 0.008 * Math.sin(3 * t + 1) + 0.006 * Math.sin(7 * t + 2));
    if (i) ctx.lineTo(Math.cos(t) * rr, Math.sin(t) * rr); else ctx.moveTo(Math.cos(t) * rr, Math.sin(t) * rr);
  }
  ctx.closePath();
}

function disc(x, y, r, cooked, sx, sy) {
  const { ctx } = CG;
  ctx.save();
  ctx.translate(x, y); ctx.scale(sx == null ? 1 : sx, sy == null ? 1 : sy);
  blobPath(r);
  ctx.fillStyle = cooked
    ? radial(-r * 0.2, -r * 0.25, r * 0.1, 0, 0, r, [[0, "#f8dfa6"], [0.75, "#ecc079"], [1, "#c98d42"]])
    : radial(-r * 0.2, -r * 0.25, r * 0.1, 0, 0, r, [[0, "#fffbe8"], [0.8, "#f8e7b4"], [1, "#e9cf8a"]]);
  ctx.fill();
  ctx.save();
  ctx.clip();
  if (cooked) {
    for (const s of SPOTS) circle(s.x * r, s.y * r, s.r * r, `rgba(150,82,28,${s.a})`);
    for (const b of BUBBLES) circle(b.x * r, b.y * r, b.r * r, "rgba(255,238,196,.45)");
  } else {
    ctx.fillStyle = "rgba(255,255,255,.4)";
    ctx.beginPath(); ctx.ellipse(-r * 0.3, -r * 0.38, r * 0.36, r * 0.15, -0.5, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
  blobPath(r);
  ctx.lineWidth = r * 0.025;
  ctx.strokeStyle = cooked ? "rgba(140,82,30,.6)" : "rgba(205,175,105,.6)";
  ctx.stroke();
  ctx.restore();
}
function pan(x, y, r) {
  const { ctx } = CG;
  shadow(x + r * 0.08, y + r * 0.12, r * 1.3, r * 1.3, 0.55);
  ctx.save();                                   // とって
  ctx.translate(x, y); ctx.rotate(0.6);
  ctx.fillStyle = linear(0, -r * 0.11, 0, r * 0.11, [[0, "#4a4e58"], [1, "#131418"]]);
  ctx.beginPath(); ctx.roundRect(r * 0.9, -r * 0.1, r * 1.0, r * 0.2, r * 0.1); ctx.fill();
  ctx.restore();
  circle(x, y, r, radial(x, y, r * 0.8, x, y, r, [[0, "#23252c"], [0.8, "#555a66"], [1, "#17181c"]]));                 // ふち
  circle(x, y, r * 0.9, radial(x - r * 0.3, y - r * 0.3, 0, x, y, r * 0.9, [[0, "#41454f"], [1, "#1b1c22"]]));          // やく面
  ctx.strokeStyle = "rgba(255,255,255,.2)"; ctx.lineWidth = r * 0.03; ctx.lineCap = "round";
  ctx.beginPath(); ctx.arc(x, y, r * 0.95, 3.5, 4.9); ctx.stroke();
}
function bowl(x, y, r, ang) {
  const { ctx } = CG;
  shadow(x + r * 0.06, y + r * 0.1, r * 1.25, r * 1.25, 0.55);
  circle(x, y, r, radial(x - r * 0.3, y - r * 0.3, r * 0.2, x, y, r, [[0, "#ffffff"], [0.7, "#e4e7ec"], [1, "#b4b9c4"]]));    // ふち
  circle(x, y, r * 0.87, radial(x, y, r * 0.5, x, y, r * 0.87, [[0, "#cfd4dc"], [1, "#f4f6f8"]]));                          // 内がわ
  const br = r * 0.75;
  circle(x, y, br, radial(x - br * 0.2, y - br * 0.2, br * 0.1, x, y, br, [[0, "#fff6d6"], [1, "#eed28a"]]));               // きじ
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, br, 0, 6.2832); ctx.clip();
  ctx.lineCap = "round";
  for (let k = 0; k < 3; k++) {                 // まぜた あとの うず
    for (const [col, off] of [["rgba(196,152,72,.5)", 0], ["rgba(255,255,255,.55)", 0.25]]) {
      ctx.strokeStyle = col; ctx.lineWidth = br * 0.045;
      ctx.beginPath();
      for (let i = 0; i <= 24; i++) {
        const t = i / 24, a = ang + off + k * 2.094 + t * 3.6, rr = br * t;
        if (i) ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); else ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
  }
  ctx.restore();
  // あわだてき
  const hx = x + Math.cos(ang) * br * 0.5, hy = y + Math.sin(ang) * br * 0.5;
  ctx.save();
  ctx.translate(hx, hy); ctx.rotate(ang);
  ctx.strokeStyle = "#c4c9d2"; ctx.lineWidth = r * 0.022;
  for (const ry of [0.03, 0.09, 0.15]) { ctx.beginPath(); ctx.ellipse(0, 0, r * 0.24, r * ry, 0, 0, 6.2832); ctx.stroke(); }
  ctx.lineCap = "round"; ctx.lineWidth = r * 0.075;
  ctx.strokeStyle = linear(0, -r * 0.04, 0, r * 0.04, [[0, "#eef0f3"], [1, "#8d939f"]]);
  ctx.beginPath(); ctx.moveTo(r * 0.22, 0); ctx.lineTo(r * 1.0, 0); ctx.stroke();
  ctx.restore();
}
function cream(x, y, r, k) {
  const { ctx } = CG, n = 7, pts = [];
  for (let j = 0; j <= n; j++) {
    const yy = -0.62 * r + (1.24 * r * j) / n;
    pts.push([x + (j % 2 ? 1 : -1) * Math.sqrt(Math.max(0, r * r - yy * yy)) * 0.72, y + yy]);
  }
  const len = Math.max(0, Math.min(1, k)) * n;
  if (len <= 0) return;
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  // かげ → 本体 → ひかり の 3そうで もりあがって 見せる
  for (const [col, w, ox, oy] of [["rgba(110,75,35,.35)", 0.19, 0.02, 0.06], ["#fffdf5", 0.17, 0, 0], ["rgba(255,255,255,.95)", 0.05, -0.02, -0.04]]) {
    ctx.strokeStyle = col; ctx.lineWidth = r * w;
    ctx.beginPath(); ctx.moveTo(pts[0][0] + ox * r, pts[0][1] + oy * r);
    for (let j = 1; j <= n; j++) {
      const f = Math.min(1, len - (j - 1));
      if (f <= 0) break;
      ctx.lineTo(pts[j - 1][0] + (pts[j][0] - pts[j - 1][0]) * f + ox * r, pts[j - 1][1] + (pts[j][1] - pts[j - 1][1]) * f + oy * r);
    }
    ctx.stroke();
  }
}

/* トッピング(s = 大きさの めやす) */
const TOP_ART = {
  "🍓"(s) {
    const { ctx } = CG;
    ctx.beginPath();
    ctx.moveTo(0, s * 0.95);
    ctx.bezierCurveTo(-s * 1.1, s * 0.2, -s * 0.85, -s * 0.75, 0, -s * 0.55);
    ctx.bezierCurveTo(s * 0.85, -s * 0.75, s * 1.1, s * 0.2, 0, s * 0.95);
    ctx.fillStyle = radial(-s * 0.25, -s * 0.2, s * 0.1, 0, 0, s, [[0, "#ff8080"], [0.6, "#e3263f"], [1, "#a80f27"]]);
    ctx.fill();
    ctx.fillStyle = "#ffe08a";
    for (const [px, py] of [[-0.35, -0.2], [0.05, -0.3], [0.4, -0.15], [-0.45, 0.15], [-0.1, 0.1], [0.3, 0.2], [-0.2, 0.45], [0.15, 0.5], [0, 0.75]]) {
      ctx.beginPath(); ctx.ellipse(px * s, py * s, s * 0.04, s * 0.07, 0, 0, 6.2832); ctx.fill();
    }
    ctx.fillStyle = "rgba(255,255,255,.35)";
    ctx.beginPath(); ctx.ellipse(-s * 0.4, -s * 0.15, s * 0.1, s * 0.24, 0.4, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#3f9b3a";
    for (const rot of [-0.7, 0, 0.7]) { ctx.beginPath(); ctx.ellipse(Math.sin(rot) * s * 0.28, -s * 0.62, s * 0.11, s * 0.3, rot + 1.5708, 0, 6.2832); ctx.fill(); }
  },
  "🍌"(s) {
    const { ctx } = CG, r = s * 0.85;
    circle(0, 0, r, radial(-r * 0.2, -r * 0.2, r * 0.1, 0, 0, r, [[0, "#fffbe0"], [1, "#f3dc8e"]]));
    ctx.strokeStyle = "#dcc060"; ctx.lineWidth = s * 0.07; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.7)"; ctx.lineWidth = s * 0.04; ctx.beginPath(); ctx.arc(0, 0, r * 0.62, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = "rgba(200,165,85,.4)"; ctx.lineWidth = s * 0.03;
    for (let i = 0; i < 3; i++) { const a = i * 2.094 + 0.5; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * r * 0.5, Math.sin(a) * r * 0.5); ctx.stroke(); }
    for (let i = 0; i < 3; i++) { const a = i * 2.094 - 0.55; circle(Math.cos(a) * r * 0.2, Math.sin(a) * r * 0.2, s * 0.05, "#8a6a3a"); }
  },
  "🫐"(s) {
    for (const [px, py] of [[-0.42, 0.2], [0.42, 0.25], [0, -0.38]]) {
      const cx = px * s, cy = py * s, r = s * 0.47;
      circle(cx, cy, r, radial(cx - r * 0.35, cy - r * 0.35, r * 0.05, cx, cy, r, [[0, "#8a9cec"], [0.55, "#2f3f92"], [1, "#131a45"]]));
      circle(cx + r * 0.2, cy - r * 0.1, r * 0.2, "#0f1436");
      circle(cx - r * 0.4, cy - r * 0.4, r * 0.13, "rgba(255,255,255,.55)");
    }
  },
  "🍫"(s) {
    const { ctx } = CG;
    for (const [px, py, rot] of [[-0.35, 0.25, -0.3], [0.38, 0.2, 0.5], [0, -0.35, 0.1]]) {
      ctx.save();
      ctx.translate(px * s, py * s); ctx.rotate(rot);
      ctx.fillStyle = linear(0, -s * 0.3, 0, s * 0.3, [[0, "#8f5a34"], [1, "#3f200f"]]);
      ctx.beginPath(); ctx.roundRect(-s * 0.42, -s * 0.3, s * 0.84, s * 0.6, s * 0.08); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.18)";
      ctx.beginPath(); ctx.roundRect(-s * 0.34, -s * 0.23, s * 0.68, s * 0.14, s * 0.05); ctx.fill();
      ctx.restore();
    }
  },
  "🍒"(s) {
    const { ctx } = CG;
    ctx.strokeStyle = "#5c7a2a"; ctx.lineWidth = s * 0.08; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, -s * 0.25); ctx.quadraticCurveTo(s * 0.05, -s * 0.8, s * 0.45, -s * 1.0); ctx.stroke();
    const cy = s * 0.22, r = s * 0.68;
    circle(0, cy, r, radial(-r * 0.35, cy - r * 0.35, r * 0.05, 0, cy, r, [[0, "#ff7684"], [0.5, "#cf1630"], [1, "#74061a"]]));
    ctx.fillStyle = "rgba(255,255,255,.6)";
    ctx.beginPath(); ctx.ellipse(-r * 0.38, cy - r * 0.42, r * 0.2, r * 0.11, -0.7, 0, 6.2832); ctx.fill();
  },
  "🥝"(s) {
    const { ctx } = CG, r = s * 0.85;
    circle(0, 0, r, radial(0, 0, r * 0.15, 0, 0, r, [[0, "#e2f28e"], [0.6, "#a9d04a"], [1, "#86b534"]]));
    ctx.strokeStyle = "#7b5b2b"; ctx.lineWidth = s * 0.07; ctx.beginPath(); ctx.arc(0, 0, r, 0, 6.2832); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.3)"; ctx.lineWidth = s * 0.025;
    for (let i = 0; i < 14; i++) { const a = (i / 14) * 6.2832; ctx.beginPath(); ctx.moveTo(Math.cos(a) * r * 0.3, Math.sin(a) * r * 0.3); ctx.lineTo(Math.cos(a) * r * 0.85, Math.sin(a) * r * 0.85); ctx.stroke(); }
    ctx.fillStyle = "#f5f8dc"; ctx.beginPath(); ctx.ellipse(0, 0, r * 0.26, r * 0.2, 0.3, 0, 6.2832); ctx.fill();
    ctx.fillStyle = "#1c1c12";
    for (let i = 0; i < 14; i++) { const a = (i / 14) * 6.2832 + 0.2; ctx.beginPath(); ctx.ellipse(Math.cos(a) * r * 0.45, Math.sin(a) * r * 0.45, s * 0.05, s * 0.028, a, 0, 6.2832); ctx.fill(); }
  },
};
function topping(ch, x, y, s) {
  const { ctx } = CG;
  shadow(x + s * 0.1, y + s * 0.25, s * 1.1, s * 0.9, 0.3);
  ctx.save(); ctx.translate(x, y); TOP_ART[ch](s); ctx.restore();
}
function plate(x, y, r) {
  shadow(x + r * 0.05, y + r * 0.1, r * 1.25, r * 1.25, 0.5);
  circle(x, y, r, radial(x - r * 0.3, y - r * 0.3, r * 0.1, x, y, r, [[0, "#ffffff"], [0.75, "#f1f3f6"], [1, "#c9ced8"]]));
  circle(x, y, r * 0.72, radial(x, y, r * 0.4, x, y, r * 0.72, [[0, "#ffffff"], [1, "#e9ecf1"]]));
}
function toppings(x, y, r, sx) {
  picked.forEach((ch, i) => {
    const a = (i / Math.max(1, picked.length)) * 6.283 - 1.2, rr = picked.length > 1 ? 0.45 * r : 0;
    topping(ch, x + Math.cos(a) * rr * (sx == null ? 1 : sx), y + Math.sin(a) * rr, 0.24 * r);
  });
}
function cone(x, y, s) {      // まいた クレープ(よこから 見た すがた)
  const { ctx } = CG;
  // クリームと トッピングは 上から のぞく
  for (const dx of [-0.42, -0.15, 0.13, 0.4]) {
    const cx = x + dx * s, cy = y - 0.52 * s, r = 0.23 * s;
    circle(cx, cy, r, radial(cx - r * 0.3, cy - r * 0.4, r * 0.1, cx, cy, r, [[0, "#ffffff"], [0.7, "#f6f0e4"], [1, "#d9cfbb"]]));
    ctx.strokeStyle = "rgba(170,150,120,.45)"; ctx.lineWidth = r * 0.1; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.55, 3.4, 5.6); ctx.stroke();
  }
  picked.forEach((ch, i) => {
    const k = picked.length > 1 ? i / (picked.length - 1) - 0.5 : 0;
    topping(ch, x + k * 0.9 * s, y - 0.74 * s - (i % 2) * 0.1 * s, 0.19 * s);
  });
  // きじ
  const body = () => {
    ctx.beginPath();
    ctx.moveTo(x, y + s); ctx.lineTo(x - 0.62 * s, y - 0.42 * s);
    ctx.quadraticCurveTo(x - 0.3 * s, y - 0.6 * s, x, y - 0.44 * s);
    ctx.quadraticCurveTo(x + 0.3 * s, y - 0.6 * s, x + 0.62 * s, y - 0.42 * s);
    ctx.closePath();
  };
  body();
  ctx.fillStyle = linear(x - 0.62 * s, 0, x + 0.62 * s, 0, [[0, "#d39a4e"], [0.42, "#f7dc9f"], [1, "#dba559"]]);
  ctx.fill();
  ctx.save(); ctx.clip();
  for (const sp of SPOTS) circle(x + sp.x * 0.62 * s, y + 0.25 * s + sp.y * 0.75 * s, sp.r * 0.6 * s, `rgba(150,82,28,${sp.a})`);
  ctx.fillStyle = "rgba(120,70,25,.25)";          // おりかさねた ぶぶん
  ctx.beginPath(); ctx.moveTo(x + 0.62 * s, y - 0.42 * s); ctx.lineTo(x, y + s); ctx.lineTo(x + 0.08 * s, y - 0.5 * s); ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = "rgba(130,78,28,.55)"; ctx.lineWidth = s * 0.015;
  ctx.beginPath(); ctx.moveTo(x + 0.08 * s, y - 0.46 * s); ctx.lineTo(x, y + s); ctx.stroke();
  body(); ctx.stroke();
  // つつみがみ
  ctx.save();
  ctx.beginPath(); ctx.moveTo(x - 0.4 * s, y + 0.06 * s); ctx.lineTo(x + 0.4 * s, y + 0.06 * s); ctx.lineTo(x, y + s * 1.02); ctx.closePath();
  ctx.fillStyle = "#fffaf6"; ctx.fill();
  ctx.clip();
  ctx.strokeStyle = "#ff8fab"; ctx.lineWidth = s * 0.05;
  for (let i = -6; i < 8; i++) { ctx.beginPath(); ctx.moveTo(x + i * 0.14 * s, y); ctx.lineTo(x + i * 0.14 * s - 0.5 * s, y + s * 1.1); ctx.stroke(); }
  ctx.fillStyle = linear(x - 0.4 * s, 0, x + 0.4 * s, 0, [[0, "rgba(0,0,0,.12)"], [0.4, "rgba(0,0,0,0)"], [1, "rgba(0,0,0,.2)"]]);
  ctx.fillRect(x - 0.5 * s, y, s, s * 1.1);
  ctx.restore();
}
function drawScene() {
  const { W, H, u } = CG, r = A.r * 0.95, x = A.x, y = A.y;
  if (showT > 0) {                      // できあがりを 大きく 見せる
    const cx = W / 2, cy = H * 0.52, s = 27 * u;
    circle(cx, cy, s * 2.2, radial(cx, cy, s * 0.3, cx, cy, s * 2.2, [[0, "rgba(255,224,130,.4)"], [1, "rgba(255,224,130,0)"]]));
    cone(cx, cy, s);
    return;
  }
  if (si === 0) {
    const ang = Math.abs(S.sum[0]) > Math.abs(S.sum[1]) ? S.sum[0] : S.sum[1];
    bowl(x, y, r * 1.05, ang);
  } else if (si === 1) {
    pan(x, y, r * 1.18);
    disc(x, y, r * (0.25 + 0.75 * Math.min(1, prog)), false);
  } else if (si === 2) {
    pan(x, y, r * 1.18);
    if (flipK >= 0) {                   // ちゅうに まって うらがえる
      const k = Math.min(1, flipK), lift = Math.sin(Math.PI * k);
      shadow(x, y, r * (1 - 0.4 * lift), r * (1 - 0.4 * lift), 0.35);
      disc(x, y - lift * r * 2.0, r * (1 + 0.12 * lift), k > 0.5, 1, Math.abs(Math.cos(Math.PI * k)) * 0.9 + 0.1);
    } else disc(x, y, r, false);
  } else if (si === 3 || si === 4) {
    shadow(x + r * 0.05, y + r * 0.1, r * 1.2, r * 1.2, 0.5);
    disc(x, y, r, true);
    cream(x, y, r, si === 3 ? prog : 1);
    toppings(x, y, r);
    if (si === 4) for (const it of S.items) if (!it.taken) { plate(it.x, it.y, 8.5 * u); topping(it.ch, it.x, it.y, 4.8 * u); }
  } else if (si === 5) {
    const sx = 1 - 0.55 * Math.min(1, prog);
    shadow(x + r * 0.05, y + r * 0.1, r * 1.2 * sx, r * 1.2, 0.5);
    disc(x, y, r, true, sx, 1);
    cream(x, y, r * sx, 1);
    toppings(x, y, r, sx);
  } else {
    shadow(x, y + r * 0.85, r * 0.5, r * 0.14, 0.5);
    cone(x, y - r * 0.2, r);
  }
}

CG.setup({
  id: "crepe",
  dim: 0.6,             // カメラを うすくして クレープを 見やすく
  title: "クレープやさん",
  desc: "からだを うごかして クレープを つくろう!",
  how: [
    "🥣 まぜる → のばす → ひっくりかえす → クリーム → トッピング → まく",
    "🙆 上に 出る <b>うごき</b> を まねすると つぎへ すすむ",
    "⏱ <b>はやく</b> できるほど 高とくてん",
  ],
  modes: [
    { key: "easy", label: "やさしい", sub: "かいすう すくなめ" },
    { key: "normal", label: "ふつう", sub: "" },
    { key: "hard", label: "むずかしい", sub: "2こ つくる" },
  ],
  start(mode) {
    M = MODES[mode]; crepe = 1; pause = 0; showT = 0; skipped = 0; allPicked = [];
    place();
    newCrepe();
    CG.bgm(112);
  },
  update(dt) {
    CG.setInfo("タイム", Math.floor(CG.time));
    place();

    if (showT > 0) {                    // できあがり
      showT -= dt;
      if (showT <= 0) {
        if (crepe >= M.crepes) {
          const n = STEPS.length * M.crepes;
          return CG.finish({
            rate: CG.score / (n * 100),
            stats: [["タイム", Math.floor(CG.time) + "びょう"], ["トッピング", allPicked.join("") || "なし"]],
          });
        }
        crepe++; newCrepe();
      }
    } else if (pause > 0) {             // つぎの こうていへの あいだ
      pause -= dt;
      if (flipK >= 0) flipK += dt / 0.7;
      if (pause <= 0) {
        flipK = -1;
        if (si + 1 < STEPS.length) enter(si + 1);
        else { showT = 2.2; CG.big(M.crepes > 1 ? `${crepe}こめ かんせい!` : "かんせい!"); CG.sfx("fanfare"); CG.burst(CG.W / 2, CG.H / 2, "#ffe066", 30); }
      }
    } else {
      stepT += dt;
      prog = STEPS[si].update(dt);
      const timeout = stepT > SKIP;
      if (prog >= 1 || timeout) {
        prog = 1;
        if (timeout) { skipped++; CG.pop("つぎへ", "miss"); }
        else {
          CG.addScore(Math.max(30, Math.round(100 - Math.max(0, stepT - PAR) * 6)));
          CG.pop(stepT <= PAR ? "ばっちり" : "OK", stepT <= PAR ? "perfect" : "good");
          CG.sfx("coin");
        }
        if (si === 2) flipK = 0;
        pause = 0.8;
      }
    }

    drawScene();
    CG.skeleton();
    if (showT <= 0) CG.bar(prog);
  },
});
</script>
