<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#7cc2f5;

  #ui button{font:bold 2vmin system-ui,sans-serif;border:0;border-radius:1.2vmin;padding:.9vmin 1.4vmin;

  *{-webkit-tap-highlight-color:transparent}
  button{touch-action:manipulation}
  canvas#c{width:100% !important;height:100% !important}
</style>

<script>
'use strict';
/* ============================================================
   そらのひこうき ― 指でなぞった線の上を飛行機が飛んでいくインタラクティブコンテンツ
   ・なぞる（マウスドラッグ／タッチ）と線がひける。はなすと飛行機がその線を飛ぶ
   ・タップだけなら、その場所でくるっと宙がえり
   ・マルチタッチで何機でも同時に飛ばせる
   ・10秒さわらないとヒントの文字が出る
   ・外部ファイル不要（画像はこのファイルに埋め込み）
   ============================================================ */
const GAME_ID = 'hikouki';

const CFG = {
  speed: 55,        // 飛ぶはやさ（U/秒）
  planeSize: 22,    // 飛行機の横はば（U）
  maxPlanes: 10,
  idleDemo: 10,     // 何秒だれもさわらないと、ヒントの文字を出すか
};

// ---------- キャンバス ----------
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, U = 1, DPR = 1;
let skyCanvas = null;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; U = Math.min(W, H) / 100;
  cv.width = W * DPR; cv.height = H * DPR;
  makeSky();
}
addEventListener('resize', resize);

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
function angDiff(a, b) { let d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; }

// ---------- 画像 ----------
function loadImg(b64) { const i = new Image(); i.src = 'data:image/png;base64,' + b64; return i; }
const planeImg = loadImg(ASSETS.plane);
const [PW, PH] = ASSETS.planeSize;
const PC = ASSETS.planeCenter, PT = ASSETS.planeTail;
const smokeImgs = ASSETS.smoke.map(loadImg);
const [SW, SH] = ASSETS.smokeSize;

// ---------- 空（背景） ----------
function makeSky() {
  skyCanvas = document.createElement('canvas');
  skyCanvas.width = W * DPR; skyCanvas.height = H * DPR;
  const s = skyCanvas.getContext('2d');
  s.scale(DPR, DPR);
  const g = s.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#2f7fe0');
  g.addColorStop(0.45, '#62b0f2');
  g.addColorStop(0.8, '#a9dcfb');
  g.addColorStop(1, '#e4f5ff');
  s.fillStyle = g; s.fillRect(0, 0, W, H);
}

// 下の雲海
let seaOff = 0;
function drawCloudSea(dt) {
  seaOff += dt * 3 * U;
  const rows = [
    { y: 0.93, r: 7, gap: 9, col: 'rgba(236,246,255,0.9)', sp: 0.6 },
    { y: 0.99, r: 9, gap: 11, col: 'rgba(255,255,255,1)', sp: 1 },
  ];
  for (const row of rows) {
    ctx.fillStyle = row.col;
    const gap = row.gap * U, off = (seaOff * row.sp) % gap;
    ctx.beginPath();
    for (let x = -gap - off, i = 0; x < W + gap; x += gap, i++) {
      const k = Math.floor((x + seaOff * row.sp) / gap);
      const rr = row.r * U * (0.8 + 0.35 * Math.abs(Math.sin(k * 1.7)));
      ctx.moveTo(x + rr, H * row.y); ctx.arc(x, H * row.y, rr, 0, Math.PI * 2);
    }
    ctx.fill();
    ctx.fillRect(0, H * row.y, W, H);
  }
}
// ---------- 音（WebAudio で合成） ----------
const Snd = {
  ac: null, on: true, noise: null,
  init() {
    if (this.ac) { if (this.ac.state !== 'running') this.ac.resume(); return; }
    try {
      this.ac = new (window.AudioContext || window.webkitAudioContext)();
      const len = this.ac.sampleRate * 2, b = this.ac.createBuffer(1, len, this.ac.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.noise = b;
    } catch (e) {}
  },
  whoosh(pan) {
    if (!this.on || !this.ac) return;
    const t = this.ac.currentTime;
    const src = this.ac.createBufferSource(); src.buffer = this.noise;
    const f = this.ac.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.2;
    f.frequency.setValueAtTime(300, t); f.frequency.exponentialRampToValueAtTime(1600, t + 0.6);
    f.frequency.exponentialRampToValueAtTime(500, t + 1.6);
    const g = this.ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.25, t + 0.35);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.7);
    let node = f.connect(g);
    if (this.ac.createStereoPanner) { const p = this.ac.createStereoPanner(); p.pan.value = clamp(pan, -1, 1); node = g.connect(p); }
    src.connect(f); node.connect(this.ac.destination);
    src.start(t); src.stop(t + 1.8);
    // きらっ
    [880, 1320].forEach((fr, i) => {
      const o = this.ac.createOscillator(), og = this.ac.createGain();
      o.type = 'sine'; o.frequency.value = fr;
      og.gain.setValueAtTime(0.0001, t + i * 0.08); og.gain.exponentialRampToValueAtTime(0.08, t + i * 0.08 + 0.01);
      og.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.08 + 0.3);
      o.connect(og).connect(this.ac.destination); o.start(t + i * 0.08); o.stop(t + i * 0.08 + 0.35);
    });
  },
};

// ---------- 線（なぞったあと） ----------
function smoothPath(raw) {
  // 1U ごとに打ち直してから、2回なめらかにする
  const step = U * 1;
  const pts = [raw[0]];
  let carry = 0;
  for (let i = 1; i < raw.length; i++) {
    const a = raw[i - 1], b = raw[i];
    const d = Math.hypot(b[0] - a[0], b[1] - a[1]);
    let t = step - carry;
    while (t <= d) { pts.push([a[0] + (b[0] - a[0]) * t / d, a[1] + (b[1] - a[1]) * t / d]); t += step; }
    carry = d - (t - step);
  }
  pts.push(raw[raw.length - 1]);
  for (let pass = 0; pass < 3; pass++) {
    for (let i = 2; i < pts.length - 2; i++) {
      pts[i] = [(pts[i - 2][0] + pts[i - 1][0] + pts[i][0] + pts[i + 1][0] + pts[i + 2][0]) / 5,
                (pts[i - 2][1] + pts[i - 1][1] + pts[i][1] + pts[i + 1][1] + pts[i + 2][1]) / 5];
    }
  }
  return pts;
}
function loopPath(cx, cy) {
  // タップした場所で宙がえり（はみ出しにくい向きを選ぶ）
  const dir = cx < W / 2 ? 1 : -1;
  const a = 10 * U, R = 13 * U, pts = [];
  for (let th = -0.6; th <= Math.PI * 2 + 0.6; th += 0.04) {
    pts.push([cx + dir * (a * (th - Math.PI) - R * Math.sin(th)), cy + R * Math.cos(th) - R * 0.2]);
  }
  return pts;
}
// ---------- 飛行機 ----------
class Plane {
  constructor(pts, demo) {
    this.pts = pts;
    this.cum = [0];
    for (let i = 1; i < pts.length; i++)
      this.cum.push(this.cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
    this.total = this.cum[this.cum.length - 1];
    this.s = 0;
    this.speed = CFG.speed * U * rand(0.95, 1.05);
    this.size = CFG.planeSize * U * rand(0.9, 1.05);
    [this.x, this.y] = pts[0];
    this.ang = this.headingAt(0);
    this.flip = Math.cos(this.ang) < 0 ? -1 : 1;    // 左向きのときは上下反転して、さかさまにならないように
    this.bank = 0;
    this.born = 0;
    this.onPath = true;
    this.puffAcc = 0;
    this.dead = false;
    this.demo = demo;
    this.ph = rand(0, 6);
  }
  pointAt(s) {
    s = clamp(s, 0, this.total);
    let lo = 0, hi = this.cum.length - 1;
    while (hi - lo > 1) { const m = (lo + hi) >> 1; if (this.cum[m] <= s) lo = m; else hi = m; }
    const seg = this.cum[hi] - this.cum[lo] || 1, t = (s - this.cum[lo]) / seg;
    const a = this.pts[lo], b = this.pts[hi];
    return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  }
  headingAt(s) {
    const d = 3 * U;
    const a = this.pointAt(s - d), b = this.pointAt(s + d);
    if (Math.hypot(b[0] - a[0], b[1] - a[1]) < 0.01) return this.ang || 0;
    return Math.atan2(b[1] - a[1], b[0] - a[0]);
  }
  update(dt) {
    this.born = Math.min(1, this.born + dt * 3);
    const prevAng = this.ang;
    if (this.onPath) {
      // 出だしはすこしゆっくり、だんだん加速
      const sp = this.speed * (0.55 + 0.45 * Math.min(1, this.s / (15 * U)));
      this.s += sp * dt;
      if (this.s >= this.total) { this.s = this.total; this.onPath = false; this.vx = Math.cos(this.ang) * sp; this.vy = Math.sin(this.ang) * sp; }
      [this.x, this.y] = this.pointAt(this.s);
      const target = this.headingAt(this.s);
      this.ang += angDiff(this.ang, target) * Math.min(1, dt * 12);
    } else {
      // 線のおわりからは、そのまままっすぐ画面の外へ
      const sp = Math.hypot(this.vx, this.vy) * (1 + dt * 0.8);
      this.vx = Math.cos(this.ang) * sp; this.vy = Math.sin(this.ang) * sp;
      this.x += this.vx * dt; this.y += this.vy * dt;
      const m = this.size * 2;
      if (this.x < -m || this.x > W + m || this.y < -m || this.y > H + m) this.dead = true;
    }
    // 旋回のかたむき（上下につぶして機体をかたむけて見せる）
    const turn = angDiff(prevAng, this.ang) / Math.max(dt, 1e-3);
    this.bank += (clamp(turn * 0.12, -0.5, 0.5) - this.bank) * Math.min(1, dt * 6);
    const ft = Math.cos(this.ang) < -0.15 ? -1 : Math.cos(this.ang) > 0.15 ? 1 : (this.flip >= 0 ? 1 : -1);
    this.flip += (ft - this.flip) * Math.min(1, dt * 5);   // くるっと回る

    // 飛行機雲
    this.puffAcc += Math.hypot(this.x - (this.lx ?? this.x), this.y - (this.ly ?? this.y));
    this.lx = this.x; this.ly = this.y;
    // 煙の2本のすじの先から、線にそって雲をのこす
    const k = this.size / PW, fy = this.flip * (1 - Math.abs(this.bank));
    const ca = Math.cos(this.ang), sa = Math.sin(this.ang);
    const lx = (PT[0] - PC[0]) * k;
    while (this.puffAcc > U * 1.1) {
      this.puffAcc -= U * 1.1;
      for (const oy of [-61.5, 61.5]) {
        const ly = oy * k * fy;
        puffs.push({ x: this.x + ca * lx - sa * ly + rand(-0.2, 0.2) * U, y: this.y + sa * lx + ca * ly + rand(-0.2, 0.2) * U,
          r: U * rand(0.6, 0.9), life: 2.6, max: 2.6 });
      }
    }
  }
  drawGuide(c) {
    if (!this.onPath) return;
    // まだ飛んでいない部分の線（点線）
    c.save();
    c.setLineDash([U * 1.2, U * 1.6]);
    c.lineDashOffset = -S.time * U * 6;
    c.strokeStyle = 'rgba(255,255,255,0.75)'; c.lineWidth = U * 0.6; c.lineCap = 'round';
    c.beginPath();
    const [sx, sy] = this.pointAt(this.s + this.size * 0.5);
    c.moveTo(sx, sy);
    let i = 0; while (i < this.cum.length && this.cum[i] < this.s + this.size * 0.5) i++;
    for (; i < this.pts.length; i++) c.lineTo(this.pts[i][0], this.pts[i][1]);
    c.stroke();
    c.restore();
    // ゴールの★
    const e = this.pts[this.pts.length - 1];
    drawStar(c, e[0], e[1], U * 1.6, 'rgba(255,240,150,0.9)', S.time * 2);
  }
  draw(c) {
    const k = this.size / PW * (0.4 + 0.6 * easeOutBack(this.born));
    c.save();
    c.translate(this.x, this.y + Math.sin(S.time * 3 + this.ph) * U * 0.25);
    c.rotate(this.ang);
    const fy = this.flip * (1 - Math.abs(this.bank));
    c.scale(k, k * (Math.abs(fy) < 0.08 ? 0.08 * Math.sign(fy || 1) : fy));
    // 噴射の煙（GIF の4コマを順番に）
    const fi = Math.floor(S.time * 1000 / ASSETS.smokeDur) % smokeImgs.length;
    const smk = smokeImgs[fi];
    if (smk.complete) {
      c.globalAlpha = 0.9;
      c.drawImage(smk, (PT[0] - PC[0]) - SW + 8, -SH / 2 - 8);
      c.globalAlpha = 1;
    }
    if (planeImg.complete) c.drawImage(planeImg, -PC[0], -PC[1]);
    c.restore();
  }
}
function easeOutBack(t) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
function drawStar(c, x, y, r, col, rot) {
  c.save(); c.translate(x, y); c.rotate(rot); c.fillStyle = col; c.beginPath();
  for (let j = 0; j < 10; j++) { const a = j * Math.PI / 5 - Math.PI / 2, rr = j % 2 ? r * 0.45 : r; c.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); }
  c.fill(); c.restore();
}

const planes = [];
const puffs = [];
const sparks = [];
function launch(pts, demo) {
  if (pts.length < 2) return;
  const p = new Plane(pts, demo);
  planes.push(p);
  if (planes.length > CFG.maxPlanes) planes.shift();
  Snd.whoosh((pts[0][0] / W) * 2 - 1);
  for (let i = 0; i < 12; i++) {
    const a = rand(0, 6.28), s = rand(8, 22) * U;
    sparks.push({ x: pts[0][0], y: pts[0][1], vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.4, 0.8), r: rand(0.8, 1.6) * U });
  }
}

// ---------- 入力 ----------
const S = { time: 0, lastInput: -100, demoT: 0 };
const strokes = new Map();   // pointerId -> [[x,y],...]

cv.addEventListener('pointerdown', e => {
  Snd.init();
  cv.setPointerCapture(e.pointerId);
  S.lastInput = S.time;
  strokes.set(e.pointerId, [[e.clientX, e.clientY]]);
});
cv.addEventListener('pointermove', e => {
  const st = strokes.get(e.pointerId);
  if (!st) return;
  S.lastInput = S.time;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) {
    const l = st[st.length - 1];
    if (Math.hypot(ev.clientX - l[0], ev.clientY - l[1]) > U * 0.5) st.push([ev.clientX, ev.clientY]);
  }
});
function endStroke(e) {
  const st = strokes.get(e.pointerId);
  if (!st) return;
  strokes.delete(e.pointerId);
  let len = 0;
  for (let i = 1; i < st.length; i++) len += Math.hypot(st[i][0] - st[i - 1][0], st[i][1] - st[i - 1][1]);
  if (len < 4 * U) launch(loopPath(st[0][0], st[0][1]), false);
  else launch(smoothPath(st), false);
}
cv.addEventListener('pointerup', endStroke);
cv.addEventListener('pointercancel', endStroke);
cv.addEventListener('contextmenu', e => e.preventDefault());

// ---------- ボタン ----------
function goHome() {
  if (window.parent !== window) window.parent.postMessage({ type: 'minigame-exit', game: GAME_ID }, '*');
  else history.back();
}
function toggleFull() {
  const de = document.documentElement;
  if (!(document.fullscreenElement || document.webkitFullscreenElement)) {
    if (de.requestFullscreen) de.requestFullscreen().catch(() => {});
    else if (de.webkitRequestFullscreen) de.webkitRequestFullscreen();   // iPad の Safari
  } else if (document.exitFullscreen) document.exitFullscreen();
  else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
}
function toggleSound() {
  Snd.on = !Snd.on; Snd.init();
  document.getElementById('bSound').textContent = Snd.on ? '🔊' : '🔇';
  try { localStorage.setItem(GAME_ID + ':sound', Snd.on ? '1' : '0'); } catch (e) {}
}
try { if (localStorage.getItem(GAME_ID + ':sound') === '0') { Snd.on = false; document.getElementById('bSound').textContent = '🔇'; } } catch (e) {}
document.getElementById('bHome').onclick = goHome;
document.getElementById('bFull').onclick = toggleFull;
document.getElementById('bSound').onclick = toggleSound;
addEventListener('keydown', e => {
  Snd.init();
  if (e.key === 'f' || e.key === 'F') toggleFull();
  else if (e.key === 'm' || e.key === 'M') toggleSound();
  else if (e.key === 'Escape') goHome();
});

const FONT = '"Hiragino Maru Gothic ProN","Hiragino Maru Gothic Pro","BIZ UDPGothic","Meiryo",system-ui,sans-serif';

// ---------- メインループ ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  S.time += dt;

  for (const p of planes) p.update(dt);
  for (let i = planes.length - 1; i >= 0; i--) if (planes[i].dead) planes.splice(i, 1);

  const idle = S.time - S.lastInput;

  // ---- 描画 ----
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.drawImage(skyCanvas, 0, 0, W, H);
  drawCloudSea(dt);

  // 飛行機雲
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i];
    p.life -= dt; p.r += dt * U * 1.1; p.x -= dt * U * 3;
    if (p.life <= 0) { puffs.splice(i, 1); continue; }
  }
  if (puffs.length > 2500) puffs.splice(0, puffs.length - 2500);
  ctx.fillStyle = '#fff';
  for (const p of puffs) {
    ctx.globalAlpha = 0.55 * Math.pow(p.life / p.max, 1.4);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  for (const p of planes) p.drawGuide(ctx);

  // なぞっている途中の線
  for (const st of strokes.values()) {
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = U * 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); st.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke();
    ctx.setLineDash([U * 1.2, U * 1.6]);
    ctx.strokeStyle = 'rgba(255,255,255,0.95)'; ctx.lineWidth = U * 0.6;
    ctx.stroke();
    ctx.restore();
    const l = st[st.length - 1];
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath(); ctx.arc(l[0], l[1], U * (1.4 + Math.sin(S.time * 10) * 0.3), 0, 7); ctx.fill();
    drawStar(ctx, st[0][0], st[0][1], U * 1.6, 'rgba(255,240,150,0.95)', -S.time * 2);
  }

  // 出発のきらきら
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vx *= 0.93; s.vy *= 0.93;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, s.life * 2);
    drawStar(ctx, s.x, s.y, s.r, '#fff7c2', s.life * 5);
  }
  ctx.globalAlpha = 1;

  for (const p of planes) p.draw(ctx);

  // だれもいないときだけ、うすくヒント
  if (idle > CFG.idleDemo) {
    const a = Math.min(1, (idle - CFG.idleDemo) / 1.5) * (0.75 + 0.25 * Math.sin(S.time * 2));
    ctx.globalAlpha = a;
    ctx.font = `900 ${U * 4.5}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = U * 1.1; ctx.strokeStyle = 'rgba(40,110,190,0.8)';
    const msg = 'ゆびで そらに せんを かいてね';
    ctx.strokeText(msg, W / 2, H * 0.9); ctx.fillStyle = '#fff'; ctx.fillText(msg, W / 2, H * 0.9);
    ctx.globalAlpha = 1;
  }

  requestAnimationFrame(frame);
}

resize();
S.lastInput = S.time - CFG.idleDemo + 2;   // 起動して少ししたら、ヒントの文字を出す
requestAnimationFrame(frame);
</script>
<script>
/* ---- iPhone / iPad（Safari）むけの調整 ---- */
(function () {
  const d = document;
  // 1) 見えている大きさが変わったら描き直す（アドレスバーが出たり消えたりしたとき・画面を回したとき）
  const re = () => { try { resize(); } catch (e) {} };
  if (window.visualViewport) visualViewport.addEventListener('resize', re);
  addEventListener('orientationchange', () => { setTimeout(re, 250); setTimeout(re, 700); });
  addEventListener('pageshow', re);
  // 2) 指2本での拡大・ダブルタップでの拡大・画面のひっぱりスクロールを止める
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(t => d.addEventListener(t, e => e.preventDefault(), { passive: false }));
  d.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  let lastEnd = 0;
  d.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastEnd < 350 && !e.target.closest('button')) e.preventDefault();
    lastEnd = now;
  }, { passive: false });
  // 3) 全画面にできないブラウザ（iPhone の Safari）では、全画面ボタンをかくす
  const fsOK = d.fullscreenEnabled || d.webkitFullscreenEnabled;
  const fb = d.getElementById('bFull');
  if (fb && !fsOK) fb.style.display = 'none';
  // 4) 音：さわったときに必ず音を出せる状態にする（iPhone は最初にさわるまで音が出ない）
  const unlock = () => {
    try {
      Snd.init();
      const ac = Snd.ac;
      if (!ac) return;
      if (ac.state !== 'running') ac.resume();
      if (!Snd._unlocked) {
        const b = ac.createBuffer(1, 1, 22050), s = ac.createBufferSource();
        s.buffer = b; s.connect(ac.destination); s.start(0);
        Snd._unlocked = true;
      }
    } catch (e) {}
  };
  ['touchstart', 'touchend', 'pointerdown', 'click', 'keydown'].forEach(t => d.addEventListener(t, unlock, { capture: true, passive: true }));
  // ほかのアプリから もどってきたとき、音を止まったままにしない
  d.addEventListener('visibilitychange', () => { if (!d.hidden) { Snd._unlocked = false; } });
})();
</script>
